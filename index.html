<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GO Organizer</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2563eb">
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#1c2233; --muted:#6b7389; --line:#e2e6ef;
  --acc:#2f6fed; --acc2:#e8f0ff; --good:#1e9e5a; --warn:#d98a00; --bad:#d64545;
  --gold:#e0a800; --shadow:0 1px 3px rgba(20,30,60,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141c; --card:#1a1f2b; --ink:#e7eaf2; --muted:#98a0b5; --line:#2b3242;
    --acc:#6b9bff; --acc2:#22304d; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#11141c; --card:#1a1f2b; --ink:#e7eaf2; --muted:#98a0b5; --line:#2b3242;
  --acc:#6b9bff; --acc2:#22304d; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;max-width:1200px;margin:0 auto;padding:10px 16px}
.top h1{font-size:18px;margin:0;flex:1}
nav{display:flex;gap:4px;max-width:1200px;margin:0 auto;padding:0 16px;overflow-x:auto}
nav button{border:0;background:none;color:var(--muted);padding:10px 14px;font:inherit;font-weight:600;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--acc);border-color:var(--acc)}
main{max-width:1200px;margin:0 auto;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:60px}
button.b{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button.b:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.s{padding:4px 8px;font-size:13px}
button.d{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.mon{cursor:pointer;position:relative}
.mon img{width:96px;height:96px;object-fit:contain;display:block;margin:0 auto}
.pic{position:relative;width:112px;height:112px;margin:0 auto;border-radius:12px;overflow:hidden;flex:none}
.pic img.picbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;margin:0}
.pic img.picmon{position:relative;width:100%;height:100%;object-fit:contain;margin:0}
.pic.hasbg img.picmon{padding:6px;box-sizing:border-box}
.pic.dmx img.picmon{padding:5px;box-sizing:border-box;filter:drop-shadow(0 0 2px rgba(255,31,107,.95)) drop-shadow(0 0 5px rgba(255,31,107,.55))}
.picker{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:8px;max-height:340px;overflow:auto}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:6px}
.pitem{border:2px solid transparent;border-radius:9px;padding:2px;cursor:pointer;background:none;font:inherit;font-size:11px;color:inherit;text-align:center;line-height:1.25}
.pitem.on{border-color:var(--acc);background:var(--acc2)}
.pitem img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;display:block;margin:0 0 3px;background:var(--line)}
.pitem .none{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:7px;background:var(--line);margin-bottom:3px;font-size:20px}
.mon .nm{font-weight:700;text-align:center}
.mon .sub{color:var(--muted);font-size:13px;text-align:center;min-height:18px}
.badges{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}
.bd{font-size:11px;font-weight:700;padding:2px 6px;border-radius:99px;background:var(--acc2);color:var(--acc)}
.bd.sh{background:#fff3c4;color:#8a6500}.bd.cr{background:#ece3ff;color:#5b2fb5}.bd.lu{background:#fff0c2;color:#9a6c00}
.bd.er{background:#e2f6ff;color:#0b6c91}.bd.dy{background:#ffe2ea;color:#b0244b}.bd.mg{background:#efe4ff;color:#6a2fb8}.bd.adv{background:#fff4d6;color:#8a5a00}
.mnote{font-size:12px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.bd.bg{background:#e3f7e9;color:#1b7a43}.bd.fm{background:#e6ecff;color:#2f4fb3}.bd.mv{background:#fde4cf;color:#a3470d}.bd.sz{background:#f0e6da;color:#7a4b1b}
.ivrow{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;color:var(--muted)}
.ivp{font-weight:800;color:var(--ink)}
.stars{color:var(--gold);letter-spacing:1px}
.fav{position:absolute;top:8px;right:10px;color:var(--gold)}
.muted{color:var(--muted)}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}
.prog>i{display:block;height:100%;background:var(--acc)}
.fr h3{margin:0;font-size:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.hearts{font-size:15px;letter-spacing:2px}
.st{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.toast{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;z-index:50;background:var(--card,#222);color:inherit;border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.25);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;max-width:min(460px, calc(100vw - 24px));font-size:14px}
.st.ok{background:#dcf5e7;color:#16774a}.st.lo{background:#fff1d6;color:#8a5a00}.st.no{background:#ffe0e0;color:#a52a2a}.st.uk{background:var(--line);color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
dialog{border:0;border-radius:14px;padding:0;background:var(--card);color:var(--ink);width:min(680px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(10,15,30,.5)}
.dh{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:17px;flex:1}
.db{padding:16px;overflow:auto;max-height:calc(92vh - 120px)}
.df{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fg label,.fl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.fg label input,.fg label select{color:var(--ink);font-weight:400;font-size:15px}
.chk{flex-direction:row!important;align-items:center;gap:6px!important;font-size:14px!important;color:var(--ink)!important}
.sec{margin:16px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.viv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.viv .card{padding:10px}
.viv .own{border-color:var(--good)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px;border:1px solid rgba(0,0,0,.15)}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat .card{padding:10px 14px;min-width:120px}
.stat b{font-size:20px;display:block}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.note{font-size:13px;color:var(--muted)}
@media (max-width:520px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.mon img{width:72px;height:72px}.mon .pic{width:88px;height:88px}.mon .pic img{width:100%;height:100%}}

/* Schwebender Hinzufügen-Knopf (rechts unten, links unten liegt das ☁︎-Feld des Syncs) */
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));z-index:15;width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:30px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(20,40,120,.35);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:hover{transform:scale(1.07)}
.navb{display:flex;align-items:center;gap:6px;margin-right:auto;flex-wrap:wrap}
button.b:disabled{opacity:.4;cursor:default}
.df{flex-wrap:wrap}
/* Poke-Genie-Abgleich */
.rvlist{display:grid;gap:10px}
.rv.dec{border-color:var(--good)}
.rv .pic{width:84px;height:84px}
.rv select{max-width:340px;min-width:200px}
.rv select.decided{border-color:var(--good);background:#e7f7ee;color:#16774a}
table.rvt{margin-top:8px;font-size:13px}
table.rvt td.pick{background:#e7f7ee;font-weight:700;color:#16774a}
@media (max-width:640px){.rv > .row{flex-wrap:wrap}.rv select{max-width:100%;width:100%}}
.fab[hidden]{display:none}
main{padding-bottom:90px}

/* Home-Bildschirm-App am iPhone: nicht unter Statusleiste/Notch zeichnen */
header{padding-top:env(safe-area-inset-top)}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}

<!-- GitHub-Sync (gemeinsam für alle Tools, Einstellungen auf der Startseite) -->
<script src="/startseite/sync-v1.js"></script>
<script>
/* ===================== Daten & Speicher (IndexedDB) ===================== */
// Daten liegen in IndexedDB "pokemon-go-tool" (Store "kv", Eintrag "state").
// localStorage enthält nur noch das Theme ("go-organizer-theme").
const LEGACY_KEY = 'go-organizer-v1';
const DB_NAME = 'pokemon-go-tool', DB_STORE = 'kv', DB_REC = 'state';
const blank = () => ({ pokemon: [], friends: [], postcards: [], regionHints: {}, places: {}, vivCards: {}, version: 1 });
let S = blank();
let SYNC = null;              // GitHub-Sync, siehe initSync()
let STORE_MODE = 'idb';      // 'idb' | 'readonly' (IndexedDB fehlt: nur lesen/exportieren) | 'locked'
let PERSISTED = null;
let db = null;

function idbOpen(){
  return new Promise((res, rej) => {
    if (!('indexedDB' in window)) return rej(new Error('IndexedDB nicht verfügbar'));
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('Datenbank blockiert – bitte andere Tabs dieses Tools schließen'));
  });
}
function idbGet(key = DB_REC){
  return new Promise((res, rej) => {
    const t = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(key);
    t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error);
  });
}
function idbPut(val, key = DB_REC){
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(val, key);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('Schreibvorgang abgebrochen'));
  });
}
function idbDel(key){
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(key);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
const plain = o => JSON.parse(JSON.stringify(o));

/* Sichtbarer Hinweis bei Speicherproblemen */
function storeBanner(msg){
  let el = document.getElementById('storeErr');
  if (!msg){ if (el) el.remove(); return; }
  if (!el){
    el = document.createElement('div'); el.id = 'storeErr';
    el.style.cssText = 'background:#d64545;color:#fff;padding:10px 16px;font-weight:600;position:sticky;top:0;z-index:20';
    document.body.prepend(el);
  }
  el.innerHTML = `⚠️ ${esc(msg)} <button class="b s" id="storeErrExp" style="margin-left:8px">Jetzt als JSON sichern</button>`;
  document.getElementById('storeErrExp').onclick = () => exportJSON();
}

let saveChain = Promise.resolve(), pending = 0;
function save(){
  if (STORE_MODE === 'locked'){ storeBanner('Gespeicherte Daten konnten nicht gelesen werden – Speichern ist gesperrt, damit nichts überschrieben wird. Seite neu laden oder Sicherung importieren.'); return Promise.resolve(false); }
  // Ohne IndexedDB wird bewusst NICHT in den gemeinsamen localStorage ausgewichen (zu groß, würde andere Tools blockieren)
  if (STORE_MODE !== 'idb'){ storeBanner('IndexedDB ist in diesem Browser nicht verfügbar – Änderungen können nicht gespeichert werden. Bitte als JSON sichern.'); return Promise.resolve(false); }
  const snap = plain(S); pending++;
  saveChain = saveChain.then(async () => {
    try{
      await idbPut(snap);
      storeBanner(''); if (SYNC) SYNC.changed(); return true;
    }catch(e){
      const quota = e && (e.name === 'QuotaExceededError' || /quota/i.test(e.message || ''));
      storeBanner(`Speichern fehlgeschlagen${quota ? ' – Speicherplatz voll' : ''} (${e?.message || e}). Letzte Änderungen sind NICHT gesichert.`);
      return false;
    }finally{ pending--; }
  });
  return saveChain;
}
window.addEventListener('beforeunload', e => { if (pending > 0 || document.getElementById('storeErr')){ e.preventDefault(); e.returnValue = ''; } });

async function initStore(){
  try{
    db = await idbOpen();
    let data = await idbGet();
    if (data == null){
      // Erster Start mit IndexedDB: Daten aus localStorage übernehmen
      let raw = null; try{ raw = localStorage.getItem(LEGACY_KEY); }catch(e){}
      if (raw){
        let old;
        try{ old = JSON.parse(raw); }catch(e){
          STORE_MODE = 'locked';
          storeBanner('Alte Daten im localStorage sind beschädigt und wurden nicht übernommen (sie bleiben unangetastet). Bitte eine JSON-Sicherung importieren.');
          return;
        }
        await idbPut(old);
        const check = await idbGet();
        const ok = check && JSON.stringify(check) === JSON.stringify(old);
        if (!ok) throw new Error('Übernahme konnte nicht bestätigt werden');
        try{ localStorage.removeItem(LEGACY_KEY); }catch(e){}
        data = check;
        console.info('GO Organizer: Daten aus localStorage nach IndexedDB übernommen');
      }
    } else {
      // Daten sind bereits in IndexedDB – ein evtl. übrig gebliebener alter Schlüssel ist überflüssig
      try{ localStorage.removeItem(LEGACY_KEY); }catch(e){}
    }
    S = Object.assign(blank(), data || {});
  }catch(e){
    // IndexedDB fehlt: alte Daten aus dem localStorage nur anzeigen (zum Exportieren), nichts schreiben, nichts löschen
    console.warn(e);
    STORE_MODE = 'readonly';
    try{ const raw = localStorage.getItem(LEGACY_KEY); S = Object.assign(blank(), raw ? JSON.parse(raw) : {}); }
    catch(err){ STORE_MODE = 'locked'; S = blank(); storeBanner('Gespeicherte Daten konnten nicht gelesen werden. Speichern ist gesperrt, damit nichts überschrieben wird.'); return; }
    storeBanner(`IndexedDB nicht verfügbar (${e.message}) – nur Ansicht und JSON-Export möglich, Änderungen werden nicht gespeichert.`);
    return;
  }
  try{ for (const k of ['go-organizer-dex', 'go-organizer-dex-v2']) localStorage.removeItem(k); }catch(e){}
  if (S.pokemon.some(p => 'pvp' in p)){ S.pokemon.forEach(p => delete p.pvp); save(); }
  if (migrateFriends() | migrateXpDigits() | migrateCostumeKeys() | migratePostcards() | migrateVivCards() | migrateOrigin()) save();
  try{ REV = (await idbGet(REV_KEY)) || null; if (REV) REV.done ||= {}, REV.dec ||= {}; }catch(e){ REV = null; }
  try{ if (navigator.storage?.persist) PERSISTED = (await navigator.storage.persisted()) || (await navigator.storage.persist()); }catch(e){}
}
function exportJSON(suffix){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
  a.download = `go-organizer-${today()}${typeof suffix === 'string' ? '-' + suffix : ''}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const fmtDate = d => d ? new Date(d + 'T12:00').toLocaleDateString('de-DE') : '–';
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
const nf = n => n == null ? '–' : n.toLocaleString('de-DE');

/* ===================== Pokédex (Namen fest eingebaut) ===================== */
let DEX = {};          // id -> {de, en}
let NAME2ID = {};      // lower name -> id

  const de = DEX_DE.split('|'), en = DEX_EN.split('|'), d = {};
  de.forEach((n, i) => d[i + 1] = { de: n, en: en[i] });

function setDex(d){
  DEX = d; NAME2ID = {};
  const opts = [];
  for (const id of Object.keys(d).map(Number).sort((a,b)=>a-b)){
    const n = d[id]; const de = n.de || n.en;
    if (n.de) NAME2ID[n.de.toLowerCase()] = id;
    if (n.en) NAME2ID[n.en.toLowerCase()] ||= id;
    opts.push(`<option value="${esc(de)}">#${id} ${esc(de)}</option>`);
  }
  document.getElementById('dlSpecies').innerHTML = opts.join('');
  // bereits gespeicherte Pokémon auf deutsche Namen umstellen
  let changed = false;
  for (const p of S.pokemon){
    const id = p.dex || NAME2ID[(p.name || '').toLowerCase()];
    const de = id && DEX[id]?.de;
    if (de && p.name !== de){ p.name = de; p.dex = id; changed = true; }
  }
  if (changed){ save(); render(); }
}

function gmaxKey(p){
  const g = (FORMDATA[p.dex] || []).filter(t => t[1].includes('gmax'));
  if (!g.length) return null;
  const ft = findForm(p.dex, p.form);
  const t = (ft && g.find(t => t[1].startsWith(ft[1]))) || g[0];

}

}

// Hat das Land laut Tabelle nur ein Muster und ist beim Freund noch keins eingetragen, wird es gesetzt.
function migrateOrigin(){

    f.country = o.country; f.region = o.region;

    const pv = vivOfCountry(f.country);

}
// Purmel-Begegnungen: 3 Karten → 1., +9 → 2., danach je +15
function vivEncounters(n){ if (n < 3) return [0, 3]; if (n < 12) return [1, 12]; const k = Math.floor((n - 12) / 15); return [2 + k, 12 + 15 * (k + 1)]; }

/* ===================== Freundschaft ===================== */
// Level 0–5. FT = Tage/Punkte ab Freundschaftsbeginn, ab denen das Level erreicht ist.
// Bester Freund → Allerbester Freund: 90 Freundschaftspunkte (1/Tag + Bonus aus Wochenaufgaben).
const FL = ['Freund', 'Guter Freund', 'Superfreund', 'Hyperfreund', 'Bester Freund', 'Allerbester Freund'];
const FT = [0, 1, 7, 30, 90, 180];
const MAXLVL = FL.length - 1;
const spanOf = lvl => lvl >= MAXLVL ? null : FT[lvl + 1] - FT[lvl];
const unitOf = (lvl, n) => lvl === 4 ? (n === 1 ? 'Punkt' : 'Punkte') : (n === 1 ? 'Tag' : 'Tage');
// Tage bis zur nächsten Prüfung, gestaffelt nach Status. Es zählt der kürzere Wert aus „Spielt“ und „Freundschaft“.
// Spielt: Inaktiv? 7 · Ruhig 14 · Aktiv 30 · Freundschaft: stockt 14 · wächst 30 · Unklar 14 · Nicht bewertbar 30
const CHECK_AFTER = { no: 7, lo: 14, ok: 30, uk: 14, na: 30, frStall: 14, frOk: 30 };
// Ab so vielen Tagen ohne Fortschritt gilt die Freundschaft als stockend
const FR_STALL = 7;
const addDays = (d, n) => { const x = new Date(d + 'T12:00'); x.setDate(x.getDate() + n); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
// Prüfintervall pro Freund um bis zu ±25 % gestreut (fest pro Freund, aus der id), damit nicht alle am selben Tag fällig werden.
const CHECK_SPREAD = 0.25;
const idFrac = id => { let h = 2166136261; for (const ch of String(id)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return (h >>> 0) / 4294967296; };
const spreadDays = (n, id) => id == null ? n : Math.max(1, Math.round(n * (1 + CHECK_SPREAD * (2 * idFrac(id) - 1))));
const withDue = (a, c, n, id) => { a.nextCheck = addDays(c, spreadDays(n ?? CHECK_AFTER[a.key || a.cls], id)); a.due = a.nextCheck <= today(); return a; };
// EP werden nur mit den letzten 4 Ziffern notiert und verglichen (volle Zahlen werden gekürzt)
const XP_DIGITS = 4, XP_MOD = 10 ** XP_DIGITS;
const xpS = v => (v == null || v === '' || isNaN(+v)) ? null : Math.abs(Math.round(+v)) % XP_MOD;
const xpFmt = v => xpS(v) == null ? '–' : '…' + String(xpS(v)).padStart(XP_DIGITS, '0');
// Einmalige Korrektur: Prüfungen ab dem 30.10.2026, bei denen volle EP eingetragen wurden, auf 4 Ziffern kürzen
// und die EP-Änderung neu bewerten (Vergleich nur über die letzten 4 Ziffern).
// Kostüm-Bilder zurückgebaut: ein gewähltes Bild wird zu Text, falls noch kein Kostüm-Text da ist
function migrateCostumeKeys(){
  let ch = false;
  for (const p of S.pokemon){
    if (!('costumeKey' in p)) continue;
    if (p.costumeKey && !(p.costume || '').trim()) p.costume = costumeLabel(p.costumeKey.replace(/^f[A-Z0-9_]+\./, ''));
    delete p.costumeKey; ch = true;
  }
  return ch;
}
function migrateXpDigits(){
  if (S.xpDigits === XP_DIGITS) return false;
  const FROM = '2026-10-30';
  for (const f of S.friends){
    for (const sn of f.snaps || []) if (sn.date >= FROM && sn.xp != null) sn.xp = xpS(sn.xp);
    if ((f.lastCheck || '') >= FROM){
      if (f.xp != null) f.xp = xpS(f.xp);
      if (f.chk && f.chk.xp != null) f.chk.xp = xpS(f.chk.xp);
      const sn = (f.snaps || []).slice().sort((a, b) => a.date.localeCompare(b.date));
      const cur = sn.find(x => x.date === f.lastCheck);
      const prev = sn.filter(x => x.date < f.lastCheck).pop();
      if (cur && prev && cur.xp != null && prev.xp != null){
        const changed = xpS(cur.xp) !== xpS(prev.xp) || (cur.lvl != null && prev.lvl != null && cur.lvl > prev.lvl);
        if (changed) f.xpChanged = f.lastCheck;
        else if (f.xpChanged === f.lastCheck) f.xpChanged = prev.date;   // spätestens seit der Vorprüfung unverändert
      }
    }
    if (f.chk) delete f.chk.xpComparable;
  }
  S.xpDigits = XP_DIGITS;
  return true;
}

function friendProgress(f){
  const lvl = f.level || 0;
  const span = spanOf(lvl);
  if (span == null) return { pct: 100, left: null, next: null };
  const left = Math.max(0, Math.min(span, f.left ?? span));
  return { pct: (span - left) / span * 100, left, next: FL[lvl + 1], unit: unitOf(lvl, left) };
}
// Kandidaten zum Entfernen: Punkte aus Aktivität, Freundeslevel, Glücksfreund und Muster-Einzigartigkeit.
// Reallife-Freunde (irl) nie; Freunde ohne Prüfung in den letzten REMOVE_FRESH Tagen werden nicht bewertet.
const REMOVE_FRESH = 60, REMOVE_MIN = 40;
function removeScore(f, ac){
  if (f.irl) return { score: null, why: ['Reallife-Freund'] };
  ac = ac || activity(f);
  if (!f.lastCheck || daysBetween(f.lastCheck, today()) > REMOVE_FRESH) return { score: null, why: ['erst prüfen'] };
  if (ac.key === 'na') return { score: null, why: ['nicht bewertbar'] };
  let sc = 0; const why = [];
  const add = (n, t) => { sc += n; why.push((n > 0 ? '+' : '') + n + ' ' + t); };
  if (ac.play){ if (ac.play.cls === 'no') add(40, `spielt nicht (${ac.play.stale} T ohne EP)`); else if (ac.play.cls === 'lo') add(15, 'spielt wenig'); }
  if (ac.fr){ if (ac.fr.cls === 'no') add(25, `Freundschaft stockt (${ac.fr.stale} T)`); else if (ac.fr.cls === 'lo') add(15, 'Freundschaft stockt'); }
  if (ac.ignores) add(10, 'spielt, interagiert aber nicht');
  const lv = f.level || 0;
  const lvPts = [20, 15, 10, 5, 0, -15][lv]; if (lvPts) add(lvPts, lvPts > 0 ? `nur ${FL[lv]}` : `${FL[lv]} – Level ginge verloren`);
  if (lv === 4 && !ac.ignores && ac.fr && ac.fr.cls === 'ok') add(-10, 'arbeitet an Allerbester Freund');
  if (f.lucky) add(-30, 'Glücksfreund – Glückstausch offen');
  if (f.viv){
    const others = S.friends.filter(x => x.id !== f.id && x.viv === f.viv).length;
    const owned = S.pokemon.some(p => p.dex === 666 && p.viv === f.viv);
    if (!others) add(owned ? -15 : -30, `einziger Freund mit ${VIVMAP[f.viv]?.[1]}${owned ? '' : ' (fehlt dir noch)'}`);
    else if (others === 1) add(-5, `nur 2 Freunde mit ${VIVMAP[f.viv]?.[1]}`);
  }
  return { score: sc, why };
}
// Prüfstatus: wie lange hatte sich zum Zeitpunkt der letzten Prüfung nichts mehr geändert?
function activity(f){
  const c = f.lastCheck;
  if (!c) return { cls: 'uk', txt: 'Nie geprüft', detail: '', due: true, nextCheck: '', checkAge: null, stale: null, play: null, fr: null, ignores: false };
  const checkAge = daysBetween(c, today());
  const lv80 = (f.trainerLvl || 0) >= 80;
  const maxFr = (f.level || 0) >= MAXLVL;
  const ageTo = d => d ? Math.max(0, daysBetween(d, c)) : null;
  // Spielt: aus den EP. Bei Lv 80 ändern sich die EP nicht mehr → nicht messbar.
  let play = null;
  if (!lv80){
    const st = ageTo(f.xpChanged);
    play = st == null ? { cls: 'uk', txt: 'Unklar', stale: null }
      : st < 7 ? { cls: 'ok', txt: 'Aktiv', stale: st } : st < 21 ? { cls: 'lo', txt: 'Ruhig', stale: st } : { cls: 'no', txt: 'Inaktiv?', stale: st };
  }
  // Freundschaft: aus Freundeslevel und Resttagen. Beim Allerbesten Freund gibt es kein weiteres Level → nicht messbar.
  let fr = null;
  if (!maxFr){
    const st = ageTo(f.friendChanged);
    fr = st == null ? { cls: 'uk', txt: 'Unklar', stale: null }
      : st < FR_STALL ? { cls: 'ok', txt: 'Wächst', stale: st } : { cls: st < 21 ? 'lo' : 'no', txt: 'Stockt', stale: st };
  }
  if (!play && !fr) return withDue({ cls: 'uk', key: 'na', txt: 'Nicht bewertbar', detail: 'Lv 80 und Allerbester Freund – über EP und Freundschaft nicht messbar', checkAge, stale: null, play, fr, ignores: false }, c, undefined, f.id);
  // Hauptstatus (Filter „Inaktiv?“ usw.) = Spielt; bei Lv 80 ersatzweise die Freundschaft wie bisher
  const main = play || { cls: fr.cls === 'ok' ? 'ok' : fr.cls, txt: fr.cls === 'ok' ? 'Aktiv' : fr.cls === 'uk' ? 'Unklar' : fr.cls === 'lo' ? 'Ruhig' : 'Inaktiv?' };
  const ignores = !!(play && play.cls === 'ok' && fr && (fr.cls === 'lo' || fr.cls === 'no'));
  const lastChange = (lv80 ? [f.friendChanged] : [f.xpChanged, f.friendChanged]).filter(Boolean).sort().pop();
  const stale = lastChange ? Math.max(0, daysBetween(lastChange, c)) : null;
  const tage = n => n === 0 ? 'Änderung am Prüftag' : `${n} T ohne Änderung`;
  const detail = [play && play.stale != null ? 'EP: ' + tage(play.stale) : '', fr && fr.stale != null ? 'Freundschaft: ' + tage(fr.stale) : ''].filter(Boolean).join(' · ');
  const n = Math.min(play ? CHECK_AFTER[play.cls] : 1e9, fr ? (fr.cls === 'ok' ? CHECK_AFTER.frOk : fr.cls === 'uk' ? CHECK_AFTER.uk : CHECK_AFTER.frStall) : 1e9);
  return withDue({ cls: main.cls, txt: main.txt, detail, checkAge, stale, play, fr, ignores }, c, n, f.id);
}
// Alte Freunde (Version mit f.days) auf Resttage umstellen
function migrateFriends(){
  let ch = false;
  for (const f of S.friends){
    if (f.left === undefined && f.days !== undefined){
      const lvl = Math.min(f.level || 0, MAXLVL);
      f.left = spanOf(lvl) == null ? null : Math.max(0, FT[lvl + 1] - (f.days || 0));
      f.leftDate = f.last || today();
      delete f.days; ch = true;
    }
    // Reste der entfernten Knöpfe „Heute interagiert“ und „Geschenk“
    for (const k of ['prevState', 'prevLast', 'last', 'giftSent']) if (k in f){ delete f[k]; ch = true; }
  }
  return ch;
}

// Suchstring: Begriffe mit & , ; | = ODER; innerhalb eines Begriffs mit + = UND; "…" = genauer Name
function parseSearch(q){
  return String(q || '').split(/[&,;|]/).map(part => part.split('+').map(w => {
    w = w.trim().toLowerCase(); if (!w) return null;
    const m = w.match(/^["„“”'](.*)["„“”']$/);
    return m ? { v: m[1].trim(), exact: true } : { v: w, exact: false };
  }).filter(w => w && w.v)).filter(t => t.length);
}

  if (p.pgMissing) b.push(`<span class="bd" style="background:#ffe0e0;color:#a52a2a" title="Seit ${fmtDate(p.pgMissing)} nicht mehr im Poke-Genie-Export">⚠ Nicht mehr im Export</span>`);
  if (p.shiny) b.push('<span class="bd sh">✨ Shiny</span>');
  if (p.align === 'shadow') b.push('<span class="bd cr">Crypto</span>');
  if (p.align === 'purified') b.push('<span class="bd er">Erlöst</span>');
  if (p.lucky) b.push('<span class="bd lu">Glücks</span>');
  if (p.dyna) b.push(`<span class="bd dy">${p.dyna === 'giga' ? 'Gigadynamax' : 'Dynamax'}</span>`);
  if (p.mega) b.push(`<span class="bd mg">${megaLabel(p)}</span>`);
  for (const m of advMoves(p)) b.push(`<span class="bd adv" title="Abenteuereffekt durch die Attacke ${esc(m)}">✦ ${esc(m)}</span>`);
  if (p.specialMove) b.push(`<span class="bd mv">⚡ Spezialattacke</span>`);
  if (p.remote) b.push(`<span class="bd" title="${esc([p.location && 'Raid in ' + p.location, p.myLocation && 'von ' + p.myLocation].filter(Boolean).join(' · '))}">🛰 Fern-Raid${p.location ? ': ' + esc(p.location) : ''}</span>`);
  if (p.costume) b.push(`<span class="bd">🎩 ${esc(p.costume)}</span>`);
  if (p.bg) b.push(`<span class="bd bg">🖼 ${p.bg === 'special' ? 'Spezial' : 'Ort'}${p.bgName ? ': ' + esc(p.bgName) : ''}</span>`);
  if (p.size) b.push(`<span class="bd sz">${p.size}</span>`);
  if (p.viv) b.push(`<span class="bd">${vivDot(p.viv)}${esc(VIVMAP[p.viv]?.[1] || '')}</span>`);
  const sub = [p.gender === 'm' ? '♂' : p.gender === 'f' ? '♀' : ''].filter(Boolean).join(' · ');
  const ft = findForm(p.dex, p.form);
  if (p.form && !/^normal$/i.test(p.form)) b.unshift(`<span class="bd fm" title="${esc(ft ? ft[0] : p.form)}">◆ ${esc(p.form)}</span>`);
  return `<div class="card mon" data-id="${p.id}">
    ${p.fav ? '<span class="fav">★</span>' : ''}
    ${monPic(p)}
    <div class="nm">${esc(p.nick || p.name || '?')}${p.nick ? ` <span class="muted" style="font-weight:400">(${esc(p.name)})</span>` : ''}</div>
    <div class="sub">${esc(sub)}</div>
    <div class="ivrow"><span>WP <b class="ivp">${p.cp ?? '–'}</b></span><span>Lv ${p.level ?? '–'}</span><span>${iv == null ? 'IV –' : `<b class="ivp">${iv} %</b>`}</span></div>
    <div class="ivrow"><span>${p.ivA ?? '–'}/${p.ivD ?? '–'}/${p.ivH ?? '–'}</span>${ivStars(p)}</div>
    <div class="badges">${b.join('')}</div>
    ${noteLine(p) ? `<div class="mnote" title="${esc(p.notes.trim())}">📝 ${esc(noteLine(p))}</div>` : ''}
  </div>`;
}

/* ---------- Freunde ---------- */
function renderFriends(){
  let list = S.friends.slice();
  const q = FF.q.trim().toLowerCase();
  if (q) list = list.filter(f => [f.name, f.code, f.notes, f.region, countryName(f.country), f.viv && VIVMAP[f.viv] ? VIVMAP[f.viv][1] : ''].join(' ').toLowerCase().includes(q));
  const fl = FF.flt;
  if (fl === 'due') list = list.filter(f => activity(f).due);
  if (fl === 'inactive') list = list.filter(f => activity(f).cls === 'no');
  if (fl === 'quiet') list = list.filter(f => ['no', 'lo'].includes(activity(f).cls));
  if (fl === 'ignores') list = list.filter(f => activity(f).ignores);
  if (fl === 'frstall') list = list.filter(f => { const r = activity(f).fr; return r && (r.cls === 'lo' || r.cls === 'no'); });
  if (fl === 'lucky') list = list.filter(f => f.lucky);
  if (fl === 'nocountry') list = list.filter(f => !f.country);
  if (fl === 'vivmismatch') list = list.filter(vivMismatch);
  if (fl === 'irl') list = list.filter(f => f.irl);
  const GS = new Map(); const gsOf = f => { if (!GS.has(f.id)) GS.set(f.id, giftScore(f)); return GS.get(f.id); };
  if (fl === 'gifts') list = list.filter(f => f.giftWaiting);
  const RS = new Map();
  const rsOf = f => { if (!RS.has(f.id)) RS.set(f.id, removeScore(f)); return RS.get(f.id); };
  if (fl === 'remove') list = list.filter(f => (rsOf(f).score ?? -1e9) >= REMOVE_MIN);
  if (/^L\d$/.test(fl)) list = list.filter(f => (f.level || 0) === +fl[1]);
  const A = new Map(list.map(f => [f.id, activity(f)]));
  const so = {
    level: (a, b) => (b.level || 0) - (a.level || 0) || (friendProgress(a).left ?? 999) - (friendProgress(b).left ?? 999),
    next: (a, b) => (friendProgress(a).left ?? 999) - (friendProgress(b).left ?? 999),
    check: (a, b) => (A.get(a.id).nextCheck || '').localeCompare(A.get(b.id).nextCheck || ''),
    stale: (a, b) => (A.get(b.id).stale ?? -1) - (A.get(a.id).stale ?? -1),
    origin: (a, b) => (!a.country) - (!b.country) || countryName(a.country).localeCompare(countryName(b.country), 'de') || (a.region || '').localeCompare(b.region || '', 'de'),
    remove: (a, b) => (rsOf(b).score ?? -1e9) - (rsOf(a).score ?? -1e9),
    gifts: (a, b) => gsOf(b).score - gsOf(a).score,
    name: (a, b) => a.name.localeCompare(b.name, 'de')
  }[fl === 'remove' || fl === 'gifts' ? fl : FF.sort] || ((a, b) => a.name.localeCompare(b.name, 'de'));
  list.sort((a, b) => so(a, b) || a.name.localeCompare(b.name, 'de'));
  NAV.friends = list.map(f => f.id);
  const t = today(), all = S.friends;
  const cnt = fn => all.filter(fn).length;
  main.innerHTML = `
    <div class="stat">
      <div class="card"><b>${all.length}</b><span class="muted">Freunde</span></div>
      ${FL.map((l, i) => `<div class="card"><b>${cnt(f => (f.level || 0) === i)}</b><span class="muted">${l}</span></div>`).join('')}
      <div class="card"><b>${cnt(f => activity(f).due)}</b><span class="muted">Prüfung fällig</span></div>
      <div class="card"><b>${cnt(f => activity(f).cls === 'no')}</b><span class="muted">inaktiv?</span></div>
      <div class="card"><b>${cnt(f => activity(f).ignores)}</b><span class="muted">spielt, interagiert nicht</span></div>
      <div class="card"><b>${cnt(f => (rsOf(f).score ?? -1e9) >= REMOVE_MIN)}</b><span class="muted">eher entfernen</span></div>
    </div>
    <div class="bar">
      <button class="b p" id="addF">+ Freund</button>
      <input id="fq" placeholder="Suchen (Name, Region, Code…)" value="${esc(FF.q)}" style="flex:1;min-width:160px">
      <select id="ff">${[['', 'Alle'], ['gifts', '🎁 Geschenke öffnen (Reihenfolge)'], ['due', 'Prüfung fällig'], ['inactive', 'Inaktiv?'], ['quiet', 'Ruhig + inaktiv?'], ['remove', 'Eher entfernen (Vorschlag)'], ['ignores', 'Spielt, interagiert nicht'], ['frstall', 'Freundschaft stockt'], ['lucky', 'Glücksfreunde'], ['irl', 'Reallife-Freunde'], ['nocountry', 'Land fehlt'], ['vivmismatch', 'Muster passt nicht zum Land'], ...FL.map((l, i) => ['L' + i, l])].map(([v, l]) => `<option value="${v}" ${FF.flt === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <select id="fs">${[['level', 'Freundeslevel'], ['next', 'Nächstes Level bald'], ['check', 'Nächste Prüfung zuerst'], ['stale', 'Am längsten ohne Änderung'], ['origin', 'Herkunft'], ['name', 'Name']].map(([v, l]) => `<option value="${v}" ${FF.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    </div>
    ${fl === 'gifts' ? (() => { const n = giftsToday(), lim = giftLimit(), w = S.friends.filter(f => f.giftWaiting).length; return `<div class="card" style="margin-bottom:10px"><div class="row"><b class="sp">🎁 Heute geöffnet: ${n} / ${lim}${n >= lim ? ' – Limit erreicht' : ` · noch ${lim - n}`}</b><label class="note" style="display:flex;gap:6px;align-items:center">Limit pro Tag <input type="number" id="giftLim" min="1" max="100" value="${lim}" style="width:64px"></label></div>

function parseCSVText(text){
  text = text.replace(/^﻿/, '');
  const firstLine = text.slice(0, text.indexOf('\n') + 1 || undefined);
  const delim = (firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; continue; }
    if (c === '"') q = true;
    else if (c === delim){ row.push(cur); cur = ''; }
    else if (c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  const head = rows.shift().map(h => h.trim());
  return rows.filter(r => r.some(v => v.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()])));
}
// Spaltennamen der deutschen und englischen Poke-Genie-Exporte
const PG = {
  name: ['Name'], form: ['Form'], dex: ['Pokemon-Nummer', 'Pokemon Number'], gender: ['Geschlecht', 'Gender'],
  cp: ['WP', 'CP'], hp: ['KP', 'HP'], a: ['Angr. IV', 'Atk IV'], d: ['Ver. IV', 'Def IV'], h: ['Ausd. IV', 'Sta IV'],
  lmin: ['Min-Level', 'Level Min'], lmax: ['Max-Level', 'Level Max'],
  fast: ['Schnell-Angriff', 'Quick Move'], c1: ['Auflade-Angriff', 'Charge Move'], c2: ['Auflade-Angriff 2', 'Charge Move 2'],
  scan: ['Scandatum', 'Scan Date'], orig: ['Ursprüngliches Scan-Datum', 'Original Scan Date'], caught: ['Datum Gefangen', 'Catch Date'],
  weight: ['Gewicht', 'Weight'], height: ['Größe', 'Height'], lucky: ['Glücks', 'Lucky'], align: ['Crypto/Erlöstes', 'Shadow/Purified'],
  fav: ['Favorit', 'Favorite'],
};
const pgGet = (row, k) => { for (const c of PG[k]) if (c in row) return row[c]; return ''; };
function pgDate(v){
  if (!v) return '';
  let m = v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  m = v.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[0];
  m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  return '';
}
const pgNum = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
function pgRow(r){
  const dex = num(pgGet(r, 'dex'));
  const form = pgGet(r, 'form');
  const g = pgGet(r, 'gender');
  const al = pgGet(r, 'align');
  const lmin = pgNum(pgGet(r, 'lmin')), lmax = pgNum(pgGet(r, 'lmax'));
  const orig = pgGet(r, 'orig') || pgGet(r, 'scan');
  const ivA = num(pgGet(r, 'a')), ivD = num(pgGet(r, 'd')), ivH = num(pgGet(r, 'h'));
  return {
    pgKey: [orig, ivA, ivD, ivH, g].join('|'),
    name: (dex && DEX[dex]?.de) || pgGet(r, 'name'), dex,
    form: /^normal$/i.test(form) ? '' : form,
    gender: g === '♂' ? 'm' : g === '♀' ? 'f' : '',
    cp: num(pgGet(r, 'cp')), hp: num(pgGet(r, 'hp')), ivA, ivD, ivH,
    level: lmin != null && lmax != null && lmin !== lmax ? lmin : (lmin ?? lmax),
    fast: pgGet(r, 'fast'), c1: pgGet(r, 'c1'), c2: pgGet(r, 'c2'),
    caught: pgDate(pgGet(r, 'caught')),
    weight: pgNum(pgGet(r, 'weight')), height: pgNum(pgGet(r, 'height')),
    lucky: pgGet(r, 'lucky') === '1',
    align: al === '1' ? 'shadow' : al === '2' ? 'purified' : '',
    pgFav: pgGet(r, 'fav') === '1',
    added: orig ? orig.replace(' ', 'T') : new Date().toISOString(),

  };
}

const PG_FIELDS = [
  ['dex', 'Pokémon'], ['form', 'Form'], ['gender', 'Geschlecht'], ['align', 'Crypto/Erlöst'], ['lucky', 'Glücks'],
  ['cp', 'WP'], ['hp', 'KP'], ['level', 'Level'], ['ivA', 'IV Angriff'], ['ivD', 'IV Verteidigung'], ['ivH', 'IV KP'],
  ['fast', 'Sofortattacke'], ['c1', 'Ladeattacke 1'], ['c2', 'Ladeattacke 2'],
  ['caught', 'Gefangen am'], ['height', 'Höhe (m)'], ['weight', 'Gewicht (kg)'], ['fav', 'Favorit']
];
const pgVal = (n, f) => f === 'fav' ? n.pgFav : n[f];
const revNorm = v => (v == null || v === '' || v === false) ? '' : typeof v === 'number' ? String(Math.round(v * 1000) / 1000) : String(v);
function revFmt(f, v){
  if (v == null || v === '' || v === false) return f === 'lucky' || f === 'fav' ? 'Nein' : '–';
  if (v === true) return 'Ja';
  if (f === 'dex') return `#${v} ${esc(nameOf(v) || '')}`;
  if (f === 'gender') return v === 'm' ? '♂' : v === 'f' ? '♀' : esc(v);
  if (f === 'align') return v === 'shadow' ? 'Crypto' : v === 'purified' ? 'Erlöst' : esc(v);
  if (f === 'caught') return fmtDate(v);
  if (typeof v === 'number') return v.toLocaleString('de-DE');

}
const ownForm = p => p.pgForm === undefined ? !!p.form : (p.form || '') !== (p.pgForm || '');
function revDiffs(p, n){
  const out = [];
  for (const [f, label] of PG_FIELDS){
    const tv = p[f], pv = pgVal(n, f);
    if (revNorm(tv) === revNorm(pv)) continue;
    // Vorschlag pro Feld (nur relevant, wenn du übernimmst): Backup, außer das Backup ist leer,
    // die Form wurde von dir geändert oder es geht um den Favoriten
    const def = (revNorm(pv) === '' && revNorm(tv) !== '') || (f === 'form' && ownForm(p)) || f === 'fav' ? 'tool' : 'pg';
    out.push({ f, label, tv, pv, def });

function revScore(p, n){
  let score = 0; const why = [];

  if (p.pgKey && scan(p.pgKey) === scan(n.pgKey)){ score += 4; why.push('gleiches Scan-Datum'); }
  const ivs = ['ivA', 'ivD', 'ivH'];
  if (n.ivA != null && ivs.every(k => p[k] === n[k])){ score += 3; why.push('gleiche IVs'); }
  else if (p.align === 'shadow' && n.align === 'purified' && ivs.every(k => p[k] != null && Math.min(15, p[k] + 2) === n[k])){ score += 3; why.push('IVs passen zum Erlösen'); }

  if (p.dex === n.dex) score += 1; else why.push('andere Entwicklungsstufe');

function revCompute(){
  const rows = REV.rows;
  const byKey = {};
  S.pokemon.forEach(p => { if (p.pgKey) (byKey[p.pgKey] ||= []).push(p); });
  const used = new Set(), exact = new Map();
  rows.forEach((n, i) => {
    const c = (byKey[n.pgKey] || []).filter(p => !used.has(p.id));
    if (!c.length) return;
    c.sort((a, b) => ((a.dex === n.dex ? 0 : 1) - (b.dex === n.dex ? 0 : 1)) || Math.abs((a.cp || 0) - (n.cp || 0)) - Math.abs((b.cp || 0) - (n.cp || 0)));
    exact.set(i, c[0]); used.add(c[0].id);
  });
  const updated = [], unchanged = [], unmatched = [];
  rows.forEach((n, i) => {
    const p = exact.get(i);
    if (p){ const d = revDiffs(p, n); (d.length ? updated : unchanged).push({ key: 'u:' + p.id, i, p, n, d }); }
    else unmatched.push({ key: 'r:' + i, i, n });
  });
  const rest = S.pokemon.filter(p => !used.has(p.id));
  for (const u of unmatched){
    const ch = EVO[u.n.dex];
    u.cands = rest.filter(p => p.dex === u.n.dex || (ch && EVO[p.dex] === ch))
      .map(p => ({ p, ...revScore(p, u.n) }))
      .sort((a, b) => b.score - a.score || Math.abs((a.p.cp || 0) - (u.n.cp || 0)) - Math.abs((b.p.cp || 0) - (u.n.cp || 0)));
  }

  const targets = new Map();

    updated: updated.filter(x => !done(x.key)), unchanged,
    cand: unmatched.filter(u => u.cands.length && !done(u.key)),
    fresh: unmatched.filter(u => !u.cands.length && !done(u.key)),
    missing: rest.filter(p => p.pgKey && !done('m:' + p.id)).map(p => ({ key: 'm:' + p.id, p })),
    manual: rest.filter(p => !p.pgKey),
    targets, total: rows.length
  };
}
async function revSave(){

  try{ if (REV) await idbPut(plain(REV), REV_KEY); else await idbDel(REV_KEY); }
  catch(e){ storeBanner(`Prüf-Stand konnte nicht gespeichert werden (${e.message}). Deine Entscheidungen gehen beim Neuladen verloren.`); }
}

function openPgImport(){
  openDlg('Poke-Genie-Backup abgleichen', `
    <p style="margin-top:0">In Poke Genie: <b>Einstellungen → Exportieren</b> (CSV) und die Datei hier auswählen.</p>
    <label class="fl">CSV-Datei<input type="file" name="file" accept=".csv,text/csv" required></label>
    <p class="note">Es wird noch <b>nichts geändert</b>. Du bekommst eine Übersicht, die den aktuellen Stand dem Backup gegenüberstellt, und entscheidest jedes Pokémon einzeln. Erst „Ausgewählte übernehmen“ schreibt – vorher wird automatisch eine JSON-Sicherung heruntergeladen.</p>
    <p class="note">Bitte nur auf <b>einem</b> Gerät abgleichen und bis zum Ende prüfen. Dein Zwischenstand bleibt auf diesem Gerät gespeichert, auch nach dem Neuladen.</p>
    ${REV ? `<p class="note" style="color:var(--bad)">Es läuft bereits eine Prüfung (${esc(REV.file)}). Sie wird durch die neue Datei ersetzt.</p>` : ''}`, '',
    async fd => {
      const f = fd.get('file'); if (!f || !f.size) return;
      try{
        const raw = parseCSVText(await f.text());
        if (!raw.length || !('Pokemon-Nummer' in raw[0] || 'Pokemon Number' in raw[0])) throw new Error('Das sieht nicht nach einem Poke-Genie-Export aus.');
        if (REV && !confirm('Die laufende Prüfung mit allen bisherigen Entscheidungen verwerfen?')) return;
        REV = { file: f.name, created: new Date().toISOString(), rows: raw.map(pgRow), dec: {}, done: {} };
        await revSave();
        Object.assign(REVUI, { g: 'updated', q: '', st: 'open', lim: 40 }); REVUI.sticky.clear();
        TAB = 'review'; document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('on'));
        render(); window.scrollTo(0, 0);
      }catch(err){ alert('Einlesen fehlgeschlagen: ' + err.message); }
    });
}

function revBanner(){
  if (!REV) return '';
  const C = revCompute();
  const open = C.updated.length + C.cand.length + C.fresh.length + C.missing.length;
  return `<div class="card" style="border:2px solid var(--acc);margin-bottom:14px"><div class="row"><b class="sp">Poke-Genie-Abgleich läuft (${esc(REV.file)}): ${open} Einträge zu prüfen</b><button class="b p" id="revGo">Fortsetzen</button></div></div>`;
}
function revSummary(x){
  const p = x;
  const iv = p.ivA != null ? `${p.ivA}/${p.ivD}/${p.ivH}` : 'IV –';
  const bits = [p.form ? '◆ ' + esc(p.form) : '', p.gender === 'm' ? '♂' : p.gender === 'f' ? '♀' : '', `WP ${p.cp ?? '–'}`, `Lv ${p.level ?? '–'}`, iv,
    p.align === 'shadow' ? 'Crypto' : p.align === 'purified' ? 'Erlöst' : '', p.lucky ? 'Glücks' : ''].filter(Boolean).join(' · ');
  const moves = [p.fast, p.c1, p.c2].filter(Boolean).map(esc).join(', ');
  return `${bits}${moves ? `<br>${moves}` : ''}${p.caught ? `<br>gefangen ${fmtDate(p.caught)}` : ''}`;
}
function ownBadges(p){
  const b = [];
  if (p.nick) b.push('„' + esc(p.nick) + '“');
  if (p.shiny) b.push('✨ Shiny'); if (p.costume) b.push('🎩 ' + esc(p.costume));
  if (p.bg || p.bgKey) b.push('🖼 ' + esc(p.bgName || (p.bgKey ? bgLabel(p.bgKey) : 'Hintergrund')));
  if (p.specialMove) b.push('⚡ Spezialattacke'); if (p.size) b.push(esc(p.size)); if (p.dyna) b.push(p.dyna === 'giga' ? 'Gigadynamax' : 'Dynamax'); if (p.mega) b.push(megaLabel(p));
  if (p.location) b.push((p.remote ? '🛰 ' : '📍 ') + esc(p.location) + (p.myLocation ? ' (von ' + esc(p.myLocation) + ')' : ''));
  if (p.viv) b.push('Vivillon: ' + esc(VIVMAP[p.viv]?.[1] || p.viv)); if (p.fav) b.push('★'); if (p.tags) b.push('# ' + esc(p.tags)); if (p.notes && p.notes.trim()) b.push('📝');

}

  const hay = ps.map(p => [p.name, p.nick, p.form, p.costume, p.notes, p.tags, '#' + p.dex].join(' ')).join(' ').toLowerCase();
  return parseSearch(q).some(t => t.every(w => w.exact ? ps.some(p => [p.name, p.nick].filter(Boolean).map(s => s.toLowerCase()).includes(w.v)) : hay.includes(w.v)));
}

/* ---------- Übernehmen ---------- */
function applyFields(p, n, diffs, choice){
  for (const x of diffs){
    if (((choice && choice[x.f]) || x.def) !== 'pg') continue;
    if (x.f === 'fav') p.fav = !!n.pgFav;
    else if (x.f === 'dex'){ p.dex = n.dex; p.name = n.name; }
    else p[x.f] = n[x.f];
  }
  p.pgKey = n.pgKey; p.src = 'pokegenie'; p.pgForm = n.form; delete p.pgMissing;
}
async function revApplyAll(){
  const C = revCompute();
  const n = [...C.updated, ...C.cand, ...C.fresh, ...C.missing].filter(x => REV.dec[x.key]).length;
  if (!n || !confirm(`${n} Entscheidungen jetzt übernehmen?\n\nVorher wird automatisch eine JSON-Sicherung des aktuellen Stands heruntergeladen.`)) return;
  exportJSON('vor-poke-genie-abgleich');
  const res = { upd: 0, keep: 0, add: 0, merge: 0, skip: 0, del: 0, kept: 0, stale: [] };
  const byId = id => S.pokemon.find(p => p.id === id);
  // Hat sich der Tool-Eintrag seit deiner Entscheidung geändert (z. B. über den Sync), wird nichts übernommen
  const stale = (x, d, p, label) => { if (p && d.h === hashOf(p)) return false; res.stale.push(label); (REV.stale ||= {})[x.key] = 1; delete REV.dec[x.key]; return true; };
  const merged = new Set();
  for (const x of C.updated){
    const d = REV.dec[x.key]; if (!d) continue;
    if (stale(x, d, x.p, x.p.nick || x.p.name)) continue;
    if (d.a === 'accept'){ applyFields(x.p, x.n, revDiffs(x.p, x.n), d.f); res.upd++; } else res.keep++;
    REV.done[x.key] = 1; delete REV.dec[x.key];
  }
  for (const x of [...C.cand, ...C.fresh]){
    const d = REV.dec[x.key]; if (!d) continue;
    if (d.a === 'new'){ const { pgFav, ...rest } = x.n; S.pokemon.push({ id: uid(), ...rest, fav: !!pgFav, pgForm: x.n.form }); res.add++; }
    else if (d.a === 'merge'){
      const p = byId(d.t);
      if (!p || merged.has(p.id) || stale(x, d, p, x.n.name + ' (Zusammenführung)')) continue;
      applyFields(p, x.n, revDiffs(p, x.n), d.f); merged.add(p.id); res.merge++;
    } else res.skip++;
    REV.done[x.key] = 1; delete REV.dec[x.key];
  }
  for (const x of C.missing){
    const d = REV.dec[x.key]; if (!d || merged.has(x.p.id)) continue;
    if (stale(x, d, x.p, x.p.nick || x.p.name)) continue;
    if (d.a === 'delete'){ S.pokemon = S.pokemon.filter(p => p.id !== x.p.id); res.del++; } else { delete x.p.pgMissing; res.kept++; }
    REV.done[x.key] = 1; delete REV.dec[x.key];
  }
  REVUI.sticky.clear();
  const ok = await save(); await revSave(); render();
  alert((ok ? 'Übernommen:' : 'Achtung: Speichern fehlgeschlagen – siehe roter Hinweis oben.') +
    `\n• ${res.upd} aktualisiert, ${res.keep} Tool-Stand behalten\n• ${res.merge} zusammengeführt, ${res.add} neu angelegt, ${res.skip} nicht angelegt\n• ${res.del} gelöscht, ${res.kept} behalten` +
    (res.stale.length ? `\n\n${res.stale.length} übersprungen, weil sie sich inzwischen geändert haben – bitte neu entscheiden:\n${res.stale.slice(0, 15).join(', ')}${res.stale.length > 15 ? ' …' : ''}` : ''));
}

/* ===================== Freunde-Import (Notion) ===================== */
// Akzeptiert die vorbereitete JSON-Datei (type "go-organizer-friends") oder einen CSV-Export der Notion-Datenbank.
// Verändert ausschließlich S.friends – Pokémon, Postkarten usw. bleiben unangetastet.
const MONTHS = { jan: 1, januar: 1, january: 1, feb: 2, februar: 2, february: 2, mär: 3, mar: 3, märz: 3, march: 3, apr: 4, april: 4, mai: 5, may: 5, jun: 6, juni: 6, june: 6, jul: 7, juli: 7, july: 7, aug: 8, august: 8, sep: 9, sept: 9, september: 9, okt: 10, oct: 10, oktober: 10, october: 10, nov: 11, november: 11, dez: 12, dec: 12, dezember: 12, december: 12 };
function anyDate(v){
  v = String(v || '').trim(); if (!v) return '';
  let m = v.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[0];
  m = v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  m = v.match(/^(\d{1,2})\.?\s+([A-Za-zÄÖÜäöü]+)\.?\s+(\d{4})/); if (m && MONTHS[m[2].toLowerCase()]) return `${m[3]}-${String(MONTHS[m[2].toLowerCase()]).padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  m = v.match(/^([A-Za-zÄÖÜäöü]+)\.?\s+(\d{1,2}),?\s+(\d{4})/); if (m && MONTHS[m[1].toLowerCase()]) return `${m[3]}-${String(MONTHS[m[1].toLowerCase()]).padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  return '';
}
const levelFromLabel = v => {
  const s = String(v ?? '').trim(); if (s === '') return null;
  const m = s.match(/^\(?(\d)\)?/); if (m) return Math.min(MAXLVL, +m[1]);
  const i = FL.findIndex(l => l.toLowerCase() === s.toLowerCase()); return i < 0 ? null : i;
};
const yes = v => /^(yes|ja|true|1|__yes__|✓|x)$/i.test(String(v ?? '').trim());
const numOrNull = v => { const s = String(v ?? '').replace(/[.\s]/g, '').replace(',', '.'); return s === '' || isNaN(+s) ? null : +s; };
function notionCsvToFriends(text){
  const rows = parseCSVText(text);
  if (!rows.length || !('Name' in rows[0]) || !('Freundeslevel' in rows[0])) throw new Error('Unbekanntes Format – erwartet wird der CSV-Export der Notion-Datenbank „Pokémon GO-Freunde“.');
  return rows.map(r => ({
    name: r['Name'], level: levelFromLabel(r['Freundeslevel']), trainerLvl: numOrNull(r['Lvl']),
    xp: numOrNull(r['XP zuletzt gesehen']), xpPrev: numOrNull(r['XP vorher']),
    left: numOrNull(r['Fortschritt zuletzt gesehen']), leftPrev: numOrNull(r['Fortschritt vorher']),
    lastCheck: anyDate(r['L. Prüf.']), xpChanged: anyDate(r['L. XP-Änd.']), friendChanged: anyDate(r['L. F-änd.']),
    region: r['Region'] || '', lucky: yes(r['Glücksfreund'])
  }));
}
function importFriends(list){
  const byName = new Map(S.friends.map(f => [f.name.trim().toLowerCase(), f]));
  let added = 0, updated = 0, skipped = 0;
  for (const r of list){
    const name = String(r.name || '').trim(); if (!name){ skipped++; continue; }
    let f = byName.get(name.toLowerCase());
    const isNew = !f;
    if (isNew){ f = { id: uid(), name, snaps: [] }; }
    const lvl = r.level ?? f.level ?? 0;
    Object.assign(f, {
      level: lvl, left: r.left ?? spanOf(lvl), leftDate: r.lastCheck || today(),
      trainerLvl: r.trainerLvl ?? f.trainerLvl ?? null, xp: r.xp ?? f.xp ?? null,
      lastCheck: r.lastCheck || f.lastCheck || '', xpChanged: r.xpChanged || f.xpChanged || '', friendChanged: r.friendChanged || f.friendChanged || '',
      lucky: !!r.lucky
    });
    if (r.region){ const o = parseOrigin(r.region); f.country = o.country; f.region = o.region; }
    if (r.xpPrev != null || r.leftPrev != null) f.importPrev = { xp: r.xpPrev, left: r.leftPrev };
    // EP werden über die letzten 4 Ziffern verglichen – ältere volle Werte bleiben zur Info erhalten
    f.chk = { date: f.lastCheck, lvl: f.trainerLvl, xp: f.xp, level: f.level, left: r.left ?? null };
    if (f.lastCheck){
      f.snaps = (f.snaps || []).filter(s => s.date !== f.lastCheck);
      f.snaps.push({ date: f.lastCheck, lvl: f.trainerLvl, xp: f.xp, level: f.level, left: r.left ?? null });
    }
    if (isNew){ S.friends.push(f); byName.set(name.toLowerCase(), f); added++; } else updated++;
  }
  return { added, updated, skipped };
}

  openDlg('Freunde importieren', `

// Der Text im Feld „Ort“ bleibt die Grundlage. Koordinaten stehen einmal pro Ort im Verzeichnis S.places
// (Schlüssel = Ortsname klein geschrieben), damit nicht jedes Pokémon dieselbe Koordinate trägt.
// Ortssuche über OpenStreetMap/Nominatim – nur auf Knopfdruck, es wird nur der Ortsname gesendet.
const placeKey = t => String(t || '').trim().toLowerCase();
const placeOf = t => (S.places || {})[placeKey(t)] || null;
async function geoSearch(q){
  const u = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=de&q=' + encodeURIComponent(q);
  const r = await fetch(u, { headers: { 'Accept': 'application/json' } });
  if (!r.ok) throw new Error('Ortssuche nicht erreichbar (' + r.status + ')');
  return (await r.json()).map(x => ({ lat: +x.lat, lng: +x.lon, label: x.display_name }));
}
// Ergebnisliste unter einem Ort-Feld; Auswahl speichert die Koordinate zum eingegebenen Text
async function geoPick(text, box, done){
  text = String(text || '').trim();
  if (!text){ box.hidden = false; box.innerHTML = '<p class="note" style="margin:4px">Erst einen Ort eintragen, z. B. „Nürnberg“ oder „Shibuya, Tokio“.</p>'; return; }
  box.hidden = false; box.innerHTML = `<p class="note" style="margin:4px">Suche „${esc(text)}“ …</p>`;
  try{
    const res = await geoSearch(text);
    box.innerHTML = res.length
      ? `<p class="note" style="margin:4px">Welcher Ort ist „${esc(text)}“?</p>${res.map((x, i) => `<button type="button" class="b s" style="display:block;width:100%;text-align:left;margin:3px 0" data-gi="${i}">📍 ${esc(x.label)}</button>`).join('')}<button type="button" class="b s" data-gi="x">Keiner davon</button>`
      : `<p class="note" style="margin:4px">Nichts gefunden. Versuch es mit Stadt und Land, z. B. „${esc(text)}, Deutschland“.</p>`;
    box.querySelectorAll('[data-gi]').forEach(b => b.onclick = async () => {
      box.hidden = true;
      if (b.dataset.gi === 'x') return;
      const x = res[+b.dataset.gi];
      (S.places ||= {})[placeKey(text)] = { name: text, lat: Math.round(x.lat * 1e5) / 1e5, lng: Math.round(x.lng * 1e5) / 1e5, label: x.label };
      await save(); done && done();
    });
  }catch(e){ box.innerHTML = `<p class="note" style="margin:4px;color:var(--bad)">${esc(e.message)}</p>`; }
}
const placeState = t => !String(t || '').trim() ? '' : placeOf(t) ? '✓ auf der Karte' : 'noch ohne Koordinaten – 📍 tippen';

let LEAF = null;

const MAPUI = { catch: true, remote: true };
let MAP = null;
function mapData(){
  const caught = new Map(), raids = [], missing = new Map();
  const miss = t => { const k = placeKey(t); if (k && !placeOf(t)) missing.set(k, { name: String(t).trim(), n: (missing.get(k)?.n || 0) + 1 }); };
  for (const p of S.pokemon){
    if (!(p.location || '').trim()) continue;
    const pl = placeOf(p.location);
    if (p.remote){
      miss(p.location); if (p.myLocation) miss(p.myLocation);
      if (pl) raids.push({ p, to: pl, from: p.myLocation ? placeOf(p.myLocation) : null });
    } else {
      miss(p.location);
      if (pl){ const k = placeKey(p.location); if (!caught.has(k)) caught.set(k, { pl, list: [] }); caught.get(k).list.push(p); }
    }
  }
  return { caught: [...caught.values()], raids, missing: [...missing.values()].sort((a, b) => b.n - a.n) };
}
const monLine = p => `${esc(p.nick || p.name)}${p.form ? ' (' + esc(p.form) + ')' : ''} · WP ${p.cp ?? '–'}${p.shiny ? ' ✨' : ''}`;
function renderMap(){
  const D = mapData();
  const withLoc = S.pokemon.filter(p => (p.location || '').trim()).length;
  main.innerHTML = `
    <div class="stat">
      <div class="card"><b>${D.caught.reduce((s, c) => s + c.list.length, 0)}</b><span class="muted">Fänge auf der Karte</span></div>
      <div class="card"><b>${D.raids.length}</b><span class="muted">Fern-Raids auf der Karte</span></div>
      <div class="card"><b>${D.caught.length}</b><span class="muted">Fangorte</span></div>
      <div class="card"><b>${withLoc}</b><span class="muted">Pokémon mit Ort</span></div>
    </div>
    <div class="bar">
      <label class="chk"><input type="checkbox" id="mCatch" ${MAPUI.catch ? 'checked' : ''}> <span class="dot" style="background:#2f6fed"></span>Fangorte</label>
      <label class="chk"><input type="checkbox" id="mRemote" ${MAPUI.remote ? 'checked' : ''}> <span class="dot" style="background:#e5533d"></span>Fern-Raids (Linie von deinem Standort zum Raid)</label>
    </div>
    <div id="map" style="height:min(70vh,620px);border-radius:12px;border:1px solid var(--line);background:var(--card)"><p class="empty">Karte wird geladen …</p></div>
    <p class="note">Kartendaten © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-Mitwirkende. Orte trägst du beim Pokémon unter „Herkunft“ ein.</p>
    ${D.missing.length ? `<div class="card" style="margin-top:12px"><h3 style="margin:0 0 6px">Orte ohne Koordinaten (${D.missing.length})</h3>
      <p class="note" style="margin-top:0">Diese Orte stehen bei deinen Pokémon, sind aber noch nicht auf der Karte. 📍 sucht den Ort einmal; danach erscheinen alle Pokémon mit diesem Ort.</p>
      ${D.missing.slice(0, 50).map((m, i) => `<div class="row" style="margin:4px 0"><span class="sp">${esc(m.name)} <span class="muted">(${m.n})</span></span><button class="b s" data-mg="${i}">📍 finden</button></div><div class="picker" id="mg${i}" hidden></div>`).join('')}
    </div>` : ''}`;
  mCatch.onchange = e => { MAPUI.catch = e.target.checked; drawMap(D); };
  mRemote.onchange = e => { MAPUI.remote = e.target.checked; drawMap(D); };
  main.querySelectorAll('[data-mg]').forEach(b => b.onclick = () => geoPick(D.missing[+b.dataset.mg].name, document.getElementById('mg' + b.dataset.mg), renderMap));
  loadLeaflet().then(() => drawMap(D)).catch(e => { document.getElementById('map').innerHTML = `<p class="empty">${esc(e.message)}</p>`; });
}
function drawMap(D){
  const el = document.getElementById('map'); if (!el || !window.L) return;
  if (MAP){ try{ MAP.remove(); }catch(e){} MAP = null; }
  el.innerHTML = '';
  MAP = L.map(el, { worldCopyJump: true }).setView([30, 10], 2);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(MAP);
  const pts = [];
  if (MAPUI.catch) for (const c of D.caught){
    const r = Math.min(18, 5 + Math.sqrt(c.list.length) * 2.5);
    L.circleMarker([c.pl.lat, c.pl.lng], { radius: r, color: '#1d4ed8', fillColor: '#2f6fed', fillOpacity: .55, weight: 2 })
      .bindPopup(`<b>${esc(c.pl.name)}</b> – ${c.list.length} Pokémon<br><span style="font-size:12px">${c.list.slice(0, 25).map(monLine).join('<br>')}${c.list.length > 25 ? '<br>…' : ''}</span>`).addTo(MAP);
    pts.push([c.pl.lat, c.pl.lng]);
  }
  if (MAPUI.remote) for (const r of D.raids){
    if (r.from) L.polyline([[r.from.lat, r.from.lng], [r.to.lat, r.to.lng]], { color: '#e5533d', weight: 2, opacity: .7, dashArray: '6 6' }).addTo(MAP);
    L.circleMarker([r.to.lat, r.to.lng], { radius: 7, color: '#b3261e', fillColor: '#e5533d', fillOpacity: .8, weight: 2 })
      .bindPopup(`<b>🛰 Fern-Raid: ${monLine(r.p)}</b><br>Raid in ${esc(r.to.name)}${r.from ? `<br>von ${esc(r.from.name)} aus` : ''}${r.p.caught ? `<br>${fmtDate(r.p.caught)}` : ''}`).addTo(MAP);
    pts.push([r.to.lat, r.to.lng]); if (r.from) pts.push([r.from.lat, r.from.lng]);
  }
  if (pts.length) MAP.fitBounds(pts, { padding: [30, 30], maxZoom: 10 });
}

/* ===================== Dialog-Helfer ===================== */
let dlgCb = null;
/* Blättern zwischen Einträgen in der Reihenfolge der aktuellen Liste (Suche, Filter, Sortierung) */
const NAV = { mons: [], friends: [] };
const navList = kind => kind === 'check' ? NAV.friends : NAV[kind];
function navBtns(kind, id){
  const l = navList(kind), i = id == null ? -1 : l.indexOf(id);
  if (i < 0 || l.length < 2) return '<span class="sp"></span>';
  const pos = `<span class="note" style="white-space:nowrap">${i + 1} / ${l.length}</span>`;
  if (kind === 'check') return `<span class="navb"><button class="b s" value="prev" formnovalidate ${i ? '' : 'disabled'} title="Vorheriger, ohne zu speichern (Alt + ←)">‹</button>${pos}<button class="b s" value="skip" formnovalidate ${i < l.length - 1 ? '' : 'disabled'} title="Nächster, ohne zu speichern (Alt + →)">Überspringen ›</button><button class="b s p" value="next" ${i < l.length - 1 ? '' : 'disabled'} title="Prüfung speichern und zum nächsten">Speichern &amp; weiter ›</button></span>`;
  return `<span class="navb"><button class="b s" value="prev" ${i ? '' : 'disabled'} title="Vorheriger (Alt + ←) – Änderungen werden gespeichert">‹</button>${pos}<button class="b s" value="next" ${i < l.length - 1 ? '' : 'disabled'} title="Nächster (Alt + →) – Änderungen werden gespeichert">›</button></span>`;
}
function navTarget(kind, id, act){
  if (act !== 'prev' && act !== 'next' && act !== 'skip') return undefined;
  const l = navList(kind), i = l.indexOf(id), j = i + (act === 'prev' ? -1 : 1);
  return i >= 0 && j >= 0 && j < l.length ? l[j] : undefined;
}
function navOpen(kind, id){
  if (id === undefined) return;
  setTimeout(() => {
    if (kind === 'mons'){ const p = S.pokemon.find(x => x.id === id); if (p) editMon(p); }
    else { const f = S.friends.find(x => x.id === id); if (f) (kind === 'check' ? checkFriend : editFriend)(f); }
  }, 0);
}
const fdKey = fd => JSON.stringify([...fd.entries()].map(([k, v]) => [k, typeof v === 'string' ? v : (v && v.name) || '']));
let dlgSnap = '';
function openDlg(title, body, extraBtns, cb){
  dlgT.innerHTML = title; dlgB.innerHTML = body;
  dlgF.innerHTML = `${extraBtns}<button class="b" value="cancel" formnovalidate>Abbrechen</button><button class="b p" value="ok">Speichern</button>`;
  dlgCb = cb; if (!dlg.open) dlg.showModal();
  const first = dlgB.querySelector('input:not([type=checkbox]),select'); if (first) first.focus();
  // Ausgangsstand merken (nachdem die Aufrufer ihre Felder vorbelegt haben), um Änderungen zu erkennen
  setTimeout(() => { dlgSnap = fdKey(new FormData(dlgForm)); }, 0);
}
dlg.addEventListener('keydown', e => {
  if (!e.altKey || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
  const b = dlgF.querySelector(e.key === 'ArrowLeft' ? 'button[value=prev]' : 'button[value=next]:not(.p), button[value=skip]');
  if (b && !b.disabled){ e.preventDefault(); b.click(); }
});
dlgForm.addEventListener('submit', e => {
  const act = e.submitter?.value;
  if (act === 'cancel') return;
  const fd = new FormData(dlgForm);
  if (dlgCb) dlgCb(fd, act, fdKey(fd) !== dlgSnap);
});

/* ===================== Theme & Start ===================== */
const TH = 'go-organizer-theme';
function applyTheme(t){ if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
try{ applyTheme(localStorage.getItem(TH)); }catch(e){}
themeBtn.onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const t = dark ? 'light' : 'dark'; applyTheme(t); try{ localStorage.setItem(TH, t); }catch(e){}
};
document.getElementById('main').innerHTML = '<div class="empty">Lade Daten…</div>';
/* GitHub-Sync: gleicht mit dem Ordner tool-daten/pokemon-go/ ab, sobald auf der Startseite eingerichtet */
function initSync(){
  if (!window.ToolSync || STORE_MODE !== 'idb') return;
  SYNC = ToolSync.create({
    tool: 'pokemon-go',
    collections: { pokemon: 'array', friends: 'array', postcards: 'array', regionHints: 'map', places: 'map', vivCards: 'map' },
    shards: 16,   // Ordner pokemon-go/ (main.json + s00–s15.json); nur geänderte Teile werden hochgeladen. Zahl NIE ändern.
    fields: ['xpDigits'],
    get: () => S,
    apply: async d => { S = Object.assign(blank(), S, d); const ok = await save(); render(); return ok; }
  });
  SYNC.start();
}
initStore().then(() => { render(); loadDex(); initSync(); });
</script>
