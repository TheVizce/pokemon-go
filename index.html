<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#1c2233; --muted:#6b7389; --line:#e2e6ef;
  --acc:#2f6fed; --acc2:#e8f0ff; --good:#1e9e5a; --warn:#d98a00; --bad:#d64545;
  --gold:#e0a800; --shadow:0 1px 3px rgba(20,30,60,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141c; --card:#1a1f2b; --ink:#e7eaf2; --muted:#98a0b5; --line:#2b3242;
    --acc:#6b9bff; --acc2:#22304d; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#11141c; --card:#1a1f2b; --ink:#e7eaf2; --muted:#98a0b5; --line:#2b3242;
  --acc:#6b9bff; --acc2:#22304d; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;max-width:1200px;margin:0 auto;padding:10px 16px}

main{max-width:1200px;margin:0 auto;padding:16px}

<script>
/* ===================== Daten & Speicher (IndexedDB) ===================== */
// Daten liegen in IndexedDB "pokemon-go-tool" (Store "kv", Eintrag "state").
// localStorage enthält nur noch das Theme ("go-organizer-theme").
const LEGACY_KEY = 'go-organizer-v1';
const DB_NAME = 'pokemon-go-tool', DB_STORE = 'kv', DB_REC = 'state';
const blank = () => ({ pokemon: [], friends: [], postcards: [], regionHints: {}, version: 1 });
let S = blank();
let STORE_MODE = 'idb';      // 'idb' | 'ls' (Notlösung, falls IndexedDB nicht verfügbar) | 'locked'
let PERSISTED = null;
let db = null;

function idbOpen(){
  return new Promise((res, rej) => {
    if (!('indexedDB' in window)) return rej(new Error('IndexedDB nicht verfügbar'));
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('Datenbank blockiert – bitte andere Tabs dieses Tools schließen'));
  });
}
function idbGet(){
  return new Promise((res, rej) => {
    const t = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(DB_REC);
    t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error);
  });
}
function idbPut(val){
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(val, DB_REC);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('Schreibvorgang abgebrochen'));
  });
}
const plain = o => JSON.parse(JSON.stringify(o));

/* Sichtbarer Hinweis bei Speicherproblemen */
function storeBanner(msg){
  let el = document.getElementById('storeErr');
  if (!msg){ if (el) el.remove(); return; }
  if (!el){
    el = document.createElement('div'); el.id = 'storeErr';
    el.style.cssText = 'background:#d64545;color:#fff;padding:10px 16px;font-weight:600;position:sticky;top:0;z-index:20';
    document.body.prepend(el);
  }
  el.innerHTML = `⚠️ ${esc(msg)} <button class="b s" id="storeErrExp" style="margin-left:8px">Jetzt als JSON sichern</button>`;
  document.getElementById('storeErrExp').onclick = exportJSON;
}

let saveChain = Promise.resolve(), pending = 0;
function save(){
  if (STORE_MODE === 'locked'){ storeBanner('Gespeicherte Daten konnten nicht gelesen werden – Speichern ist gesperrt, damit nichts überschrieben wird. Seite neu laden oder Sicherung importieren.'); return Promise.resolve(false); }
  const snap = plain(S); pending++;
  saveChain = saveChain.then(async () => {
    try{
      if (STORE_MODE === 'idb') await idbPut(snap);
      else localStorage.setItem(LEGACY_KEY, JSON.stringify(snap));
      storeBanner(''); return true;
    }catch(e){
      const quota = e && (e.name === 'QuotaExceededError' || /quota/i.test(e.message || ''));
      storeBanner(`Speichern fehlgeschlagen${quota ? ' – Speicherplatz voll' : ''} (${e?.message || e}). Letzte Änderungen sind NICHT gesichert.`);
      return false;
    }finally{ pending--; }
  });
  return saveChain;
}
window.addEventListener('beforeunload', e => { if (pending > 0 || document.getElementById('storeErr')){ e.preventDefault(); e.returnValue = ''; } });

async function initStore(){
  try{
    db = await idbOpen();
    let data = await idbGet();
    if (data == null){
      // Erster Start mit IndexedDB: Daten aus localStorage übernehmen
      let raw = null; try{ raw = localStorage.getItem(LEGACY_KEY); }catch(e){}
      if (raw){
        let old;
        try{ old = JSON.parse(raw); }catch(e){
          STORE_MODE = 'locked';
          storeBanner('Alte Daten im localStorage sind beschädigt und wurden nicht übernommen (sie bleiben unangetastet). Bitte eine JSON-Sicherung importieren.');
          return;
        }
        await idbPut(old);
        const check = await idbGet();
        const ok = check && JSON.stringify(check) === JSON.stringify(old);
        if (!ok) throw new Error('Übernahme konnte nicht bestätigt werden');
        try{ localStorage.removeItem(LEGACY_KEY); }catch(e){}
        data = check;
        console.info('GO Organizer: Daten aus localStorage nach IndexedDB übernommen');
      }
    } else {
      // Daten sind bereits in IndexedDB – ein evtl. übrig gebliebener alter Schlüssel ist überflüssig
      try{ localStorage.removeItem(LEGACY_KEY); }catch(e){}
    }
    S = Object.assign(blank(), data || {});
  }catch(e){
    // Notlösung: weiter mit localStorage arbeiten, alten Schlüssel NICHT löschen
    console.warn(e);
    STORE_MODE = 'ls';
    try{ const raw = localStorage.getItem(LEGACY_KEY); S = Object.assign(blank(), raw ? JSON.parse(raw) : {}); }
    catch(err){ STORE_MODE = 'locked'; S = blank(); storeBanner('Gespeicherte Daten konnten nicht gelesen werden. Speichern ist gesperrt, damit nichts überschrieben wird.'); return; }
    storeBanner(`IndexedDB nicht verfügbar (${e.message}) – es wird vorübergehend localStorage benutzt.`);
  }
  try{ for (const k of ['go-organizer-dex', 'go-organizer-dex-v2']) localStorage.removeItem(k); }catch(e){}
  if (S.pokemon.some(p => 'pvp' in p)){ S.pokemon.forEach(p => delete p.pvp); save(); }
  if (migrateFriends()) save();
  try{ if (navigator.storage?.persist) PERSISTED = (await navigator.storage.persisted()) || (await navigator.storage.persist()); }catch(e){}
}
function exportJSON(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
  a.download = `go-organizer-${today()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const fmtDate = d => d ? new Date(d + 'T12:00').toLocaleDateString('de-DE') : '–';
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
const nf = n => n == null ? '–' : n.toLocaleString('de-DE');

function parseCSV(line){
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++){
    const c = line[i];
    if (q){ if (c === '"'){ if (line[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ','){ out.push(cur); cur = ''; } else if (c !== '\r') cur += c;
  }
  out.push(cur); return out;
}
function setDex(d){

}

function vivSuggest(region){
  let r = (region || '').trim().toLowerCase(); if (!r) return [];
  const flag = Object.keys(FLAG_COUNTRY).find(k => r.startsWith(k));
  r = r.replace(/^(?:[\u{1F1E6}-\u{1F1FF}]{2}|\u{1F3F4}[\u{E0061}-\u{E007A}]+\u{E007F})\s*/u, '').trim();
  if (!r && flag) r = FLAG_COUNTRY[flag];
  if (!r) return [];
  if (flag && !S.regionHints[r] && !VIV_HINTS[r] && VIV_HINTS[FLAG_COUNTRY[flag]] && !Object.keys(S.regionHints).some(k => r.includes(k) || k.includes(r))) return VIV_HINTS[FLAG_COUNTRY[flag]];
  if (S.regionHints[r]) return [S.regionHints[r]];
  if (VIV_HINTS[r]) return VIV_HINTS[r];
  for (const k of Object.keys(S.regionHints)) if (r.includes(k) || k.includes(r)) return [S.regionHints[k]];
  for (const k of Object.keys(VIV_HINTS)) if (r.includes(k)) return VIV_HINTS[k];
  return [];
}

function vivEncounters(n){ if (n < 3) return [0, 3]; if (n < 12) return [1, 12]; const k = Math.floor((n - 12) / 15); return [2 + k, 12 + 15 * (k + 1)]; }

/* ===================== Freundschaft ===================== */
// Level 0–5. FT = Tage/Punkte ab Freundschaftsbeginn, ab denen das Level erreicht ist.
// Bester Freund → Allerbester Freund: 90 Freundschaftspunkte (1/Tag + Bonus aus Wochenaufgaben).
const FL = ['Freund', 'Guter Freund', 'Superfreund', 'Hyperfreund', 'Bester Freund', 'Allerbester Freund'];
const FT = [0, 1, 7, 30, 90, 180];
const MAXLVL = FL.length - 1;
const spanOf = lvl => lvl >= MAXLVL ? null : FT[lvl + 1] - FT[lvl];
const unitOf = (lvl, n) => lvl === 4 ? (n === 1 ? 'Punkt' : 'Punkte') : (n === 1 ? 'Tag' : 'Tage');
const CHECK_DUE = 14;   // Tage, nach denen eine erneute Prüfung fällig ist

function friendProgress(f){
  const lvl = f.level || 0;
  const span = spanOf(lvl);
  if (span == null) return { pct: 100, left: null, next: null };
  const left = Math.max(0, Math.min(span, f.left ?? span));
  return { pct: (span - left) / span * 100, left, next: FL[lvl + 1], unit: unitOf(lvl, left) };
}
// Prüfstatus: wie lange hatte sich zum Zeitpunkt der letzten Prüfung nichts mehr geändert?
function activity(f){
  const c = f.lastCheck;
  if (!c) return { cls: 'uk', txt: 'Nie geprüft', detail: '', due: true, checkAge: null, stale: null };
  const checkAge = daysBetween(c, today());
  const lastChange = [f.xpChanged, f.friendChanged].filter(Boolean).sort().pop();
  const stale = lastChange ? Math.max(0, daysBetween(lastChange, c)) : null;
  let cls = 'uk', txt = 'Unklar';
  if (stale != null){
    if (stale < 7){ cls = 'ok'; txt = 'Aktiv'; }
    else if (stale < 21){ cls = 'lo'; txt = 'Ruhig'; }
    else { cls = 'no'; txt = 'Inaktiv?'; }
  }
  const detail = stale == null ? '' : stale === 0 ? 'Änderung am Prüftag' : `${stale} T ohne Änderung bis zur Prüfung`;
  return { cls, txt, detail, due: checkAge >= CHECK_DUE, checkAge, stale };
}
// Alte Freunde (Version mit f.days) auf Resttage umstellen
function migrateFriends(){
  let ch = false;
  for (const f of S.friends){
    if (f.left === undefined && f.days !== undefined){
      const lvl = Math.min(f.level || 0, MAXLVL);
      f.left = spanOf(lvl) == null ? null : Math.max(0, FT[lvl + 1] - (f.days || 0));
      f.leftDate = f.last || today();
      delete f.days; ch = true;
    }
  }
  return ch;
}
// „Heute interagiert“: Resttage um 1 senken, bei 0 ins nächste Level
function interact(f, undo){
  const lvl = f.level || 0;
  if (undo){
    const span = spanOf(lvl);
    if (f.prevState){ Object.assign(f, f.prevState); delete f.prevState; }
    else if (span != null) f.left = Math.min(span, (f.left ?? span) + 1);
    f.last = f.prevLast || '';
    return;
  }
  f.prevState = { level: f.level, left: f.left, leftDate: f.leftDate };
  f.prevLast = f.last;
  const span = spanOf(lvl);
  if (span != null){
    f.left = (f.left ?? span) - 1;
    if (f.left <= 0 && lvl < MAXLVL){ f.level = lvl + 1; f.left = spanOf(lvl + 1); }
  }
  f.leftDate = today(); f.last = today();
}

function ivStars(p){

  const n = s === 45 ? 4 : s >= 37 ? 3 : s >= 30 ? 2 : s >= 23 ? 1 : 0;

    new: (a, b) => (b.added || '').localeCompare(a.added || ''),
    dex: (a, b) => (a.dex || 9999) - (b.dex || 9999) || (b.cp || 0) - (a.cp || 0),
    cp: (a, b) => (b.cp || 0) - (a.cp || 0),
    iv: (a, b) => (ivPct(b) ?? -1) - (ivPct(a) ?? -1),
    name: (a, b) => (a.name || '').localeCompare(b.name || '', 'de')
  }[F.sort] || ((a, b) => (b.added || '').localeCompare(a.added || ''));
  list.sort(so);
  const all = S.pokemon;
  main.innerHTML = `
    <div class="stat">
      <div class="card"><b>${all.length}</b><span class="muted">Pokémon</span></div>
      <div class="card"><b>${new Set(all.map(p => p.dex).filter(Boolean)).size}</b><span class="muted">Arten</span></div>
      <div class="card"><b>${all.filter(p => p.shiny).length}</b><span class="muted">Shiny</span></div>

      <div class="card"><b>${all.filter(p => ivPct(p) === 100).length}</b><span class="muted">100 %</span></div>
      <div class="card"><b>${all.filter(p => p.bg).length}</b><span class="muted">Hintergründe</span></div>
      <div class="card"><b>${all.filter(p => p.size === 'XXL' || p.size === 'XXS').length}</b><span class="muted">XXL/XXS</span></div>
    </div>
    <div class="bar">
      <button class="b p" id="addMon">+ Pokémon</button>
      <button class="b" id="pgImp">Poke Genie importieren</button>
      <input id="q" placeholder="Suchen (Name, Kostüm, Tag, Attacke…)" value="${esc(F.q)}" style="flex:1;min-width:180px">
      <select id="flt">${[['', 'Alle'], ['shiny', 'Shiny'], ['costume', 'Mit Kostüm'], ['shadow', 'Crypto'], ['purified', 'Erlöst'], ['lucky', 'Glücks'], ['hundo', '100 %'], ['dyna', 'Dynamax/Gigadynamax'], ['move', 'Spezialattacke'], ['bg', 'Mit Hintergrund'], ['bgspecial', 'Spezial-Hintergrund'], ['big', 'XL + XXL'], ['XXL', 'nur XXL'], ['small', 'XS + XXS'], ['XXS', 'nur XXS'], ['fav', 'Favoriten']].map(([v, l]) => `<option value="${v}" ${F.flt === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <select id="sort">${[['new', 'Neueste'], ['dex', 'Pokédex-Nr.'], ['cp', 'WP'], ['iv', 'IV'], ['name', 'Name']].map(([v, l]) => `<option value="${v}" ${F.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    </div>
    ${list.length ? `<div class="note" style="margin-bottom:8px">${list.length} Treffer</div><div class="grid">${list.slice(0, F.lim).map(monCard).join('')}</div>
      ${list.length > F.lim ? `<div style="text-align:center;margin:16px"><button class="b" id="more">Weitere ${Math.min(120, list.length - F.lim)} anzeigen (${list.length - F.lim} übrig)</button> <button class="b" id="allm">Alle anzeigen</button></div>` : ''}`
      : `<div class="empty">${all.length ? 'Nichts gefunden.' : 'Noch keine Pokémon eingetragen – trag welche ein oder importiere deinen Poke-Genie-Export.'}</div>`}`;
  addMon.onclick = () => editMon();
  pgImp.onclick = openPgImport;
  const more = document.getElementById('more'); if (more) more.onclick = () => { F.lim += 120; renderMons(); };
  const allm = document.getElementById('allm'); if (allm) allm.onclick = () => { F.lim = 1e6; renderMons(); };
  const qi = document.getElementById('q');
  qi.oninput = e => { F.q = e.target.value; F.lim = 120; renderMons(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  flt.onchange = e => { F.flt = e.target.value; F.lim = 120; renderMons(); };
  sort.onchange = e => { F.sort = e.target.value; F.lim = 120; renderMons(); };
  main.querySelectorAll('.mon').forEach(el => el.onclick = () => editMon(S.pokemon.find(p => p.id === el.dataset.id)));
}
function monCard(p){
  const iv = ivPct(p);
  const b = [];
  if (p.shiny) b.push('<span class="bd sh">✨ Shiny</span>');
  if (p.align === 'shadow') b.push('<span class="bd cr">Crypto</span>');
  if (p.align === 'purified') b.push('<span class="bd er">Erlöst</span>');
  if (p.lucky) b.push('<span class="bd lu">Glücks</span>');
  if (p.dyna) b.push(`<span class="bd dy">${p.dyna === 'giga' ? 'Gigadynamax' : 'Dynamax'}</span>`);
  if (p.specialMove) b.push(`<span class="bd mv">⚡ Spezialattacke</span>`);
  if (p.costume) b.push(`<span class="bd">🎩 ${esc(p.costume)}</span>`);
  if (p.bg) b.push(`<span class="bd bg">🖼 ${p.bg === 'special' ? 'Spezial' : 'Ort'}${p.bgName ? ': ' + esc(p.bgName) : ''}</span>`);
  if (p.size) b.push(`<span class="bd sz">${p.size}</span>`);
  if (p.viv) b.push(`<span class="bd">${vivDot(p.viv)}${esc(VIVMAP[p.viv]?.[1] || '')}</span>`);
  const sub = [p.form, p.gender === 'm' ? '♂' : p.gender === 'f' ? '♀' : ''].filter(Boolean).join(' · ');
  return `<div class="card mon" data-id="${p.id}">
    ${p.fav ? '<span class="fav">★</span>' : ''}
    <img loading="lazy" src="${sprite(p.dex, p.shiny)}" alt="" onerror="this.style.visibility='hidden'">
    <div class="nm">${esc(p.nick || p.name || '?')}${p.nick ? ` <span class="muted" style="font-weight:400">(${esc(p.name)})</span>` : ''}</div>
    <div class="sub">${esc(sub)}</div>
    <div class="ivrow"><span>WP <b class="ivp">${p.cp ?? '–'}</b></span><span>Lv ${p.level ?? '–'}</span><span>${iv == null ? 'IV –' : `<b class="ivp">${iv} %</b>`}</span></div>
    <div class="ivrow"><span>${p.ivA ?? '–'}/${p.ivD ?? '–'}/${p.ivH ?? '–'}</span>${ivStars(p)}</div>
    <div class="badges">${b.join('')}</div>
  </div>`;
}

/* ---------- Freunde ---------- */
function renderFriends(){
  let list = S.friends.slice();
  const q = FF.q.trim().toLowerCase();
  if (q) list = list.filter(f => [f.name, f.code, f.notes, f.region].join(' ').toLowerCase().includes(q));
  const fl = FF.flt;
  if (fl === 'due') list = list.filter(f => activity(f).due);
  if (fl === 'inactive') list = list.filter(f => activity(f).cls === 'no');
  if (fl === 'quiet') list = list.filter(f => ['no', 'lo'].includes(activity(f).cls));
  if (fl === 'lucky') list = list.filter(f => f.lucky);
  if (fl === 'today') list = list.filter(f => f.last !== today());
  if (/^L\d$/.test(fl)) list = list.filter(f => (f.level || 0) === +fl[1]);
  const A = new Map(list.map(f => [f.id, activity(f)]));
  const so = {
    level: (a, b) => (b.level || 0) - (a.level || 0) || (friendProgress(a).left ?? 999) - (friendProgress(b).left ?? 999),
    next: (a, b) => (friendProgress(a).left ?? 999) - (friendProgress(b).left ?? 999),
    check: (a, b) => (a.lastCheck || '').localeCompare(b.lastCheck || ''),
    stale: (a, b) => (A.get(b.id).stale ?? -1) - (A.get(a.id).stale ?? -1),
    name: (a, b) => a.name.localeCompare(b.name, 'de')
  }[FF.sort] || ((a, b) => a.name.localeCompare(b.name, 'de'));
  list.sort((a, b) => so(a, b) || a.name.localeCompare(b.name, 'de'));
  const t = today(), all = S.friends;
  const cnt = fn => all.filter(fn).length;
  main.innerHTML = `
    <div class="stat">
      <div class="card"><b>${all.length}</b><span class="muted">Freunde</span></div>
      ${FL.map((l, i) => `<div class="card"><b>${cnt(f => (f.level || 0) === i)}</b><span class="muted">${l}</span></div>`).join('')}
      <div class="card"><b>${cnt(f => activity(f).due)}</b><span class="muted">Prüfung fällig</span></div>
      <div class="card"><b>${cnt(f => activity(f).cls === 'no')}</b><span class="muted">inaktiv?</span></div>
      <div class="card"><b>${cnt(f => f.last === t)}</b><span class="muted">heute interagiert</span></div>
    </div>
    <div class="bar">
      <button class="b p" id="addF">+ Freund</button>
      <button class="b" id="impF">Freunde importieren</button>
      <input id="fq" placeholder="Suchen (Name, Region, Code…)" value="${esc(FF.q)}" style="flex:1;min-width:160px">
      <select id="ff">${[['', 'Alle'], ['due', 'Prüfung fällig'], ['inactive', 'Inaktiv?'], ['quiet', 'Ruhig + inaktiv?'], ['today', 'Heute noch nicht interagiert'], ['lucky', 'Glücksfreunde'], ...FL.map((l, i) => ['L' + i, l])].map(([v, l]) => `<option value="${v}" ${FF.flt === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <select id="fs">${[['level', 'Freundeslevel'], ['next', 'Nächstes Level bald'], ['check', 'Am längsten nicht geprüft'], ['stale', 'Am längsten ohne Änderung'], ['name', 'Name']].map(([v, l]) => `<option value="${v}" ${FF.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    </div>
    ${list.length ? `<div class="note" style="margin-bottom:8px">${list.length} Treffer</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(290px,1fr))">${list.slice(0, FF.lim).map(f => friendCard(f, A.get(f.id))).join('')}</div>
      ${list.length > FF.lim ? `<div style="text-align:center;margin:16px"><button class="b" id="moreF">Weitere ${Math.min(60, list.length - FF.lim)} anzeigen (${list.length - FF.lim} übrig)</button> <button class="b" id="allF">Alle anzeigen</button></div>` : ''}`
      : `<div class="empty">${all.length ? 'Nichts gefunden.' : 'Noch keine Freunde eingetragen – trag welche ein oder importiere sie.'}</div>`}`;
  addF.onclick = () => editFriend();
  impF.onclick = openFriendImport;
  const mf = document.getElementById('moreF'); if (mf) mf.onclick = () => { FF.lim += 60; renderFriends(); };
  const af = document.getElementById('allF'); if (af) af.onclick = () => { FF.lim = 1e6; renderFriends(); };
  fq.oninput = e => { FF.q = e.target.value; FF.lim = 60; renderFriends(); const n = document.getElementById('fq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  ff.onchange = e => { FF.flt = e.target.value; FF.lim = 60; renderFriends(); };
  fs.onchange = e => { FF.sort = e.target.value; FF.lim = 60; renderFriends(); };
  main.querySelectorAll('[data-act]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const f = S.friends.find(x => x.id === b.dataset.id);
    const a = b.dataset.act;
    if (a === 'edit') return editFriend(f);
    if (a === 'check') return checkFriend(f);
    if (a === 'card') return editCard(null, f.id);
    if (a === 'inter'){ interact(f, f.last === today()); save(); renderFriends(); }
    if (a === 'gift'){ f.giftSent = f.giftSent === today() ? '' : today(); save(); renderFriends(); }
  });
}
function friendCard(f, ac){
  ac = ac || activity(f);
  const pr = friendProgress(f), t = today(), lvl = f.level || 0;
  const cards = S.postcards.filter(c => c.friendId === f.id);
  const pats = [...new Set(cards.map(c => c.viv).filter(Boolean))];
  const hearts = '♥'.repeat(lvl) + '♡'.repeat(MAXLVL - lvl);
  const eta = pr.left ? new Date(Date.now() + (pr.left - (f.last === t ? 0 : 1)) * 864e5).toLocaleDateString('de-DE') : '';
  const trainer = [f.trainerLvl ? `Lv ${f.trainerLvl}` : '', f.xp != null ? `${nf(f.xp)} EP` : ''].filter(Boolean).join(' · ');
  const short = d => d ? new Date(d + 'T12:00').toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' }) : '–';
  return `<div class="card fr">
    <div class="row"><h3 class="sp">${esc(f.name)} ${f.lucky ? '<span class="bd lu">Glücksfreund</span>' : ''}</h3><button class="b s" data-act="edit" data-id="${f.id}" title="Bearbeiten">✎</button></div>
    <div class="muted" style="font-size:13px">${[esc(f.region || 'Herkunft unbekannt'), trainer, f.code ? esc(f.code) : ''].filter(Boolean).join(' · ')}</div>
    <div class="row" style="margin-top:8px"><span class="hearts" style="color:#e2557a">${hearts}</span><b class="sp">${FL[lvl]}</b></div>
    <div class="prog"><i style="width:${pr.pct}%"></i></div>
    <div class="note">${pr.next ? `Noch <b>${pr.left}</b> ${pr.unit} bis <b>${pr.next}</b>${eta ? ` · frühestens ${eta}` : ''}` : `Höchstes Level erreicht 🎉${f.left != null ? ` · Zähler laut Spiel: ${f.left}` : ''}`}</div>
    <div class="row" style="margin-top:10px">
      <span class="st ${ac.cls}">${ac.txt}</span>${ac.due ? '<span class="st lo">Prüfung fällig</span>' : ''}<span class="note sp">${ac.detail}</span>
    </div>
    <div class="note" style="margin-top:4px">Geprüft ${short(f.lastCheck)}${ac.checkAge != null ? ` (vor ${ac.checkAge} T)` : ''} · EP geändert ${short(f.xpChanged)} · Freundschaft geändert ${short(f.friendChanged)}</div>
    ${pats.length ? `<div class="note" style="margin-top:4px">Vivillon: ${pats.map(k => vivDot(k) + esc(VIVMAP[k]?.[1])).join(', ')}</div>` : ''}
    ${cards.length ? `<div class="note" style="margin-top:2px">${cards.length} Postkarte${cards.length === 1 ? '' : 'n'}</div>` : ''}
    <div class="row" style="margin-top:10px">
      <button class="b s ${f.last === t ? 'p' : ''}" data-act="inter" data-id="${f.id}">${f.last === t ? '✓ Heute interagiert' : 'Heute interagiert'}</button>
      <button class="b s ${f.giftSent === t ? 'p' : ''}" data-act="gift" data-id="${f.id}">🎁 ${f.giftSent === t ? 'Gesendet' : 'Geschenk'}</button>
      <button class="b s ${ac.due ? 'p' : ''}" data-act="check" data-id="${f.id}">Prüfen</button>
      <button class="b s" data-act="card" data-id="${f.id}">+ Postkarte</button>
    </div>
  </div>`;
}
function editFriend(f){
  const isNew = !f; f = f || { id: uid(), level: 0, left: 1, leftDate: today(), snaps: [], since: today() };
  const pr = friendProgress(f);
  const snaps = (f.snaps || []).slice().sort((a, b) => b.date.localeCompare(a.date));
  openDlg(isNew ? 'Freund hinzufügen' : esc(f.name), `
    <div class="fg">
      <label>Name / Trainername<input name="name" value="${esc(f.name)}" required></label>
      <label>Freundescode<input name="code" value="${esc(f.code)}" placeholder="1234 5678 9012"></label>
      <label>Herkunft (Land/Region)<input name="region" list="dlRegion" value="${esc(f.region)}"></label>
      <label>Freunde seit<input name="since" type="date" value="${f.since || ''}"></label>
    </div>
    <div class="sec">Freundschaft</div>

/* ===================== Poke-Genie-Import ===================== */
function parseCSVText(text){
  text = text.replace(/^﻿/, '');
  const firstLine = text.slice(0, text.indexOf('\n') + 1 || undefined);
  const delim = (firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; continue; }
    if (c === '"') q = true;
    else if (c === delim){ row.push(cur); cur = ''; }
    else if (c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  const head = rows.shift().map(h => h.trim());
  return rows.filter(r => r.some(v => v.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()])));
}
// Spaltennamen der deutschen und englischen Poke-Genie-Exporte
const PG = {
  name: ['Name'], form: ['Form'], dex: ['Pokemon-Nummer', 'Pokemon Number'], gender: ['Geschlecht', 'Gender'],
  cp: ['WP', 'CP'], hp: ['KP', 'HP'], a: ['Angr. IV', 'Atk IV'], d: ['Ver. IV', 'Def IV'], h: ['Ausd. IV', 'Sta IV'],
  lmin: ['Min-Level', 'Level Min'], lmax: ['Max-Level', 'Level Max'],
  fast: ['Schnell-Angriff', 'Quick Move'], c1: ['Auflade-Angriff', 'Charge Move'], c2: ['Auflade-Angriff 2', 'Charge Move 2'],
  scan: ['Scandatum', 'Scan Date'], orig: ['Ursprüngliches Scan-Datum', 'Original Scan Date'], caught: ['Datum Gefangen', 'Catch Date'],
  weight: ['Gewicht', 'Weight'], height: ['Größe', 'Height'], lucky: ['Glücks', 'Lucky'], align: ['Crypto/Erlöstes', 'Shadow/Purified'],
  fav: ['Favorit', 'Favorite'],
};
const pgGet = (row, k) => { for (const c of PG[k]) if (c in row) return row[c]; return ''; };
function pgDate(v){
  if (!v) return '';
  let m = v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  m = v.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[0];
  m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  return '';
}
const pgNum = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
function pgRow(r){
  const dex = num(pgGet(r, 'dex'));
  const form = pgGet(r, 'form');
  const g = pgGet(r, 'gender');
  const al = pgGet(r, 'align');
  const lmin = pgNum(pgGet(r, 'lmin')), lmax = pgNum(pgGet(r, 'lmax'));
  const orig = pgGet(r, 'orig') || pgGet(r, 'scan');
  const ivA = num(pgGet(r, 'a')), ivD = num(pgGet(r, 'd')), ivH = num(pgGet(r, 'h'));
  return {
    pgKey: [orig, ivA, ivD, ivH, g].join('|'),
    name: (dex && DEX[dex]?.de) || pgGet(r, 'name'), dex,
    form: /^normal$/i.test(form) ? '' : form,
    gender: g === '♂' ? 'm' : g === '♀' ? 'f' : '',
    cp: num(pgGet(r, 'cp')), hp: num(pgGet(r, 'hp')), ivA, ivD, ivH,
    level: lmin != null && lmax != null && lmin !== lmax ? lmin : (lmin ?? lmax),
    fast: pgGet(r, 'fast'), c1: pgGet(r, 'c1'), c2: pgGet(r, 'c2'),
    caught: pgDate(pgGet(r, 'caught')),
    weight: pgNum(pgGet(r, 'weight')), height: pgNum(pgGet(r, 'height')),
    lucky: pgGet(r, 'lucky') === '1',
    align: al === '1' ? 'shadow' : al === '2' ? 'purified' : '',
    pgFav: pgGet(r, 'fav') === '1',
    added: orig ? orig.replace(' ', 'T') : new Date().toISOString(),
    src: 'pokegenie'
  };
}
function importPokeGenie(text, removeMissing){
  const rows = parseCSVText(text);
  if (!rows.length || !('Pokemon-Nummer' in rows[0] || 'Pokemon Number' in rows[0])) throw new Error('Das sieht nicht nach einem Poke-Genie-Export aus.');
  const pool = {};
  S.pokemon.forEach(p => { if (p.pgKey) (pool[p.pgKey] ||= []).push(p); });
  const seen = new Set(); let added = 0, updated = 0, removed = 0;
  // Werte aus Poke Genie werden überschrieben, eigene Felder (Shiny, Kostüm, Hintergrund, Größe, Notizen …) bleiben
  for (const r of rows){
    const n = pgRow(r);
    const cands = (pool[n.pgKey] || []).filter(p => !seen.has(p.id));
    let m = null;
    if (cands.length) m = cands.sort((a, b) => ((a.dex === n.dex ? 0 : 1) - (b.dex === n.dex ? 0 : 1)) || Math.abs((a.cp || 0) - n.cp) - Math.abs((b.cp || 0) - n.cp))[0];
    if (m){
      const { added: _a, pgFav, ...upd } = n;
      if (!m.caught && !upd.caught) delete upd.caught;
      Object.assign(m, upd); seen.add(m.id); updated++;
    } else {
      const { pgFav, ...rest } = n;
      const p = { id: uid(), ...rest, fav: pgFav };
      S.pokemon.push(p); seen.add(p.id); added++;
    }
  }
  if (removeMissing){
    const before = S.pokemon.length;
    S.pokemon = S.pokemon.filter(p => p.src !== 'pokegenie' || seen.has(p.id));
    removed = before - S.pokemon.length;
  }
  return { total: rows.length, added, updated, removed };
}
function openPgImport(){
  openDlg('Poke-Genie-Export importieren', `
    <p>In Poke Genie: <b>Einstellungen → Exportieren</b> (CSV) und die Datei hier auswählen.</p>
    <label class="fl">CSV-Datei<input type="file" name="file" accept=".csv,text/csv" required></label>
    <label class="chk" style="margin-top:12px"><input type="checkbox" name="rm"> Importierte Pokémon entfernen, die nicht mehr im Export sind (z. B. verschickt oder getauscht)</label>
    <p class="note">Bei einem erneuten Import werden bereits importierte Pokémon wiedererkannt und aktualisiert (WP, Level, Attacken, Entwicklung …). Was du selbst einträgst – Shiny, Spezialattacke, Kostüm, Hintergrund, Größenklasse, Vivillon-Muster, Spitzname, Tags, Notizen – bleibt erhalten, denn das exportiert Poke Genie nicht.</p>
    <p class="note">Tipp: Vorher unter „Daten“ eine Sicherung exportieren.</p>`, '',
    async fd => {
      const f = fd.get('file'); if (!f || !f.size) return;
      try{
        const res = importPokeGenie(await f.text(), !!fd.get('rm'));
        const ok = await save();
        render();
        if (!ok) return alert('Import eingelesen, aber Speichern fehlgeschlagen – siehe roter Hinweis oben.');
        alert(`${res.total} Pokémon gelesen:\n• ${res.added} neu\n• ${res.updated} aktualisiert${res.removed ? `\n• ${res.removed} entfernt` : ''}`);
      }catch(err){ alert('Import fehlgeschlagen: ' + err.message); }
    });
}

/* ===================== Freunde-Import (Notion) ===================== */
// Akzeptiert die vorbereitete JSON-Datei (type "go-organizer-friends") oder einen CSV-Export der Notion-Datenbank.
// Verändert ausschließlich S.friends – Pokémon, Postkarten usw. bleiben unangetastet.
const MONTHS = { jan: 1, januar: 1, january: 1, feb: 2, februar: 2, february: 2, mär: 3, mar: 3, märz: 3, march: 3, apr: 4, april: 4, mai: 5, may: 5, jun: 6, juni: 6, june: 6, jul: 7, juli: 7, july: 7, aug: 8, august: 8, sep: 9, sept: 9, september: 9, okt: 10, oct: 10, oktober: 10, october: 10, nov: 11, november: 11, dez: 12, dec: 12, dezember: 12, december: 12 };
function anyDate(v){
  v = String(v || '').trim(); if (!v) return '';
  let m = v.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[0];
  m = v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  m = v.match(/^(\d{1,2})\.?\s+([A-Za-zÄÖÜäöü]+)\.?\s+(\d{4})/); if (m && MONTHS[m[2].toLowerCase()]) return `${m[3]}-${String(MONTHS[m[2].toLowerCase()]).padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  m = v.match(/^([A-Za-zÄÖÜäöü]+)\.?\s+(\d{1,2}),?\s+(\d{4})/); if (m && MONTHS[m[1].toLowerCase()]) return `${m[3]}-${String(MONTHS[m[1].toLowerCase()]).padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  return '';
}
const levelFromLabel = v => {
  const s = String(v ?? '').trim(); if (s === '') return null;
  const m = s.match(/^\(?(\d)\)?/); if (m) return Math.min(MAXLVL, +m[1]);
  const i = FL.findIndex(l => l.toLowerCase() === s.toLowerCase()); return i < 0 ? null : i;
};
const yes = v => /^(yes|ja|true|1|__yes__|✓|x)$/i.test(String(v ?? '').trim());
const numOrNull = v => { const s = String(v ?? '').replace(/[.\s]/g, '').replace(',', '.'); return s === '' || isNaN(+s) ? null : +s; };
function notionCsvToFriends(text){
  const rows = parseCSVText(text);
  if (!rows.length || !('Name' in rows[0]) || !('Freundeslevel' in rows[0])) throw new Error('Unbekanntes Format – erwartet wird der CSV-Export der Notion-Datenbank „Pokémon GO-Freunde“.');
  return rows.map(r => ({
    name: r['Name'], level: levelFromLabel(r['Freundeslevel']), trainerLvl: numOrNull(r['Lvl']),
    xp: numOrNull(r['XP zuletzt gesehen']), xpPrev: numOrNull(r['XP vorher']),
    left: numOrNull(r['Fortschritt zuletzt gesehen']), leftPrev: numOrNull(r['Fortschritt vorher']),
    lastCheck: anyDate(r['L. Prüf.']), xpChanged: anyDate(r['L. XP-Änd.']), friendChanged: anyDate(r['L. F-änd.']),
    region: r['Region'] || '', lucky: yes(r['Glücksfreund'])
  }));
}
function importFriends(list){
  const byName = new Map(S.friends.map(f => [f.name.trim().toLowerCase(), f]));
  let added = 0, updated = 0, skipped = 0;
  for (const r of list){
    const name = String(r.name || '').trim(); if (!name){ skipped++; continue; }
    let f = byName.get(name.toLowerCase());
    const isNew = !f;
    if (isNew){ f = { id: uid(), name, snaps: [] }; }
    const lvl = r.level ?? f.level ?? 0;
    Object.assign(f, {
      level: lvl, left: r.left ?? spanOf(lvl), leftDate: r.lastCheck || today(),
      trainerLvl: r.trainerLvl ?? f.trainerLvl ?? null, xp: r.xp ?? f.xp ?? null,
      lastCheck: r.lastCheck || f.lastCheck || '', xpChanged: r.xpChanged || f.xpChanged || '', friendChanged: r.friendChanged || f.friendChanged || '',
      lucky: !!r.lucky
    });
    if (r.region) f.region = r.region;
    if (r.xpPrev != null || r.leftPrev != null) f.importPrev = { xp: r.xpPrev, left: r.leftPrev };
    // Vor der Umstellung (ab 20.03.2026) wurden Gesamt-EP notiert – die sind mit den heutigen Werten nicht vergleichbar
    const oldMetric = r.xp != null && r.xp >= 10000 && (r.lastCheck || '') < '2026-03-20';
    f.chk = { date: f.lastCheck, lvl: f.trainerLvl, xp: f.xp, level: f.level, left: r.left ?? null, xpComparable: !oldMetric };
    if (f.lastCheck){
      f.snaps = (f.snaps || []).filter(s => s.date !== f.lastCheck);
      f.snaps.push({ date: f.lastCheck, lvl: f.trainerLvl, xp: f.xp, level: f.level, left: r.left ?? null });
    }
    delete f.prevState;
    if (isNew){ S.friends.push(f); byName.set(name.toLowerCase(), f); added++; } else updated++;
  }
  return { added, updated, skipped };
}
function openFriendImport(){
  openDlg('Freunde importieren', `
    <p style="margin-top:0">Wähle die vorbereitete Datei <b>go-organizer-freunde.json</b> oder einen CSV-Export der Notion-Datenbank (Notion: „…“ → Exportieren → Markdown &amp; CSV).</p>
    <label class="fl">Datei<input type="file" name="file" accept=".json,.csv,application/json,text/csv" required></label>
    <p class="note">Übernommen werden Name, Freundeslevel, Resttage, Trainerlevel, EP, Region, Glücksfreund und die Daten der letzten Prüfung und Änderungen. Vorhandene Freunde mit gleichem Namen werden aktualisiert; Freundescode, Notizen und Postkarten bleiben erhalten. <b>Pokémon werden nicht verändert.</b></p>
    <p class="note">Tipp: Vorher unter „Daten“ eine Sicherung exportieren.</p>`, '',
    async fd => {
      const file = fd.get('file'); if (!file || !file.size) return;
      try{
        const text = await file.text();
        let list;
        if (/^\s*[\[{]/.test(text)){
          const d = JSON.parse(text);
          list = Array.isArray(d) ? d : d.friends;
          if (!Array.isArray(list) || (d.type && d.type !== 'go-organizer-friends')) throw new Error('Unbekanntes JSON-Format. Für eine komplette Sicherung bitte „Daten → Importieren“ verwenden.');
        } else list = notionCsvToFriends(text);
        const res = importFriends(list);
        const ok = await save(); render();
        alert(ok ? `${list.length} Freunde gelesen:\n• ${res.added} neu\n• ${res.updated} aktualisiert${res.skipped ? `\n• ${res.skipped} ohne Namen übersprungen` : ''}` : 'Import eingelesen, aber Speichern fehlgeschlagen – siehe roter Hinweis oben.');
      }catch(err){ alert('Import fehlgeschlagen: ' + err.message); }
    });
}

/* ===================== Dialog-Helfer ===================== */
let dlgCb = null;
function openDlg(title, body, extraBtns, cb){
  dlgT.innerHTML = title; dlgB.innerHTML = body;
  dlgF.innerHTML = `${extraBtns}<button class="b" value="cancel" formnovalidate>Abbrechen</button><button class="b p" value="ok">Speichern</button>`;
  dlgCb = cb; dlg.showModal();
  const first = dlgB.querySelector('input:not([type=checkbox]),select'); if (first) first.focus();
}
dlgForm.addEventListener('submit', e => {
  const act = e.submitter?.value;
  if (act === 'cancel') return;
  if (dlgCb) dlgCb(new FormData(dlgForm), act);
});

/* ===================== Theme & Start ===================== */
const TH = 'go-organizer-theme';
function applyTheme(t){ if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
try{ applyTheme(localStorage.getItem(TH)); }catch(e){}
themeBtn.onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const t = dark ? 'light' : 'dark'; applyTheme(t); try{ localStorage.setItem(TH, t); }catch(e){}
};
document.getElementById('main').innerHTML = '<div class="empty">Lade Daten…</div>';
initStore().then(() => { render(); loadDex(); });
</script>
