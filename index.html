<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#1c2233; --muted:#6b7389; --line:#e2e6ef;
  --acc:#2f6fed; --acc2:#e8f0ff; --good:#1e9e5a; --warn:#d98a00; --bad:#d64545;
  --gold:#e0a800; --shadow:0 1px 3px rgba(20,30,60,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141c; --card:#1a1f2b; --ink:#e7eaf2; --muted:#98a0b5; --line:#2b3242;
    --acc:#6b9bff; --acc2:#22304d; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#11141c; --card:#1a1f2b; --ink:#e7eaf2; --muted:#98a0b5; --line:#2b3242;
  --acc:#6b9bff; --acc2:#22304d; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;max-width:1200px;margin:0 auto;padding:10px 16px}

<script>
/* ===================== Daten & Speicher (IndexedDB) ===================== */
// Daten liegen in IndexedDB "pokemon-go-tool" (Store "kv", Eintrag "state").
// localStorage enthält nur noch das Theme ("go-organizer-theme").
const LEGACY_KEY = 'go-organizer-v1';
const DB_NAME = 'pokemon-go-tool', DB_STORE = 'kv', DB_REC = 'state';
const blank = () => ({ pokemon: [], friends: [], postcards: [], regionHints: {}, version: 1 });
let S = blank();
let STORE_MODE = 'idb';      // 'idb' | 'ls' (Notlösung, falls IndexedDB nicht verfügbar) | 'locked'
let PERSISTED = null;
let db = null;

function idbOpen(){
  return new Promise((res, rej) => {
    if (!('indexedDB' in window)) return rej(new Error('IndexedDB nicht verfügbar'));
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('Datenbank blockiert – bitte andere Tabs dieses Tools schließen'));
  });
}
function idbGet(){
  return new Promise((res, rej) => {
    const t = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(DB_REC);
    t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error);
  });
}
function idbPut(val){
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(val, DB_REC);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('Schreibvorgang abgebrochen'));
  });
}
const plain = o => JSON.parse(JSON.stringify(o));

/* Sichtbarer Hinweis bei Speicherproblemen */
function storeBanner(msg){
  let el = document.getElementById('storeErr');
  if (!msg){ if (el) el.remove(); return; }
  if (!el){
    el = document.createElement('div'); el.id = 'storeErr';
    el.style.cssText = 'background:#d64545;color:#fff;padding:10px 16px;font-weight:600;position:sticky;top:0;z-index:20';
    document.body.prepend(el);
  }
  el.innerHTML = `⚠️ ${esc(msg)} <button class="b s" id="storeErrExp" style="margin-left:8px">Jetzt als JSON sichern</button>`;
  document.getElementById('storeErrExp').onclick = exportJSON;
}

let saveChain = Promise.resolve(), pending = 0;
function save(){
  if (STORE_MODE === 'locked'){ storeBanner('Gespeicherte Daten konnten nicht gelesen werden – Speichern ist gesperrt, damit nichts überschrieben wird. Seite neu laden oder Sicherung importieren.'); return Promise.resolve(false); }
  const snap = plain(S); pending++;
  saveChain = saveChain.then(async () => {
    try{
      if (STORE_MODE === 'idb') await idbPut(snap);
      else localStorage.setItem(LEGACY_KEY, JSON.stringify(snap));
      storeBanner(''); return true;
    }catch(e){
      const quota = e && (e.name === 'QuotaExceededError' || /quota/i.test(e.message || ''));
      storeBanner(`Speichern fehlgeschlagen${quota ? ' – Speicherplatz voll' : ''} (${e?.message || e}). Letzte Änderungen sind NICHT gesichert.`);
      return false;
    }finally{ pending--; }
  });
  return saveChain;
}
window.addEventListener('beforeunload', e => { if (pending > 0 || document.getElementById('storeErr')){ e.preventDefault(); e.returnValue = ''; } });

async function initStore(){
  try{
    db = await idbOpen();
    let data = await idbGet();
    if (data == null){
      // Erster Start mit IndexedDB: Daten aus localStorage übernehmen
      let raw = null; try{ raw = localStorage.getItem(LEGACY_KEY); }catch(e){}
      if (raw){
        let old;
        try{ old = JSON.parse(raw); }catch(e){
          STORE_MODE = 'locked';
          storeBanner('Alte Daten im localStorage sind beschädigt und wurden nicht übernommen (sie bleiben unangetastet). Bitte eine JSON-Sicherung importieren.');
          return;
        }
        await idbPut(old);
        const check = await idbGet();
        const ok = check && JSON.stringify(check) === JSON.stringify(old);
        if (!ok) throw new Error('Übernahme konnte nicht bestätigt werden');
        try{ localStorage.removeItem(LEGACY_KEY); }catch(e){}
        data = check;
        console.info('GO Organizer: Daten aus localStorage nach IndexedDB übernommen');
      }
    } else {
      // Daten sind bereits in IndexedDB – ein evtl. übrig gebliebener alter Schlüssel ist überflüssig
      try{ localStorage.removeItem(LEGACY_KEY); }catch(e){}
    }
    S = Object.assign(blank(), data || {});
  }catch(e){
    // Notlösung: weiter mit localStorage arbeiten, alten Schlüssel NICHT löschen
    console.warn(e);
    STORE_MODE = 'ls';
    try{ const raw = localStorage.getItem(LEGACY_KEY); S = Object.assign(blank(), raw ? JSON.parse(raw) : {}); }
    catch(err){ STORE_MODE = 'locked'; S = blank(); storeBanner('Gespeicherte Daten konnten nicht gelesen werden. Speichern ist gesperrt, damit nichts überschrieben wird.'); return; }
    storeBanner(`IndexedDB nicht verfügbar (${e.message}) – es wird vorübergehend localStorage benutzt.`);
  }
  try{ for (const k of ['go-organizer-dex', 'go-organizer-dex-v2']) localStorage.removeItem(k); }catch(e){}
  if (S.pokemon.some(p => 'pvp' in p)){ S.pokemon.forEach(p => delete p.pvp); save(); }
  try{ if (navigator.storage?.persist) PERSISTED = (await navigator.storage.persisted()) || (await navigator.storage.persist()); }catch(e){}
}
function exportJSON(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
  a.download = `go-organizer-${today()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const fmtDate = d => d ? new Date(d + 'T12:00').toLocaleDateString('de-DE') : '–';
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
const nf = n => n == null ? '–' : n.toLocaleString('de-DE');

function loadDex(){
  const de = DEX_DE.split('|'), en = DEX_EN.split('|'), d = {};
  de.forEach((n, i) => d[i + 1] = { de: n, en: en[i] });
  setDex(d);
}
function parseCSV(line){
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++){
    const c = line[i];
    if (q){ if (c === '"'){ if (line[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ','){ out.push(cur); cur = ''; } else if (c !== '\r') cur += c;
  }
  out.push(cur); return out;
}
function setDex(d){
  DEX = d; NAME2ID = {};
  const opts = [];
  for (const id of Object.keys(d).map(Number).sort((a,b)=>a-b)){
    const n = d[id]; const de = n.de || n.en;
    if (n.de) NAME2ID[n.de.toLowerCase()] = id;
    if (n.en) NAME2ID[n.en.toLowerCase()] ||= id;
    opts.push(`<option value="${esc(de)}">#${id} ${esc(de)}</option>`);
  }
  document.getElementById('dlSpecies').innerHTML = opts.join('');
  document.getElementById('dbstate').textContent = '';
  // bereits gespeicherte Pokémon auf deutsche Namen umstellen
  let changed = false;
  for (const p of S.pokemon){
    const id = p.dex || NAME2ID[(p.name || '').toLowerCase()];
    const de = id && DEX[id]?.de;
    if (de && p.name !== de){ p.name = de; p.dex = id; changed = true; }
  }
  if (changed){ save(); render(); }
}

function vivSuggest(region){
  const r = (region || '').trim().toLowerCase(); if (!r) return [];
  if (S.regionHints[r]) return [S.regionHints[r]];
  if (VIV_HINTS[r]) return VIV_HINTS[r];
  for (const k of Object.keys(S.regionHints)) if (r.includes(k) || k.includes(r)) return [S.regionHints[k]];
  for (const k of Object.keys(VIV_HINTS)) if (r.includes(k)) return VIV_HINTS[k];
  return [];
}

function vivEncounters(n){ if (n < 3) return [0, 3]; if (n < 12) return [1, 12]; const k = Math.floor((n - 12) / 15); return [2 + k, 12 + 15 * (k + 1)]; }

/* ===================== Freundschaft ===================== */
const FL = ['Freund', 'Gute Freunde', 'Super Freunde', 'Ultra Freunde', 'Beste Freunde'];
const FT = [0, 1, 7, 30, 90]; // Tage Interaktion für das jeweilige Level
const levelFromDays = d => FT.reduce((l, t, i) => d >= t ? i : l, 0);
function friendProgress(f){
  const lvl = f.level || 0;
  if (lvl >= 4) return { pct: 100, left: 0, next: null };
  const from = FT[lvl], to = FT[lvl + 1];
  const done = Math.max(0, (f.days || 0) - from);
  return { pct: Math.min(100, done / (to - from) * 100), left: Math.max(0, to - (f.days || 0)), next: FL[lvl + 1] };
}
function activity(f){
  const sn = (f.snaps || []).slice().sort((a, b) => a.date.localeCompare(b.date));
  if (!sn.length) return { cls: 'uk', txt: 'Keine Daten', detail: '' };
  const last = sn[sn.length - 1];
  const age = daysBetween(last.date, today());
  if (sn.length < 2) return { cls: 'uk', txt: 'Erst 1 Eintrag', detail: `Lv ${last.lvl ?? '?'} · ${nf(last.xp)} EP`, last, age };
  // Vergleich mit dem ältesten Eintrag der letzten ~30 Tage (mind. der vorletzte)
  let ref = sn[sn.length - 2];
  for (let i = sn.length - 2; i >= 0; i--){ if (daysBetween(sn[i].date, last.date) <= 30) ref = sn[i]; else break; }
  const dd = Math.max(1, daysBetween(ref.date, last.date));
  const gain = (last.xp ?? 0) - (ref.xp ?? 0);
  const perDay = Math.round(gain / dd);
  let cls = 'ok', txt = 'Aktiv';
  if (gain <= 0) { cls = 'no'; txt = 'Inaktiv'; }
  else if (perDay < 2000) { cls = 'lo'; txt = 'Wenig aktiv'; }
  let detail = `+${nf(gain)} EP in ${dd} T (≈ ${nf(perDay)}/Tag)`;
  if (age > 21) detail += ` · letzter Eintrag vor ${age} T`;
  return { cls, txt, detail, last, age, perDay };
}

function ivStars(p){
  const s = (p.ivA ?? -1) + (p.ivD ?? -1) + (p.ivH ?? -1);
  if (s < 0 || p.ivA == null) return '';
  const n = s === 45 ? 4 : s >= 37 ? 3 : s >= 30 ? 2 : s >= 23 ? 1 : 0;
  return n === 4 ? '<span class="stars" title="Perfekt">★★★ 100</span>' : `<span class="stars">${'★'.repeat(n)}${'☆'.repeat(3 - n)}</span>`;
}

    ${list.length ? `<div class="note" style="margin-bottom:8px">${list.length} Treffer</div><div class="grid">${list.slice(0, F.lim).map(monCard).join('')}</div>
      ${list.length > F.lim ? `<div style="text-align:center;margin:16px"><button class="b" id="more">Weitere ${Math.min(120, list.length - F.lim)} anzeigen (${list.length - F.lim} übrig)</button> <button class="b" id="allm">Alle anzeigen</button></div>` : ''}`
      : `<div class="empty">${all.length ? 'Nichts gefunden.' : 'Noch keine Pokémon eingetragen – trag welche ein oder importiere deinen Poke-Genie-Export.'}</div>`}`;
  addMon.onclick = () => editMon();
  pgImp.onclick = openPgImport;
  const more = document.getElementById('more'); if (more) more.onclick = () => { F.lim += 120; renderMons(); };
  const allm = document.getElementById('allm'); if (allm) allm.onclick = () => { F.lim = 1e6; renderMons(); };
  const qi = document.getElementById('q');
  qi.oninput = e => { F.q = e.target.value; F.lim = 120; renderMons(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  flt.onchange = e => { F.flt = e.target.value; F.lim = 120; renderMons(); };
  sort.onchange = e => { F.sort = e.target.value; F.lim = 120; renderMons(); };
  main.querySelectorAll('.mon').forEach(el => el.onclick = () => editMon(S.pokemon.find(p => p.id === el.dataset.id)));
}
function monCard(p){
  const iv = ivPct(p);
  const b = [];
  if (p.shiny) b.push('<span class="bd sh">✨ Shiny</span>');
  if (p.align === 'shadow') b.push('<span class="bd cr">Crypto</span>');
  if (p.align === 'purified') b.push('<span class="bd er">Erlöst</span>');
  if (p.lucky) b.push('<span class="bd lu">Glücks</span>');
  if (p.dyna) b.push(`<span class="bd dy">${p.dyna === 'giga' ? 'Gigadynamax' : 'Dynamax'}</span>`);
  if (p.costume) b.push(`<span class="bd">🎩 ${esc(p.costume)}</span>`);
  if (p.bg) b.push(`<span class="bd bg">🖼 ${p.bg === 'special' ? 'Spezial' : 'Ort'}${p.bgName ? ': ' + esc(p.bgName) : ''}</span>`);
  if (p.size) b.push(`<span class="bd sz">${p.size}</span>`);
  if (p.viv) b.push(`<span class="bd">${vivDot(p.viv)}${esc(VIVMAP[p.viv]?.[1] || '')}</span>`);
  const sub = [p.form, p.gender === 'm' ? '♂' : p.gender === 'f' ? '♀' : ''].filter(Boolean).join(' · ');
  return `<div class="card mon" data-id="${p.id}">
    ${p.fav ? '<span class="fav">★</span>' : ''}
    <img loading="lazy" src="${sprite(p.dex, p.shiny)}" alt="" onerror="this.style.visibility='hidden'">
    <div class="nm">${esc(p.nick || p.name || '?')}${p.nick ? ` <span class="muted" style="font-weight:400">(${esc(p.name)})</span>` : ''}</div>
    <div class="sub">${esc(sub)}</div>
    <div class="ivrow"><span>WP <b class="ivp">${p.cp ?? '–'}</b></span><span>Lv ${p.level ?? '–'}</span><span>${iv == null ? 'IV –' : `<b class="ivp">${iv} %</b>`}</span></div>
    <div class="ivrow"><span>${p.ivA ?? '–'}/${p.ivD ?? '–'}/${p.ivH ?? '–'}</span>${ivStars(p)}</div>
    <div class="badges">${b.join('')}</div>
  </div>`;
}

/* ---------- Freunde ---------- */
function renderFriends(){
  let list = S.friends.slice();
  const q = FF.q.trim().toLowerCase();
  if (q) list = list.filter(f => [f.name, f.code, f.notes, f.region].join(' ').toLowerCase().includes(q));
  const so = {
    level: (a, b) => (b.level || 0) - (a.level || 0) || friendProgress(a).left - friendProgress(b).left,
    next: (a, b) => (friendProgress(a).left || 999) - (friendProgress(b).left || 999),
    name: (a, b) => a.name.localeCompare(b.name, 'de'),
    act: (a, b) => (activity(a).perDay ?? -1) - (activity(b).perDay ?? -1)
  }[FF.sort];
  list.sort(so);
  const t = today();
  const doneToday = S.friends.filter(f => f.last === t).length;
  main.innerHTML = `
    <div class="stat">
      <div class="card"><b>${S.friends.length}</b><span class="muted">Freunde</span></div>
      ${FL.slice(1).map((l, i) => `<div class="card"><b>${S.friends.filter(f => (f.level || 0) === i + 1).length}</b><span class="muted">${l}</span></div>`).join('')}
      <div class="card"><b>${doneToday}</b><span class="muted">heute interagiert</span></div>
      <div class="card"><b>${S.friends.filter(f => activity(f).cls === 'no').length}</b><span class="muted">inaktiv</span></div>
    </div>
    <div class="bar">
      <button class="b p" id="addF">+ Freund</button>
      <input id="fq" placeholder="Suchen…" value="${esc(FF.q)}" style="flex:1;min-width:160px">
      <select id="fs">${[['level', 'Freundschaftslevel'], ['next', 'Nächstes Level bald'], ['act', 'Inaktivste zuerst'], ['name', 'Name']].map(([v, l]) => `<option value="${v}" ${FF.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    </div>
    ${list.length ? `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${list.map(friendCard).join('')}</div>` : `<div class="empty">${S.friends.length ? 'Nichts gefunden.' : 'Noch keine Freunde eingetragen.'}</div>`}`;
  addF.onclick = () => editFriend();
  fq.oninput = e => { FF.q = e.target.value; renderFriends(); const n = document.getElementById('fq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  fs.onchange = e => { FF.sort = e.target.value; renderFriends(); };
  main.querySelectorAll('[data-act]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const f = S.friends.find(x => x.id === b.dataset.id);
    const a = b.dataset.act;
    if (a === 'edit') return editFriend(f);
    if (a === 'xp') return addSnap(f);
    if (a === 'card') return editCard(null, f.id);
    if (a === 'inter'){
      if (f.last === today()){ f.days = Math.max(0, (f.days || 0) - 1); f.last = f.prevLast || ''; }
      else { f.prevLast = f.last; f.days = (f.days || 0) + 1; f.last = today(); }
      f.level = Math.max(f.level || 0, levelFromDays(f.days)); save(); renderFriends();
    }
    if (a === 'gift'){ f.giftSent = f.giftSent === today() ? '' : today(); save(); renderFriends(); }
  });
}
function friendCard(f){
  const pr = friendProgress(f), ac = activity(f), t = today();
  const cards = S.postcards.filter(c => c.friendId === f.id);
  const pats = [...new Set(cards.map(c => c.viv).filter(Boolean))];
  const hearts = '♥'.repeat(f.level || 0) + '♡'.repeat(4 - (f.level || 0));
  const eta = pr.left ? new Date(Date.now() + (pr.left - (f.last === t ? 0 : 1)) * 864e5).toLocaleDateString('de-DE') : '';
  return `<div class="card fr">
    <div class="row"><h3 class="sp">${esc(f.name)} ${f.lucky ? '<span class="bd lu">Glücks-Freund</span>' : ''}</h3><button class="b s" data-act="edit" data-id="${f.id}">✎</button></div>
    <div class="muted" style="font-size:13px">${f.code ? esc(f.code) + ' · ' : ''}${esc(f.region || 'Herkunft unbekannt')}</div>
    <div class="row" style="margin-top:8px"><span class="hearts" style="color:#e2557a">${hearts}</span><b class="sp">${FL[f.level || 0]}</b><span class="muted" style="font-size:13px">${f.days || 0} Tage</span></div>
    <div class="prog"><i style="width:${pr.pct}%"></i></div>
    <div class="note">${pr.next ? `Noch <b>${pr.left}</b> Tag${pr.left === 1 ? '' : 'e'} bis <b>${pr.next}</b>${eta ? ` · frühestens ${eta}` : ''}` : 'Maximales Level erreicht 🎉'}</div>
    <div class="row" style="margin-top:10px">
      <span class="st ${ac.cls}">${ac.txt}</span><span class="note sp">${ac.detail}</span>
    </div>
    ${pats.length ? `<div class="note" style="margin-top:6px">Vivillon: ${pats.map(k => vivDot(k) + esc(VIVMAP[k]?.[1])).join(', ')}</div>` : ''}
    <div class="note" style="margin-top:4px">${cards.length} Postkarte${cards.length === 1 ? '' : 'n'}</div>
    <div class="row" style="margin-top:10px">
      <button class="b s ${f.last === t ? 'p' : ''}" data-act="inter" data-id="${f.id}">${f.last === t ? '✓ Heute interagiert' : 'Heute interagiert'}</button>
      <button class="b s ${f.giftSent === t ? 'p' : ''}" data-act="gift" data-id="${f.id}">🎁 ${f.giftSent === t ? 'Gesendet' : 'Geschenk'}</button>
      <button class="b s" data-act="xp" data-id="${f.id}">EP eintragen</button>
      <button class="b s" data-act="card" data-id="${f.id}">+ Postkarte</button>
    </div>
  </div>`;
}
function editFriend(f){
  const isNew = !f; f = f || { id: uid(), level: 0, days: 0, snaps: [], since: today() };
  const pr = friendProgress(f);
  const snaps = (f.snaps || []).slice().sort((a, b) => b.date.localeCompare(a.date));
  openDlg(isNew ? 'Freund hinzufügen' : esc(f.name), `
    <div class="fg">
      <label>Name / Trainername<input name="name" value="${esc(f.name)}" required></label>
      <label>Freundescode<input name="code" value="${esc(f.code)}" placeholder="1234 5678 9012"></label>
      <label>Herkunft (Land/Region)<input name="region" list="dlRegion" value="${esc(f.region)}"></label>
      <label>Freunde seit<input name="since" type="date" value="${f.since || ''}"></label>
    </div>
    <div class="sec">Freundschaft</div>
    <div class="fg">
      <label>Level<select name="level">${FL.map((l, i) => `<option value="${i}" ${(f.level || 0) === i ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label>Resttage laut Spiel<input name="left" type="number" min="0" max="89" value="${pr.next ? pr.left : ''}" placeholder="z. B. 23"></label>
      <label class="chk"><input type="checkbox" name="lucky" ${f.lucky ? 'checked' : ''}> Glücks-Freund</label>
    </div>
    <p class="note">Trag die Resttage ein, die das Spiel im Freundesprofil anzeigt – das Tool rechnet ab dann mit „Heute interagiert“ weiter.</p>
    <label class="fl">Notizen<textarea name="notes">${esc(f.notes)}</textarea></label>
    ${snaps.length ? `<div class="sec">EP-Verlauf</div><table><tr><th>Datum</th><th>Level</th><th>EP gesamt</th><th>Δ</th><th></th></tr>
      ${snaps.map((s, i) => { const prev = snaps[i + 1]; return `<tr><td>${fmtDate(s.date)}</td><td>${s.lvl ?? '–'}</td><td>${nf(s.xp)}</td><td>${prev && s.xp != null && prev.xp != null ? '+' + nf(s.xp - prev.xp) : ''}</td><td><button class="b s d" type="button" data-snap="${s.date}">✕</button></td></tr>`; }).join('')}</table>` : ''}`,
    isNew ? '' : `<button class="b d" value="del" formnovalidate style="margin-right:auto">Löschen</button>`,
    (fd, act) => {
      if (act === 'del'){ if (confirm(`${f.name} löschen? Postkarten bleiben erhalten.`)){ S.friends = S.friends.filter(x => x.id !== f.id); S.postcards.forEach(c => { if (c.friendId === f.id) c.friendId = ''; }); save(); render(); } return; }
      const lvl = +fd.get('level'), left = num(fd.get('left'));
      Object.assign(f, { name: fd.get('name').trim(), code: fd.get('code').trim(), region: fd.get('region').trim(), since: fd.get('since'), lucky: !!fd.get('lucky'), notes: fd.get('notes') });
      if (lvl !== (f.level || 0) || left != null){
        f.level = lvl;
        f.days = lvl >= 4 ? Math.max(f.days || 0, 90) : (left != null ? Math.max(FT[lvl], FT[lvl + 1] - left) : FT[lvl]);
      }
      if (isNew) S.friends.push(f); save(); render();
    });
  dlgB.querySelectorAll('[data-snap]').forEach(b => b.onclick = () => { f.snaps = f.snaps.filter(s => s.date !== b.dataset.snap); save(); b.closest('tr').remove(); render(); });
}
function addSnap(f){
  const last = (f.snaps || []).slice().sort((a, b) => b.date.localeCompare(a.date))[0];
  openDlg(`EP von ${esc(f.name)}`, `
    <div class="fg">
      <label>Datum<input name="date" type="date" value="${today()}" required></label>
      <label>Trainerlevel<input name="lvl" type="number" min="1" max="80" value="${last?.lvl ?? ''}"></label>
      <label>EP gesamt<input name="xp" type="number" min="0" required placeholder="${last ? nf(last.xp) : 'z. B. 12500000'}"></label>
    </div>
    <p class="note">Im Freundesprofil die Gesamt-EP ablesen. Ab zwei Einträgen zeigt das Tool, wie aktiv jemand ist (Vergleich über bis zu 30 Tage).</p>`, '',
    fd => {
      f.snaps ||= [];
      const s = { date: fd.get('date'), lvl: num(fd.get('lvl')), xp: num(fd.get('xp')) };
      f.snaps = f.snaps.filter(x => x.date !== s.date); f.snaps.push(s); save(); render();
    });
}

  if (CF.fr) list = list.filter(c => c.friendId === CF.fr);
  const fname = id => S.friends.find(f => f.id === id)?.name || '–';
  main.innerHTML = `
    <div class="bar">
      <button class="b p" id="addC">+ Postkarte</button>
      <input id="cq" placeholder="Ort/Region suchen…" value="${esc(CF.q)}" style="flex:1;min-width:160px">

      <select id="cf"><option value="">Alle Freunde</option>${S.friends.slice().sort((a, b) => a.name.localeCompare(b.name, 'de')).map(f => `<option value="${f.id}" ${CF.fr === f.id ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select>

      ${list.map(c => `<tr><td>${fmtDate(c.date)}</td><td>${esc(c.place)}</td><td>${esc(c.region)}</td><td>${c.viv ? vivDot(c.viv) + esc(VIVMAP[c.viv]?.[1]) : '<span class="muted">?</span>'}</td><td>${esc(fname(c.friendId))}</td><td>${c.pinned ? '📌' : ''}</td><td><button class="b s" data-c="${c.id}">✎</button></td></tr>`).join('')}
    </table></div>` : `<div class="empty">${S.postcards.length ? 'Nichts gefunden.' : 'Noch keine Postkarten eingetragen.'}</div>`}`;
  addC.onclick = () => editCard();
  cq.oninput = e => { CF.q = e.target.value; renderCards(); const n = document.getElementById('cq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  cv.onchange = e => { CF.viv = e.target.value; renderCards(); };
  cf.onchange = e => { CF.fr = e.target.value; renderCards(); };
  main.querySelectorAll('[data-c]').forEach(b => b.onclick = () => editCard(S.postcards.find(c => c.id === b.dataset.c)));
}
function editCard(c, friendId){
  const isNew = !c; c = c || { id: uid(), date: today(), friendId: friendId || '', pinned: true };
  const fr = S.friends.find(f => f.id === c.friendId);
  if (isNew && fr && fr.region) c.region = fr.region;
  openDlg(isNew ? 'Postkarte eintragen' : 'Postkarte bearbeiten', `
    <div class="fg">
      <label>Von Freund<select name="friendId"><option value="">–</option>${S.friends.slice().sort((a, b) => a.name.localeCompare(b.name, 'de')).map(f => `<option value="${f.id}" ${c.friendId === f.id ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select></label>
      <label>Erhalten am<input name="date" type="date" value="${c.date || ''}"></label>
      <label>PokéStop / Ort<input name="place" value="${esc(c.place)}"></label>
      <label>Land / Region<input name="region" list="dlRegion" value="${esc(c.region)}" placeholder="z. B. Portugal, Niedersachsen"></label>
      <label>Vivillon-Muster<select name="viv"><option value="">unbekannt</option>${VIV.slice(0, 18).map(v => `<option value="${v[0]}" ${c.viv === v[0] ? 'selected' : ''}>${v[1]}muster (${v[2]})</option>`).join('')}</select></label>
      <label class="chk"><input type="checkbox" name="pinned" ${c.pinned ? 'checked' : ''}> 📌 Angepinnt</label>
    </div>
    <p class="note" id="vivHint"></p>
    <label class="fl">Notizen<textarea name="notes">${esc(c.notes)}</textarea></label>`,
    isNew ? '' : `<button class="b d" value="del" formnovalidate style="margin-right:auto">Löschen</button>`,
    (fd, act) => {
      if (act === 'del'){ if (confirm('Postkarte löschen?')){ S.postcards = S.postcards.filter(x => x.id !== c.id); save(); render(); } return; }
      Object.assign(c, { friendId: fd.get('friendId'), date: fd.get('date'), place: fd.get('place').trim(), region: fd.get('region').trim(), viv: fd.get('viv'), pinned: !!fd.get('pinned'), notes: fd.get('notes') });
      if (c.region && c.viv) S.regionHints[c.region.toLowerCase()] = c.viv;
      const f = S.friends.find(x => x.id === c.friendId);
      if (f && !f.region && c.region) f.region = c.region;
      if (isNew) S.postcards.push(c); save(); render();
    });
  const f = dlgForm, hint = document.getElementById('vivHint');
  const upd = () => {
    const s = vivSuggest(f.region.value);
    if (!s.length){ hint.innerHTML = 'Das Muster siehst du im Spiel, wenn du auf die Vivillon-Medaille tippst (Weltkarte der Regionen).'; return; }
    if (s.length === 1 && !f.viv.value && S.regionHints[f.region.value.trim().toLowerCase()]) f.viv.value = s[0];
    hint.innerHTML = 'Mögliche Muster für diese Region: ' + s.map(k => `<button type="button" class="b s" data-v="${k}">${vivDot(k)}${VIVMAP[k][1]}</button>`).join(' ') + '<br>Innerhalb eines Landes können sich die Muster unterscheiden – im Zweifel die Vivillon-Medaille im Spiel prüfen.';
    hint.querySelectorAll('[data-v]').forEach(b => b.onclick = () => f.viv.value = b.dataset.v);
  };
  f.region.oninput = upd;
  f.friendId.onchange = () => { const fr = S.friends.find(x => x.id === f.friendId.value); if (fr?.region && !f.region.value){ f.region.value = fr.region; upd(); } };
  upd();
}

/* ---------- Vivillon ---------- */
function renderViv(){
  const pinned = S.postcards.filter(c => c.pinned && c.viv);
  const pats = VIV.slice(0, 18);
  const owned = k => S.pokemon.some(p => p.dex === 666 && p.viv === k);
  const wip = k => S.pokemon.some(p => (p.dex === 664 || p.dex === 665) && p.viv === k);
  const nOwned = pats.filter(v => owned(v[0])).length;
  main.innerHTML = `
    <div class="stat">
      <div class="card"><b>${nOwned} / 18</b><span class="muted">Muster als Vivillon</span></div>
      <div class="card"><b>${new Set(pinned.map(c => c.viv)).size} / 18</b><span class="muted">Regionen mit Postkarten</span></div>
      <div class="card"><b>${pinned.length}</b><span class="muted">angepinnte Karten mit Muster</span></div>
    </div>
    <p class="note">Purmel-Begegnung nach 3 angepinnten Postkarten einer Region, die nächste nach 9 weiteren, danach alle 15. Besitz wird aus deinen Pokémon (Purmel/Puponcho/Vivillon mit Muster) erkannt.</p>
    <div class="viv">${pats.map(v => {
      const n = pinned.filter(c => c.viv === v[0]).length;
      const [enc, nxt] = vivEncounters(n);
      const prev = enc === 0 ? 0 : enc === 1 ? 3 : 12 + 15 * (enc - 2);
      const pct = Math.min(100, (n - prev) / (nxt - prev) * 100);
      const friends = [...new Set(S.postcards.filter(c => c.viv === v[0]).map(c => S.friends.find(f => f.id === c.friendId)?.name).filter(Boolean))];
      return `<div class="card ${owned(v[0]) ? 'own' : ''}">
        <div class="row"><b class="sp">${vivDot(v[0])}${v[1]}</b>${owned(v[0]) ? '✅' : wip(v[0]) ? '🐛' : ''}</div>
        <div class="note">${v[2]}</div>
        <div class="prog"><i style="width:${pct}%;background:${v[3]}"></i></div>
        <div class="note">${n} Karte${n === 1 ? '' : 'n'} · ${enc} Begegnung${enc === 1 ? '' : 'en'}<br>Nächste bei ${nxt}</div>
        ${friends.length ? `<div class="note" style="margin-top:4px">Von: ${friends.map(esc).join(', ')}</div>` : ''}
      </div>`;
    }).join('')}</div>`;
}

/* ===================== Poke-Genie-Import ===================== */
function parseCSVText(text){
  text = text.replace(/^﻿/, '');
  const firstLine = text.slice(0, text.indexOf('\n') + 1 || undefined);
  const delim = (firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; continue; }
    if (c === '"') q = true;
    else if (c === delim){ row.push(cur); cur = ''; }
    else if (c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  const head = rows.shift().map(h => h.trim());
  return rows.filter(r => r.some(v => v.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()])));
}
// Spaltennamen der deutschen und englischen Poke-Genie-Exporte
const PG = {
  name: ['Name'], form: ['Form'], dex: ['Pokemon-Nummer', 'Pokemon Number'], gender: ['Geschlecht', 'Gender'],
  cp: ['WP', 'CP'], hp: ['KP', 'HP'], a: ['Angr. IV', 'Atk IV'], d: ['Ver. IV', 'Def IV'], h: ['Ausd. IV', 'Sta IV'],
  lmin: ['Min-Level', 'Level Min'], lmax: ['Max-Level', 'Level Max'],
  fast: ['Schnell-Angriff', 'Quick Move'], c1: ['Auflade-Angriff', 'Charge Move'], c2: ['Auflade-Angriff 2', 'Charge Move 2'],
  scan: ['Scandatum', 'Scan Date'], orig: ['Ursprüngliches Scan-Datum', 'Original Scan Date'], caught: ['Datum Gefangen', 'Catch Date'],
  weight: ['Gewicht', 'Weight'], height: ['Größe', 'Height'], lucky: ['Glücks', 'Lucky'], align: ['Crypto/Erlöstes', 'Shadow/Purified'],
  fav: ['Favorit', 'Favorite'],
};
const pgGet = (row, k) => { for (const c of PG[k]) if (c in row) return row[c]; return ''; };
function pgDate(v){
  if (!v) return '';
  let m = v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  m = v.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[0];
  m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  return '';
}
const pgNum = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
function pgRow(r){
  const dex = num(pgGet(r, 'dex'));
  const form = pgGet(r, 'form');
  const g = pgGet(r, 'gender');
  const al = pgGet(r, 'align');
  const lmin = pgNum(pgGet(r, 'lmin')), lmax = pgNum(pgGet(r, 'lmax'));
  const orig = pgGet(r, 'orig') || pgGet(r, 'scan');
  const ivA = num(pgGet(r, 'a')), ivD = num(pgGet(r, 'd')), ivH = num(pgGet(r, 'h'));
  return {
    pgKey: [orig, ivA, ivD, ivH, g].join('|'),
    name: (dex && DEX[dex]?.de) || pgGet(r, 'name'), dex,
    form: /^normal$/i.test(form) ? '' : form,
    gender: g === '♂' ? 'm' : g === '♀' ? 'f' : '',
    cp: num(pgGet(r, 'cp')), hp: num(pgGet(r, 'hp')), ivA, ivD, ivH,
    level: lmin != null && lmax != null && lmin !== lmax ? lmin : (lmin ?? lmax),
    fast: pgGet(r, 'fast'), c1: pgGet(r, 'c1'), c2: pgGet(r, 'c2'),
    caught: pgDate(pgGet(r, 'caught')),
    weight: pgNum(pgGet(r, 'weight')), height: pgNum(pgGet(r, 'height')),
    lucky: pgGet(r, 'lucky') === '1',
    align: al === '1' ? 'shadow' : al === '2' ? 'purified' : '',
    pgFav: pgGet(r, 'fav') === '1',
    added: orig ? orig.replace(' ', 'T') : new Date().toISOString(),
    src: 'pokegenie'
  };
}
function importPokeGenie(text, removeMissing){
  const rows = parseCSVText(text);
  if (!rows.length || !('Pokemon-Nummer' in rows[0] || 'Pokemon Number' in rows[0])) throw new Error('Das sieht nicht nach einem Poke-Genie-Export aus.');
  const pool = {};
  S.pokemon.forEach(p => { if (p.pgKey) (pool[p.pgKey] ||= []).push(p); });
  const seen = new Set(); let added = 0, updated = 0, removed = 0;
  // Werte aus Poke Genie werden überschrieben, eigene Felder (Shiny, Kostüm, Hintergrund, Größe, Notizen …) bleiben
  for (const r of rows){
    const n = pgRow(r);
    const cands = (pool[n.pgKey] || []).filter(p => !seen.has(p.id));
    let m = null;
    if (cands.length) m = cands.sort((a, b) => ((a.dex === n.dex ? 0 : 1) - (b.dex === n.dex ? 0 : 1)) || Math.abs((a.cp || 0) - n.cp) - Math.abs((b.cp || 0) - n.cp))[0];
    if (m){
      const { added: _a, pgFav, ...upd } = n;
      if (!m.caught && !upd.caught) delete upd.caught;
      Object.assign(m, upd); seen.add(m.id); updated++;
    } else {
      const { pgFav, ...rest } = n;
      const p = { id: uid(), ...rest, fav: pgFav };
      S.pokemon.push(p); seen.add(p.id); added++;
    }
  }
  if (removeMissing){
    const before = S.pokemon.length;
    S.pokemon = S.pokemon.filter(p => p.src !== 'pokegenie' || seen.has(p.id));
    removed = before - S.pokemon.length;
  }
  return { total: rows.length, added, updated, removed };
}
function openPgImport(){
  openDlg('Poke-Genie-Export importieren', `
    <p>In Poke Genie: <b>Einstellungen → Exportieren</b> (CSV) und die Datei hier auswählen.</p>
    <label class="fl">CSV-Datei<input type="file" name="file" accept=".csv,text/csv" required></label>
    <label class="chk" style="margin-top:12px"><input type="checkbox" name="rm"> Importierte Pokémon entfernen, die nicht mehr im Export sind (z. B. verschickt oder getauscht)</label>
    <p class="note">Bei einem erneuten Import werden bereits importierte Pokémon wiedererkannt und aktualisiert (WP, Level, Attacken, Entwicklung …). Was du selbst einträgst – Shiny, Kostüm, Hintergrund, Größenklasse, Vivillon-Muster, Spitzname, Tags, Notizen – bleibt erhalten, denn das exportiert Poke Genie nicht.</p>
    <p class="note">Tipp: Vorher unter „Daten“ eine Sicherung exportieren.</p>`, '',
    async fd => {
      const f = fd.get('file'); if (!f || !f.size) return;
      try{
        const res = importPokeGenie(await f.text(), !!fd.get('rm'));
        const ok = await save();
        render();
        if (!ok) return alert('Import eingelesen, aber Speichern fehlgeschlagen – siehe roter Hinweis oben.');
        alert(`${res.total} Pokémon gelesen:\n• ${res.added} neu\n• ${res.updated} aktualisiert${res.removed ? `\n• ${res.removed} entfernt` : ''}`);
      }catch(err){ alert('Import fehlgeschlagen: ' + err.message); }
    });
}
