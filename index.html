<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GO Organizer</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2563eb">
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#1c2233; --muted:#6b7389; --line:#e2e6ef;
  --acc:#2f6fed; --acc2:#e8f0ff; --good:#1e9e5a; --warn:#d98a00; --bad:#d64545;
  --gold:#e0a800; --shadow:0 1px 3px rgba(20,30,60,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141c; --card:#1a1f2b; --ink:#e7eaf2; --muted:#98a0b5; --line:#2b3242;
    --acc:#6b9bff; --acc2:#22304d; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#11141c; --card:#1a1f2b; --ink:#e7eaf2; --muted:#98a0b5; --line:#2b3242;
  --acc:#6b9bff; --acc2:#22304d; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;max-width:1200px;margin:0 auto;padding:10px 16px}
.top h1{font-size:18px;margin:0;flex:1}
nav{display:flex;gap:4px;max-width:1200px;margin:0 auto;padding:0 16px;overflow-x:auto}
nav button{border:0;background:none;color:var(--muted);padding:10px 14px;font:inherit;font-weight:600;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--acc);border-color:var(--acc)}
main{max-width:1200px;margin:0 auto;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:60px}
button.b{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button.b:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.s{padding:4px 8px;font-size:13px}
button.d{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.mon{cursor:pointer;position:relative}
.mon img{width:96px;height:96px;object-fit:contain;display:block;margin:0 auto}
.pic{position:relative;width:112px;height:112px;margin:0 auto;border-radius:12px;overflow:hidden;flex:none}
.pic img.picbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;margin:0}
.pic img.picmon{position:relative;width:100%;height:100%;object-fit:contain;margin:0}
.pic.hasbg img.picmon{padding:6px;box-sizing:border-box}
.pic.dmx img.picmon{padding:5px;box-sizing:border-box;filter:drop-shadow(0 0 2px rgba(255,31,107,.95)) drop-shadow(0 0 5px rgba(255,31,107,.55))}
.picker{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:8px;max-height:340px;overflow:auto}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:6px}
.pitem{border:2px solid transparent;border-radius:9px;padding:2px;cursor:pointer;background:none;font:inherit;font-size:11px;color:inherit;text-align:center;line-height:1.25}
.pitem.on{border-color:var(--acc);background:var(--acc2)}
.pitem img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;display:block;margin:0 0 3px;background:var(--line)}
.pitem.pcos img{object-fit:contain;background:var(--acc2)}
.pitem .none{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:7px;background:var(--line);margin-bottom:3px;font-size:20px}
.mon .nm{font-weight:700;text-align:center}
.mon .sub{color:var(--muted);font-size:13px;text-align:center;min-height:18px}
.badges{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}
.bd{font-size:11px;font-weight:700;padding:2px 6px;border-radius:99px;background:var(--acc2);color:var(--acc)}
.bd.sh{background:#fff3c4;color:#8a6500}.bd.cr{background:#ece3ff;color:#5b2fb5}.bd.lu{background:#fff0c2;color:#9a6c00}
.bd.er{background:#e2f6ff;color:#0b6c91}.bd.dy{background:#ffe2ea;color:#b0244b}
.bd.bg{background:#e3f7e9;color:#1b7a43}.bd.fm{background:#e6ecff;color:#2f4fb3}.bd.mv{background:#fde4cf;color:#a3470d}.bd.sz{background:#f0e6da;color:#7a4b1b}
.ivrow{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;color:var(--muted)}
.ivp{font-weight:800;color:var(--ink)}
.stars{color:var(--gold);letter-spacing:1px}
.fav{position:absolute;top:8px;right:10px;color:var(--gold)}
.muted{color:var(--muted)}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}
.prog>i{display:block;height:100%;background:var(--acc)}
.fr h3{margin:0;font-size:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.hearts{font-size:15px;letter-spacing:2px}
.st{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.st.ok{background:#dcf5e7;color:#16774a}.st.lo{background:#fff1d6;color:#8a5a00}.st.no{background:#ffe0e0;color:#a52a2a}.st.uk{background:var(--line);color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
dialog{border:0;border-radius:14px;padding:0;background:var(--card);color:var(--ink);width:min(680px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(10,15,30,.5)}
.dh{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:17px;flex:1}
.db{padding:16px;overflow:auto;max-height:calc(92vh - 120px)}
.df{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fg label,.fl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.fg label input,.fg label select{color:var(--ink);font-weight:400;font-size:15px}
.chk{flex-direction:row!important;align-items:center;gap:6px!important;font-size:14px!important;color:var(--ink)!important}
.sec{margin:16px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.viv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.viv .card{padding:10px}
.viv .own{border-color:var(--good)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px;border:1px solid rgba(0,0,0,.15)}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat .card{padding:10px 14px;min-width:120px}
.stat b{font-size:20px;display:block}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.note{font-size:13px;color:var(--muted)}
@media (max-width:520px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.mon img{width:72px;height:72px}.mon .pic{width:88px;height:88px}.mon .pic img{width:100%;height:100%}}

/* Schwebender Hinzufügen-Knopf (rechts unten, links unten liegt das ☁︎-Feld des Syncs) */
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));z-index:15;width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:30px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(20,40,120,.35);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:hover{transform:scale(1.07)}
.fab[hidden]{display:none}
main{padding-bottom:90px}

/* Home-Bildschirm-App am iPhone: nicht unter Statusleiste/Notch zeichnen */
header{padding-top:env(safe-area-inset-top)}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
</style>

<!-- GitHub-Sync (gemeinsam für alle Tools, Einstellungen auf der Startseite) -->
<script src="/startseite/sync-v1.js"></script>
<script>
/* ===================== Daten & Speicher (IndexedDB) ===================== */
// Daten liegen in IndexedDB "pokemon-go-tool" (Store "kv", Eintrag "state").
// localStorage enthält nur noch das Theme ("go-organizer-theme").
const LEGACY_KEY = 'go-organizer-v1';
const DB_NAME = 'pokemon-go-tool', DB_STORE = 'kv', DB_REC = 'state';
const blank = () => ({ pokemon: [], friends: [], postcards: [], regionHints: {}, version: 1 });
let S = blank();
let SYNC = null;              // GitHub-Sync, siehe initSync()
let STORE_MODE = 'idb';      // 'idb' | 'readonly' (IndexedDB fehlt: nur lesen/exportieren) | 'locked'
let PERSISTED = null;
let db = null;

function idbOpen(){
  return new Promise((res, rej) => {
    if (!('indexedDB' in window)) return rej(new Error('IndexedDB nicht verfügbar'));
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('Datenbank blockiert – bitte andere Tabs dieses Tools schließen'));
  });
}
function idbGet(){
  return new Promise((res, rej) => {
    const t = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(DB_REC);
    t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error);
  });
}
function idbPut(val){
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(val, DB_REC);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('Schreibvorgang abgebrochen'));
  });
}
const plain = o => JSON.parse(JSON.stringify(o));

/* Sichtbarer Hinweis bei Speicherproblemen */
function storeBanner(msg){
  let el = document.getElementById('storeErr');
  if (!msg){ if (el) el.remove(); return; }
  if (!el){
    el = document.createElement('div'); el.id = 'storeErr';
    el.style.cssText = 'background:#d64545;color:#fff;padding:10px 16px;font-weight:600;position:sticky;top:0;z-index:20';
    document.body.prepend(el);
  }
  el.innerHTML = `⚠️ ${esc(msg)} <button class="b s" id="storeErrExp" style="margin-left:8px">Jetzt als JSON sichern</button>`;
  document.getElementById('storeErrExp').onclick = () => exportJSON();
}

let saveChain = Promise.resolve(), pending = 0;
function save(){
  if (STORE_MODE === 'locked'){ storeBanner('Gespeicherte Daten konnten nicht gelesen werden – Speichern ist gesperrt, damit nichts überschrieben wird. Seite neu laden oder Sicherung importieren.'); return Promise.resolve(false); }
  // Ohne IndexedDB wird bewusst NICHT in den gemeinsamen localStorage ausgewichen (zu groß, würde andere Tools blockieren)
  if (STORE_MODE !== 'idb'){ storeBanner('IndexedDB ist in diesem Browser nicht verfügbar – Änderungen können nicht gespeichert werden. Bitte als JSON sichern.'); return Promise.resolve(false); }
  const snap = plain(S); pending++;
  saveChain = saveChain.then(async () => {
    try{
      await idbPut(snap);
      storeBanner(''); if (SYNC) SYNC.changed(); return true;
    }catch(e){
      const quota = e && (e.name === 'QuotaExceededError' || /quota/i.test(e.message || ''));
      storeBanner(`Speichern fehlgeschlagen${quota ? ' – Speicherplatz voll' : ''} (${e?.message || e}). Letzte Änderungen sind NICHT gesichert.`);
      return false;
    }finally{ pending--; }
  });
  return saveChain;
}
window.addEventListener('beforeunload', e => { if (pending > 0 || document.getElementById('storeErr')){ e.preventDefault(); e.returnValue = ''; } });

async function initStore(){
  try{
    db = await idbOpen();
    let data = await idbGet();
    if (data == null){
      // Erster Start mit IndexedDB: Daten aus localStorage übernehmen
      let raw = null; try{ raw = localStorage.getItem(LEGACY_KEY); }catch(e){}
      if (raw){
        let old;
        try{ old = JSON.parse(raw); }catch(e){
          STORE_MODE = 'locked';
          storeBanner('Alte Daten im localStorage sind beschädigt und wurden nicht übernommen (sie bleiben unangetastet). Bitte eine JSON-Sicherung importieren.');
          return;
        }
        await idbPut(old);
        const check = await idbGet();
        const ok = check && JSON.stringify(check) === JSON.stringify(old);
        if (!ok) throw new Error('Übernahme konnte nicht bestätigt werden');
        try{ localStorage.removeItem(LEGACY_KEY); }catch(e){}
        data = check;
        console.info('GO Organizer: Daten aus localStorage nach IndexedDB übernommen');
      }
    } else {
      // Daten sind bereits in IndexedDB – ein evtl. übrig gebliebener alter Schlüssel ist überflüssig
      try{ localStorage.removeItem(LEGACY_KEY); }catch(e){}
    }
    S = Object.assign(blank(), data || {});
  }catch(e){
    // IndexedDB fehlt: alte Daten aus dem localStorage nur anzeigen (zum Exportieren), nichts schreiben, nichts löschen
    console.warn(e);
    STORE_MODE = 'readonly';
    try{ const raw = localStorage.getItem(LEGACY_KEY); S = Object.assign(blank(), raw ? JSON.parse(raw) : {}); }
    catch(err){ STORE_MODE = 'locked'; S = blank(); storeBanner('Gespeicherte Daten konnten nicht gelesen werden. Speichern ist gesperrt, damit nichts überschrieben wird.'); return; }
    storeBanner(`IndexedDB nicht verfügbar (${e.message}) – nur Ansicht und JSON-Export möglich, Änderungen werden nicht gespeichert.`);
    return;
  }
  try{ for (const k of ['go-organizer-dex', 'go-organizer-dex-v2']) localStorage.removeItem(k); }catch(e){}
  if (S.pokemon.some(p => 'pvp' in p)){ S.pokemon.forEach(p => delete p.pvp); save(); }
  if (migrateFriends() | migrateXpDigits()) save();
  try{ if (navigator.storage?.persist) PERSISTED = (await navigator.storage.persisted()) || (await navigator.storage.persist()); }catch(e){}
}
function exportJSON(suffix){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
  a.download = `go-organizer-${today()}${typeof suffix === 'string' ? '-' + suffix : ''}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const fmtDate = d => d ? new Date(d + 'T12:00').toLocaleDateString('de-DE') : '–';
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
const nf = n => n == null ? '–' : n.toLocaleString('de-DE');

/* ===================== Pokédex (Namen fest eingebaut) ===================== */
let DEX = {};          // id -> {de, en}
let NAME2ID = {};      // lower name -> id

  const de = DEX_DE.split('|'), en = DEX_EN.split('|'), d = {};
  de.forEach((n, i) => d[i + 1] = { de: n, en: en[i] });

function setDex(d){
  DEX = d; NAME2ID = {};
  const opts = [];
  for (const id of Object.keys(d).map(Number).sort((a,b)=>a-b)){
    const n = d[id]; const de = n.de || n.en;
    if (n.de) NAME2ID[n.de.toLowerCase()] = id;
    if (n.en) NAME2ID[n.en.toLowerCase()] ||= id;
    opts.push(`<option value="${esc(de)}">#${id} ${esc(de)}</option>`);
  }
  document.getElementById('dlSpecies').innerHTML = opts.join('');
  // bereits gespeicherte Pokémon auf deutsche Namen umstellen
  let changed = false;
  for (const p of S.pokemon){
    const id = p.dex || NAME2ID[(p.name || '').toLowerCase()];
    const de = id && DEX[id]?.de;
    if (de && p.name !== de){ p.name = de; p.dex = id; changed = true; }
  }
  if (changed){ save(); render(); }
}

  'schweiz':['meadow'], 'frankreich':['meadow'], 'portugal':['marine'], 'spanien':['marine','sun'],
  'italien':['marine','meadow'], 'großbritannien':['meadow','marine'], 'vereinigtes königreich':['meadow','marine'],
  'japan':['elegant','garden','continental','tundra'], 'hawaii':['ocean'], 'australien':['river','garden'],
  'neuseeland':['garden'], 'brasilien':['savanna','jungle'], 'indien':['monsoon','sandstorm'],
  'ägypten':['sandstorm'], 'saudi-arabien':['sandstorm'], 'mexiko':['sun','highplains'],
  'usa':['modern','highplains','polar','icysnow','archipelago','ocean'], 'kanada':['polar','icysnow','tundra'],
  'karibik':['archipelago'], 'kuba':['archipelago'], 'jamaika':['archipelago'], 'puerto rico':['archipelago'],
  'indonesien':['jungle'], 'malaysia':['jungle'], 'thailand':['monsoon','jungle'], 'russland':['tundra','continental','polar'],
  'chile':['ocean','marine'], 'argentinien':['marine','savanna']
};
const FLAG_COUNTRY = { '🇩🇪': 'deutschland', '🇦🇹': 'österreich', '🇨🇭': 'schweiz', '🇫🇷': 'frankreich', '🇵🇹': 'portugal', '🇪🇸': 'spanien', '🇮🇹': 'italien', '🇬🇧': 'großbritannien', '🇯🇵': 'japan', '🇦🇺': 'australien', '🇳🇿': 'neuseeland', '🇧🇷': 'brasilien', '🇮🇳': 'indien', '🇲🇽': 'mexiko', '🇺🇸': 'usa', '🇨🇦': 'kanada', '🇮🇩': 'indonesien', '🇦🇷': 'argentinien' };
function vivSuggest(region){
  let r = (region || '').trim().toLowerCase(); if (!r) return [];
  const flag = Object.keys(FLAG_COUNTRY).find(k => r.startsWith(k));
  r = r.replace(/^(?:[\u{1F1E6}-\u{1F1FF}]{2}|\u{1F3F4}[\u{E0061}-\u{E007A}]+\u{E007F})\s*/u, '').trim();
  if (!r && flag) r = FLAG_COUNTRY[flag];
  if (!r) return [];
  if (flag && !S.regionHints[r] && !VIV_HINTS[r] && VIV_HINTS[FLAG_COUNTRY[flag]] && !Object.keys(S.regionHints).some(k => r.includes(k) || k.includes(r))) return VIV_HINTS[FLAG_COUNTRY[flag]];
  if (S.regionHints[r]) return [S.regionHints[r]];
  if (VIV_HINTS[r]) return VIV_HINTS[r];
  for (const k of Object.keys(S.regionHints)) if (r.includes(k) || k.includes(r)) return [S.regionHints[k]];
  for (const k of Object.keys(VIV_HINTS)) if (r.includes(k)) return VIV_HINTS[k];
  return [];
}
// Purmel-Begegnungen: 3 Karten → 1., +9 → 2., danach je +15
function vivEncounters(n){ if (n < 3) return [0, 3]; if (n < 12) return [1, 12]; const k = Math.floor((n - 12) / 15); return [2 + k, 12 + 15 * (k + 1)]; }

/* ===================== Freundschaft ===================== */
// Level 0–5. FT = Tage/Punkte ab Freundschaftsbeginn, ab denen das Level erreicht ist.
// Bester Freund → Allerbester Freund: 90 Freundschaftspunkte (1/Tag + Bonus aus Wochenaufgaben).
const FL = ['Freund', 'Guter Freund', 'Superfreund', 'Hyperfreund', 'Bester Freund', 'Allerbester Freund'];
const FT = [0, 1, 7, 30, 90, 180];
const MAXLVL = FL.length - 1;
const spanOf = lvl => lvl >= MAXLVL ? null : FT[lvl + 1] - FT[lvl];
const unitOf = (lvl, n) => lvl === 4 ? (n === 1 ? 'Punkt' : 'Punkte') : (n === 1 ? 'Tag' : 'Tage');
// Tage bis zur nächsten Prüfung, gestaffelt nach Status: Inaktiv? 7 · Ruhig 14 · Aktiv 30 · Unklar 14 · Nicht bewertbar 30
const CHECK_AFTER = { no: 7, lo: 14, ok: 30, uk: 14, na: 30 };
const addDays = (d, n) => { const x = new Date(d + 'T12:00'); x.setDate(x.getDate() + n); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const withDue = (a, c) => { a.nextCheck = addDays(c, CHECK_AFTER[a.key || a.cls]); a.due = a.nextCheck <= today(); return a; };
// EP werden nur mit den letzten 4 Ziffern notiert und verglichen (volle Zahlen werden gekürzt)
const XP_DIGITS = 4, XP_MOD = 10 ** XP_DIGITS;
const xpS = v => (v == null || v === '' || isNaN(+v)) ? null : Math.abs(Math.round(+v)) % XP_MOD;
const xpFmt = v => xpS(v) == null ? '–' : '…' + String(xpS(v)).padStart(XP_DIGITS, '0');
// Einmalige Korrektur: Prüfungen ab dem 30.10.2026, bei denen volle EP eingetragen wurden, auf 4 Ziffern kürzen
// und die EP-Änderung neu bewerten (Vergleich nur über die letzten 4 Ziffern).
function migrateXpDigits(){
  if (S.xpDigits === XP_DIGITS) return false;
  const FROM = '2026-10-30';
  for (const f of S.friends){
    for (const sn of f.snaps || []) if (sn.date >= FROM && sn.xp != null) sn.xp = xpS(sn.xp);
    if ((f.lastCheck || '') >= FROM){
      if (f.xp != null) f.xp = xpS(f.xp);
      if (f.chk && f.chk.xp != null) f.chk.xp = xpS(f.chk.xp);
      const sn = (f.snaps || []).slice().sort((a, b) => a.date.localeCompare(b.date));
      const cur = sn.find(x => x.date === f.lastCheck);
      const prev = sn.filter(x => x.date < f.lastCheck).pop();
      if (cur && prev && cur.xp != null && prev.xp != null){
        const changed = xpS(cur.xp) !== xpS(prev.xp) || (cur.lvl != null && prev.lvl != null && cur.lvl > prev.lvl);
        if (changed) f.xpChanged = f.lastCheck;
        else if (f.xpChanged === f.lastCheck) f.xpChanged = prev.date;   // spätestens seit der Vorprüfung unverändert
      }
    }
    if (f.chk) delete f.chk.xpComparable;
  }
  S.xpDigits = XP_DIGITS;
  return true;
}

function friendProgress(f){
  const lvl = f.level || 0;
  const span = spanOf(lvl);
  if (span == null) return { pct: 100, left: null, next: null };
  const left = Math.max(0, Math.min(span, f.left ?? span));
  return { pct: (span - left) / span * 100, left, next: FL[lvl + 1], unit: unitOf(lvl, left) };
}
// Prüfstatus: wie lange hatte sich zum Zeitpunkt der letzten Prüfung nichts mehr geändert?
function activity(f){
  const c = f.lastCheck;
  if (!c) return { cls: 'uk', txt: 'Nie geprüft', detail: '', due: true, nextCheck: '', checkAge: null, stale: null };
  const checkAge = daysBetween(c, today());
  const lv80 = (f.trainerLvl || 0) >= 80;
  // Lv 80: EP ändern sich nicht mehr; Allerbester Freund: kein weiteres Level. Beides zusammen = nicht messbar.
  if (lv80 && (f.level || 0) >= MAXLVL) return withDue({ cls: 'uk', key: 'na', txt: 'Nicht bewertbar', detail: 'Lv 80 und Allerbester Freund – über EP und Freundschaft nicht messbar', checkAge, stale: null }, c);
  // Bei Lv 80 zählt nur die Freundschaft
  const lastChange = (lv80 ? [f.friendChanged] : [f.xpChanged, f.friendChanged]).filter(Boolean).sort().pop();
  const stale = lastChange ? Math.max(0, daysBetween(lastChange, c)) : null;
  let cls = 'uk', txt = 'Unklar';
  if (stale != null){
    if (stale < 7){ cls = 'ok'; txt = 'Aktiv'; }
    else if (stale < 21){ cls = 'lo'; txt = 'Ruhig'; }
    else { cls = 'no'; txt = 'Inaktiv?'; }
  }
  const detail = stale == null ? '' : stale === 0 ? 'Änderung am Prüftag' : `${stale} T ohne Änderung bis zur Prüfung`;
  return withDue({ cls, txt, detail, checkAge, stale }, c);
}
// Alte Freunde (Version mit f.days) auf Resttage umstellen
function migrateFriends(){
  let ch = false;
  for (const f of S.friends){
    if (f.left === undefined && f.days !== undefined){
      const lvl = Math.min(f.level || 0, MAXLVL);
      f.left = spanOf(lvl) == null ? null : Math.max(0, FT[lvl + 1] - (f.days || 0));
      f.leftDate = f.last || today();
      delete f.days; ch = true;
    }
    // Reste der entfernten Knöpfe „Heute interagiert“ und „Geschenk“
    for (const k of ['prevState', 'prevLast', 'last', 'giftSent']) if (k in f){ delete f[k]; ch = true; }
  }
  return ch;
}

const ivPct = p => (p.ivA == null || p.ivD == null || p.ivH == null) ? null : Math.round((p.ivA + p.ivD + p.ivH) / 45 * 100);
function ivStars(p){
  const s = (p.ivA ?? -1) + (p.ivD ?? -1) + (p.ivH ?? -1);
  if (s < 0 || p.ivA == null) return '';
  const n = s === 45 ? 4 : s >= 37 ? 3 : s >= 30 ? 2 : s >= 23 ? 1 : 0;
  return n === 4 ? '<span class="stars" title="Perfekt">★★★ 100</span>' : `<span class="stars">${'★'.repeat(n)}${'☆'.repeat(3 - n)}</span>`;
}

// Suchstring: Begriffe mit & , ; | = ODER; innerhalb eines Begriffs mit + = UND; "…" = genauer Name
function parseSearch(q){
  return String(q || '').split(/[&,;|]/).map(part => part.split('+').map(w => {
    w = w.trim().toLowerCase(); if (!w) return null;
    const m = w.match(/^["„“”'](.*)["„“”']$/);
    return m ? { v: m[1].trim(), exact: true } : { v: w, exact: false };
  }).filter(w => w && w.v)).filter(t => t.length);
}

  if (p.align === 'purified') b.push('<span class="bd er">Erlöst</span>');

  if (p.dyna) b.push(`<span class="bd dy">${p.dyna === 'giga' ? 'Gigadynamax' : 'Dynamax'}</span>`);

  if (p.form && !/^normal$/i.test(p.form)) b.unshift(`<span class="bd fm" title="${esc(ft ? ft[0] : p.form)}">◆ ${esc(p.form)}</span>`);
  return `<div class="card mon" data-id="${p.id}">

}

      <label>Gewicht (kg)<input name="weight" type="number" step="0.01" min="0" value="${p.weight ?? ''}"></label>
      <label>Ort<input name="location" value="${esc(p.location)}"></label>
      <label>Tags<input name="tags" value="${esc(p.tags)}" placeholder="Raid, Tausch, Behalten…"></label>
    </div>
    <label class="fl" style="margin-top:10px">Notizen<textarea name="notes">${esc(p.notes)}</textarea></label>
    ${p.pgMissing ? `<label class="chk" style="margin-top:10px;color:var(--bad)"><input type="checkbox" name="pgMissing" checked> ⚠ Seit ${fmtDate(p.pgMissing)} nicht mehr im Poke-Genie-Export – Haken entfernen, wenn es das Pokémon noch gibt, sonst unten löschen</label>` : ''}`,
    isNew ? '' : `<button class="b d" value="del" formnovalidate style="margin-right:auto">Löschen</button>`,
    (fd, act) => {
      if (act === 'del'){ if (confirm('Pokémon löschen?')){ S.pokemon = S.pokemon.filter(x => x.id !== p.id); save(); render(); } return; }
      Object.assign(p, {
        name: (DEX[num(fd.get('dex'))]?.de) || fd.get('name').trim(), dex: num(fd.get('dex')), nick: fd.get('nick').trim(),
        cp: num(fd.get('cp')), hp: num(fd.get('hp')), level: num(fd.get('level')),
        ivA: num(fd.get('ivA')), ivD: num(fd.get('ivD')), ivH: num(fd.get('ivH')),
        fast: fd.get('fast').trim(), c1: fd.get('c1').trim(), c2: fd.get('c2').trim(),
        costume: fd.get('costume').trim(), form: fd.get('form').trim(), gender: fd.get('gender'),
        ...(() => {   // Mit Bild ergibt sich die Art aus dem Dateinamen (sb_ = Spezial, lc_ = Ort)
          const k = BGS.includes(fd.get('bgKey')) ? fd.get('bgKey') : '';
          const bg = k ? (k.startsWith('sb_') ? 'special' : 'location') : (fd.get('bg') || '');
          return { bg, bgKey: k, bgName: bg ? fd.get('bgName').trim() : '' };
        })(),
        align: fd.get('align'), dyna: fd.get('dyna'), size: fd.get('size'),
        costumeKey: (COSTUMES[num(fd.get('dex'))] || []).some(x => x[0] === fd.get('costumeKey')) ? fd.get('costumeKey') : '', viv: [664, 665, 666].includes(num(fd.get('dex'))) ? fd.get('viv') : '',
        shiny: !!fd.get('shiny'), specialMove: !!fd.get('specialMove'), lucky: !!fd.get('lucky'), fav: !!fd.get('fav'),
        caught: fd.get('caught'), height: num(fd.get('height')), weight: num(fd.get('weight')), location: fd.get('location').trim(), tags: fd.get('tags').trim(), notes: fd.get('notes')
      });
      if (p.pgMissing && !fd.get('pgMissing')) delete p.pgMissing;
      if (isNew) S.pokemon.push(p); save(); render();
    });
  const f = dlgForm, pvWrap = document.getElementById('pvWrap');
  const cosPick = document.getElementById('cosPick'), bgPick = document.getElementById('bgPick'), bgList = document.getElementById('bgList');
  const renderCos = () => {
    const id = num(f.dex.value), list = COSTUMES[id] || [], cur = f.costumeKey.value;
    cosPick.innerHTML = list.length
      ? `<div class="pgrid"><button type="button" class="pitem ${cur ? '' : 'on'}" data-cos=""><div class="none">✕</div>Kein Bild</button>${list.map(([v]) => `<button type="button" class="pitem pcos ${cur === v ? 'on' : ''}" data-cos="${v}"><img loading="lazy" src="${costumeUrl(id, v, f.shiny.checked, f.gender.value === 'f')}" alt="">${esc(costumeLabel(v))}</button>`).join('')}</div>`
      : '<p class="note" style="margin:4px">Für dieses Pokémon gibt es keine Kostüm-Bilder – das Kostüm erscheint weiter als Tag.</p>';
    cosPick.querySelectorAll('[data-cos]').forEach(b => b.onclick = () => {
      const old = f.costumeKey.value; f.costumeKey.value = b.dataset.cos;
      if (b.dataset.cos && (!f.costume.value.trim() || (old && f.costume.value === costumeLabel(old)))) f.costume.value = costumeLabel(b.dataset.cos);
      renderCos(); upd();
    });
  };
  const renderBg = () => {
    const q = document.getElementById('bgQ').value.trim().toLowerCase(), t = document.getElementById('bgT').value, cur = f.bgKey.value;
    const list = BGS_SORTED.filter(k => (!t || k.startsWith(t)) && (!q || q.split(/\s+/).every(w => (bgLabel(k) + ' ' + k).toLowerCase().includes(w))));
    bgList.innerHTML = `<button type="button" class="pitem ${cur ? '' : 'on'}" data-bgk=""><div class="none">✕</div>Kein Bild</button>` + list.map(k => `<button type="button" class="pitem ${cur === k ? 'on' : ''}" data-bgk="${k}" title="${esc(bgLabel(k))}"><img loading="lazy" src="${bgUrl(k)}" alt="">${k.startsWith('sb_') ? '★ ' : ''}${esc(bgLabel(k))}</button>`).join('');
    bgList.querySelectorAll('[data-bgk]').forEach(b => b.onclick = () => {
      const k = b.dataset.bgk, old = f.bgKey.value; f.bgKey.value = k;
      f.bg.disabled = !!k;
      if (k){
        f.bg.value = k.startsWith('sb_') ? 'special' : 'location';
        if (!f.bgName.value.trim() || (old && f.bgName.value === bgLabel(old))) f.bgName.value = bgLabel(k);
      }
      renderBg(); upd();
    });
  };
  document.getElementById('cosBtn').onclick = () => { cosPick.hidden = !cosPick.hidden; if (!cosPick.hidden) renderCos(); };
  document.getElementById('bgBtn').onclick = () => { bgPick.hidden = !bgPick.hidden; if (!bgPick.hidden) renderBg(); };
  document.getElementById('bgQ').oninput = renderBg; document.getElementById('bgT').onchange = renderBg;
  f.bg.addEventListener('change', () => { if (!f.bg.value){ f.bgKey.value = ''; if (!bgPick.hidden) renderBg(); } upd(); });
  f.dyna.addEventListener('change', () => upd()); f.gender.addEventListener('change', () => { if (!cosPick.hidden) renderCos(); upd(); });
  const upd = () => {
    const id = num(f.dex.value);
    if (f.costumeKey.value && !(COSTUMES[id] || []).some(x => x[0] === f.costumeKey.value)) f.costumeKey.value = '';
    const q = { dex: id, form: f.form.value, viv: id === 666 ? f.viv.value : '', shiny: f.shiny.checked, gender: f.gender.value, dyna: f.dyna.value, costumeKey: f.costumeKey.value, bgKey: f.bgKey.value };
    pvWrap.innerHTML = monPic(q);
    document.getElementById('cosCur').textContent = f.costumeKey.value ? '✓ ' + costumeLabel(f.costumeKey.value) : (COSTUMES[id] || []).length ? `${COSTUMES[id].length} verfügbar` : '';
    document.getElementById('bgCur').textContent = q.bgKey ? '✓ ' + bgLabel(q.bgKey) : '';
    if (!cosPick.hidden) renderCos();
    document.getElementById('vivWrap').style.display = [664, 665, 666].includes(id) ? '' : 'none';
    document.getElementById('dlForms').innerHTML = (FORMDATA[id] || []).filter(t => t[0]).map(t => `<option value="${esc(t[0])}">`).join('');
    const ft = findForm(id, q.form);
    document.getElementById('formHint').textContent = !q.form || /^normal$/i.test(q.form) ? '' : ft ? `✓ Bild: ${ft[0] || ft[1]}` : 'Kein eigenes Bild – wird als Tag angezeigt';
  };
  f.form.oninput = upd; f.viv.onchange = upd;
  f.name.oninput = () => { const id = NAME2ID[f.name.value.trim().toLowerCase()]; if (id){ f.dex.value = id; upd(); } };
  f.name.onchange = () => { const id = NAME2ID[f.name.value.trim().toLowerCase()]; if (id && DEX[id]?.de) f.name.value = DEX[id].de; };
  f.dex.oninput = () => { const n = nameOf(num(f.dex.value)); if (n && !f.name.value) f.name.value = n; upd(); };
  f.shiny.onchange = upd; upd();
}

/* ---------- Freunde ---------- */
function renderFriends(){
  let list = S.friends.slice();
  const q = FF.q.trim().toLowerCase();
  if (q) list = list.filter(f => [f.name, f.code, f.notes, f.region].join(' ').toLowerCase().includes(q));
  const fl = FF.flt;
  if (fl === 'due') list = list.filter(f => activity(f).due);
  if (fl === 'inactive') list = list.filter(f => activity(f).cls === 'no');
  if (fl === 'quiet') list = list.filter(f => ['no', 'lo'].includes(activity(f).cls));
  if (fl === 'lucky') list = list.filter(f => f.lucky);
  if (/^L\d$/.test(fl)) list = list.filter(f => (f.level || 0) === +fl[1]);
  const A = new Map(list.map(f => [f.id, activity(f)]));
  const so = {
    level: (a, b) => (b.level || 0) - (a.level || 0) || (friendProgress(a).left ?? 999) - (friendProgress(b).left ?? 999),
    next: (a, b) => (friendProgress(a).left ?? 999) - (friendProgress(b).left ?? 999),
    check: (a, b) => (A.get(a.id).nextCheck || '').localeCompare(A.get(b.id).nextCheck || ''),
    stale: (a, b) => (A.get(b.id).stale ?? -1) - (A.get(a.id).stale ?? -1),
    name: (a, b) => a.name.localeCompare(b.name, 'de')
  }[FF.sort] || ((a, b) => a.name.localeCompare(b.name, 'de'));
  list.sort((a, b) => so(a, b) || a.name.localeCompare(b.name, 'de'));
  const t = today(), all = S.friends;
  const cnt = fn => all.filter(fn).length;
  main.innerHTML = `
    <div class="stat">
      <div class="card"><b>${all.length}</b><span class="muted">Freunde</span></div>
      ${FL.map((l, i) => `<div class="card"><b>${cnt(f => (f.level || 0) === i)}</b><span class="muted">${l}</span></div>`).join('')}
      <div class="card"><b>${cnt(f => activity(f).due)}</b><span class="muted">Prüfung fällig</span></div>
      <div class="card"><b>${cnt(f => activity(f).cls === 'no')}</b><span class="muted">inaktiv?</span></div>
    </div>
    <div class="bar">
      <button class="b p" id="addF">+ Freund</button>
      <input id="fq" placeholder="Suchen (Name, Region, Code…)" value="${esc(FF.q)}" style="flex:1;min-width:160px">
      <select id="ff">${[['', 'Alle'], ['due', 'Prüfung fällig'], ['inactive', 'Inaktiv?'], ['quiet', 'Ruhig + inaktiv?'], ['lucky', 'Glücksfreunde'], ...FL.map((l, i) => ['L' + i, l])].map(([v, l]) => `<option value="${v}" ${FF.flt === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <select id="fs">${[['level', 'Freundeslevel'], ['next', 'Nächstes Level bald'], ['check', 'Nächste Prüfung zuerst'], ['stale', 'Am längsten ohne Änderung'], ['name', 'Name']].map(([v, l]) => `<option value="${v}" ${FF.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    </div>
    ${list.length ? `<div class="note" style="margin-bottom:8px">${list.length} Treffer</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(290px,1fr))">${list.slice(0, FF.lim).map(f => friendCard(f, A.get(f.id))).join('')}</div>
      ${list.length > FF.lim ? `<div style="text-align:center;margin:16px"><button class="b" id="moreF">Weitere ${Math.min(60, list.length - FF.lim)} anzeigen (${list.length - FF.lim} übrig)</button> <button class="b" id="allF">Alle anzeigen</button></div>` : ''}`
      : `<div class="empty">${all.length ? 'Nichts gefunden.' : 'Noch keine Freunde eingetragen – trag welche ein oder übernimm sie unter „Daten“.'}</div>`}`;
  addF.onclick = () => editFriend();
  const mf = document.getElementById('moreF'); if (mf) mf.onclick = () => { FF.lim += 60; renderFriends(); };
  const af = document.getElementById('allF'); if (af) af.onclick = () => { FF.lim = 1e6; renderFriends(); };
  fq.oninput = e => { FF.q = e.target.value; FF.lim = 60; renderFriends(); const n = document.getElementById('fq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  ff.onchange = e => { FF.flt = e.target.value; FF.lim = 60; renderFriends(); };
  fs.onchange = e => { FF.sort = e.target.value; FF.lim = 60; renderFriends(); };
  main.querySelectorAll('[data-act]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const f = S.friends.find(x => x.id === b.dataset.id);
    const a = b.dataset.act;
    if (a === 'edit') return editFriend(f);
    if (a === 'check') return checkFriend(f);
    if (a === 'card') return editCard(null, f.id);
  });
}
function friendCard(f, ac){
  ac = ac || activity(f);
  const pr = friendProgress(f), t = today(), lvl = f.level || 0;
  const cards = S.postcards.filter(c => c.friendId === f.id);
  const pats = [...new Set(cards.map(c => c.viv).filter(Boolean))];
  const hearts = '♥'.repeat(lvl) + '♡'.repeat(MAXLVL - lvl);
  // Frühestes Datum: Stand der Resttage (Prüfung/Eintrag) + Resttage, bei täglicher Interaktion
  const etaD = pr.left && f.leftDate ? new Date(new Date(f.leftDate + 'T12:00').getTime() + pr.left * 864e5) : null;
  const eta = !etaD ? '' : etaD.toISOString().slice(0, 10) <= t ? 'evtl. schon erreicht – prüfen' : 'frühestens ' + etaD.toLocaleDateString('de-DE');
  const trainer = [f.trainerLvl ? `Lv ${f.trainerLvl}` : '', f.xp != null ? `EP ${xpFmt(f.xp)}` : ''].filter(Boolean).join(' · ');
  const short = d => d ? new Date(d + 'T12:00').toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' }) : '–';
  return `<div class="card fr">
    <div class="row"><h3 class="sp">${esc(f.name)} ${f.lucky ? '<span class="bd lu">Glücksfreund</span>' : ''}</h3><button class="b s" data-act="edit" data-id="${f.id}" title="Bearbeiten">✎</button></div>
    <div class="muted" style="font-size:13px">${[esc(f.region || 'Herkunft unbekannt'), trainer, f.code ? esc(f.code) : ''].filter(Boolean).join(' · ')}</div>
    <div class="row" style="margin-top:8px"><span class="hearts" style="color:#e2557a">${hearts}</span><b class="sp">${FL[lvl]}</b></div>
    <div class="prog"><i style="width:${pr.pct}%"></i></div>
    <div class="note">${pr.next ? `Noch <b>${pr.left}</b> ${pr.unit} bis <b>${pr.next}</b>${eta ? ` · ${eta}` : ''}` : `Höchstes Level erreicht 🎉${f.left != null ? ` · Zähler laut Spiel: ${f.left}` : ''}`}</div>
    <div class="row" style="margin-top:10px">
      <span class="st ${ac.cls}">${ac.txt}</span>${ac.due ? '<span class="st lo">Prüfung fällig</span>' : ''}<span class="note sp">${ac.detail}</span>
    </div>
    <div class="note" style="margin-top:4px">Geprüft ${short(f.lastCheck)}${ac.checkAge != null ? ` (vor ${ac.checkAge} T)` : ''}${ac.nextCheck ? ` · nächste Prüfung ${short(ac.nextCheck)}` : ''} · EP geändert ${short(f.xpChanged)} · Freundschaft geändert ${short(f.friendChanged)}</div>
    ${pats.length ? `<div class="note" style="margin-top:4px">Vivillon: ${pats.map(k => vivDot(k) + esc(VIVMAP[k]?.[1])).join(', ')}</div>` : ''}
    ${cards.length ? `<div class="note" style="margin-top:2px">${cards.length} Postkarte${cards.length === 1 ? '' : 'n'}</div>` : ''}
    <div class="row" style="margin-top:10px">
      <button class="b s ${ac.due ? 'p' : ''}" data-act="check" data-id="${f.id}">Prüfen</button>
      <button class="b s" data-act="card" data-id="${f.id}">+ Postkarte</button>
    </div>
  </div>`;
}
function editFriend(f){
  const isNew = !f; f = f || { id: uid(), level: 0, left: 1, leftDate: today(), snaps: [], since: today() };
  const pr = friendProgress(f);
  const snaps = (f.snaps || []).slice().sort((a, b) => b.date.localeCompare(a.date));
  openDlg(isNew ? 'Freund hinzufügen' : esc(f.name), `
    <div class="fg">
      <label>Name / Trainername<input name="name" value="${esc(f.name)}" required></label>
      <label>Freundescode<input name="code" value="${esc(f.code)}" placeholder="1234 5678 9012"></label>
      <label>Herkunft (Land/Region)<input name="region" list="dlRegion" value="${esc(f.region)}"></label>
      <label>Freunde seit<input name="since" type="date" value="${f.since || ''}"></label>
    </div>
    <div class="sec">Freundschaft</div>
    <div class="fg">
      <label>Freundeslevel<select name="level">${FL.map((l, i) => `<option value="${i}" ${(f.level || 0) === i ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label>Resttage/-punkte laut Spiel<input name="left" type="number" min="0" max="90" value="${f.left ?? (pr.left ?? '')}"></label>
      <label class="chk"><input type="checkbox" name="lucky" ${f.lucky ? 'checked' : ''}> Glücksfreund</label>
    </div>
    <p class="note">Hier korrigierst du nur Level und Resttage (Stand: heute). Zum Abgleichen mit dem Spiel nimm „Prüfen“ – nur dort werden die Änderungsdaten fortgeschrieben.</p>
    <label class="fl">Notizen<textarea name="notes">${esc(f.notes)}</textarea></label>
    ${!isNew ? `<div class="sec">Stand</div><p class="note" style="margin:0">Letzte Prüfung: <b>${fmtDate(f.lastCheck)}</b> · EP zuletzt geändert: <b>${fmtDate(f.xpChanged)}</b> · Freundschaft zuletzt geändert: <b>${fmtDate(f.friendChanged)}</b>${f.importPrev ? `<br>Vorherige Werte aus Notion: EP ${xpFmt(f.importPrev.xp)} · Rest ${f.importPrev.left ?? '–'}` : ''}</p>` : ''}
    ${snaps.length ? `<div class="sec">Prüf-Verlauf</div><div style="overflow-x:auto"><table><tr><th>Datum</th><th>Lv</th><th>EP (4 Ziffern)</th><th>Freundeslevel</th><th>Rest</th><th></th></tr>
      ${snaps.map(s => `<tr><td>${fmtDate(s.date)}</td><td>${s.lvl ?? '–'}</td><td title="${s.xp ?? ''}">${xpFmt(s.xp)}</td><td>${s.level != null ? FL[s.level] : '–'}</td><td>${s.left ?? '–'}</td><td><button class="b s d" type="button" data-snap="${s.date}">✕</button></td></tr>`).join('')}</table></div>` : ''}`,
    isNew ? '' : `<button class="b d" value="del" formnovalidate style="margin-right:auto">Löschen</button>`,
    (fd, act) => {
      if (act === 'del'){ if (confirm(`${f.name} löschen? Postkarten bleiben erhalten.`)){ S.friends = S.friends.filter(x => x.id !== f.id); S.postcards.forEach(c => { if (c.friendId === f.id) c.friendId = ''; }); save(); render(); } return; }
      const lvl = +fd.get('level'), left = num(fd.get('left'));
      Object.assign(f, { name: fd.get('name').trim(), code: fd.get('code').trim(), region: fd.get('region').trim(), since: fd.get('since'), lucky: !!fd.get('lucky'), notes: fd.get('notes') });
      if (lvl !== (f.level || 0) || left !== (f.left ?? null)){
        f.level = lvl; f.left = left ?? spanOf(lvl); f.leftDate = today();
      }
      if (isNew) S.friends.push(f); save(); render();
    });
  dlgB.querySelectorAll('[data-snap]').forEach(b => b.onclick = () => { f.snaps = f.snaps.filter(s => s.date !== b.dataset.snap); save(); b.closest('tr').remove(); render(); });
}
// Abgleich mit dem Spiel: Werte eintragen, Änderungsdaten werden automatisch fortgeschrieben
function checkFriend(f){
  const c = f.chk || {};
  openDlg(`${esc(f.name)} prüfen`, `
    <p class="note" style="margin-top:0">Werte aus dem Freundesprofil im Spiel eintragen. Ändert sich etwas gegenüber der letzten Prüfung (${fmtDate(f.lastCheck)}), wird das Änderungsdatum auf den Prüftag gesetzt.</p>
    <div class="fg">

/* ===================== Poke-Genie-Import ===================== */
function parseCSVText(text){
  text = text.replace(/^﻿/, '');
  const firstLine = text.slice(0, text.indexOf('\n') + 1 || undefined);
  const delim = (firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; continue; }
    if (c === '"') q = true;
    else if (c === delim){ row.push(cur); cur = ''; }
    else if (c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  const head = rows.shift().map(h => h.trim());
  return rows.filter(r => r.some(v => v.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()])));
}
// Spaltennamen der deutschen und englischen Poke-Genie-Exporte
const PG = {
  name: ['Name'], form: ['Form'], dex: ['Pokemon-Nummer', 'Pokemon Number'], gender: ['Geschlecht', 'Gender'],
  cp: ['WP', 'CP'], hp: ['KP', 'HP'], a: ['Angr. IV', 'Atk IV'], d: ['Ver. IV', 'Def IV'], h: ['Ausd. IV', 'Sta IV'],
  lmin: ['Min-Level', 'Level Min'], lmax: ['Max-Level', 'Level Max'],
  fast: ['Schnell-Angriff', 'Quick Move'], c1: ['Auflade-Angriff', 'Charge Move'], c2: ['Auflade-Angriff 2', 'Charge Move 2'],
  scan: ['Scandatum', 'Scan Date'], orig: ['Ursprüngliches Scan-Datum', 'Original Scan Date'], caught: ['Datum Gefangen', 'Catch Date'],
  weight: ['Gewicht', 'Weight'], height: ['Größe', 'Height'], lucky: ['Glücks', 'Lucky'], align: ['Crypto/Erlöstes', 'Shadow/Purified'],
  fav: ['Favorit', 'Favorite'],
};
const pgGet = (row, k) => { for (const c of PG[k]) if (c in row) return row[c]; return ''; };
function pgDate(v){
  if (!v) return '';
  let m = v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  m = v.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[0];
  m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  return '';
}
const pgNum = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
function pgRow(r){
  const dex = num(pgGet(r, 'dex'));
  const form = pgGet(r, 'form');
  const g = pgGet(r, 'gender');
  const al = pgGet(r, 'align');
  const lmin = pgNum(pgGet(r, 'lmin')), lmax = pgNum(pgGet(r, 'lmax'));
  const orig = pgGet(r, 'orig') || pgGet(r, 'scan');
  const ivA = num(pgGet(r, 'a')), ivD = num(pgGet(r, 'd')), ivH = num(pgGet(r, 'h'));
  return {
    pgKey: [orig, ivA, ivD, ivH, g].join('|'),
    name: (dex && DEX[dex]?.de) || pgGet(r, 'name'), dex,
    form: /^normal$/i.test(form) ? '' : form,
    gender: g === '♂' ? 'm' : g === '♀' ? 'f' : '',
    cp: num(pgGet(r, 'cp')), hp: num(pgGet(r, 'hp')), ivA, ivD, ivH,
    level: lmin != null && lmax != null && lmin !== lmax ? lmin : (lmin ?? lmax),
    fast: pgGet(r, 'fast'), c1: pgGet(r, 'c1'), c2: pgGet(r, 'c2'),
    caught: pgDate(pgGet(r, 'caught')),
    weight: pgNum(pgGet(r, 'weight')), height: pgNum(pgGet(r, 'height')),
    lucky: pgGet(r, 'lucky') === '1',
    align: al === '1' ? 'shadow' : al === '2' ? 'purified' : '',
    pgFav: pgGet(r, 'fav') === '1',
    added: orig ? orig.replace(' ', 'T') : new Date().toISOString(),
    src: 'pokegenie'
  };
}
function importPokeGenie(text, removeMissing){
  const rows = parseCSVText(text);
  if (!rows.length || !('Pokemon-Nummer' in rows[0] || 'Pokemon Number' in rows[0])) throw new Error('Das sieht nicht nach einem Poke-Genie-Export aus.');
  const pool = {};
  S.pokemon.forEach(p => { if (p.pgKey) (pool[p.pgKey] ||= []).push(p); });
  const seen = new Set(); let added = 0, updated = 0, removed = 0;
  // Werte aus Poke Genie werden überschrieben, eigene Felder (Shiny, Kostüm, Hintergrund, Größe, Notizen …) bleiben
  for (const r of rows){
    const n = pgRow(r);
    const cands = (pool[n.pgKey] || []).filter(p => !seen.has(p.id));
    let m = null;
    if (cands.length) m = cands.sort((a, b) => ((a.dex === n.dex ? 0 : 1) - (b.dex === n.dex ? 0 : 1)) || Math.abs((a.cp || 0) - n.cp) - Math.abs((b.cp || 0) - n.cp))[0];
    if (m){
      const { added: _a, pgFav, form, ...upd } = n;
      if (!m.caught && !upd.caught) delete upd.caught;
      // Form nur übernehmen, wenn du sie nicht selbst geändert hast (pgForm = zuletzt aus Poke Genie übernommen).
      // Ältere Einträge ohne pgForm: eine vorhandene Form bleibt beim ersten Mal stehen.
      const own = m.pgForm === undefined ? !!m.form : m.form !== m.pgForm;
      if (!own) m.form = form;
      m.pgForm = form;
      Object.assign(m, upd); delete m.pgMissing; seen.add(m.id); updated++;
    } else {
      const { pgFav, ...rest } = n;
      const p = { id: uid(), ...rest, pgForm: rest.form, fav: pgFav };
      S.pokemon.push(p); seen.add(p.id); added++;
    }
  }
  let marked = 0;
  if (removeMissing){
    const keep = [];
    for (const p of S.pokemon){
      if (p.src !== 'pokegenie' || seen.has(p.id)){ keep.push(p); continue; }
      // Mit eigenen Angaben nie automatisch löschen, nur markieren
      if (hasOwnData(p)){ if (!p.pgMissing) p.pgMissing = today(); keep.push(p); marked++; }
      else removed++;
    }
    S.pokemon = keep;
  }
  return { total: rows.length, added, updated, removed, marked };
}
// Angaben, die nur du einträgst (Poke Genie exportiert sie nicht)
const hasOwnData = p => !!(p.shiny || p.specialMove || p.costume || p.costumeKey || p.bg || p.bgKey || p.size || p.dyna || p.viv || p.nick || p.tags || (p.notes && p.notes.trim()) || p.fav);
function openPgImport(){
  openDlg('Poke-Genie-Export importieren', `
    <p>In Poke Genie: <b>Einstellungen → Exportieren</b> (CSV) und die Datei hier auswählen.</p>
    <label class="fl">CSV-Datei<input type="file" name="file" accept=".csv,text/csv" required></label>
    <label class="chk" style="margin-top:12px"><input type="checkbox" name="rm"> Importierte Pokémon entfernen, die nicht mehr im Export sind (z. B. verschickt oder getauscht)</label>
    <p class="note" style="margin-top:2px">Pokémon mit eigenen Angaben (Shiny, Kostüm, Hintergrund, Spezialattacke, Notizen …) werden dabei nie gelöscht, sondern als „Nicht mehr im Export“ markiert – du entscheidest selbst.</p>
    <p class="note">Bei einem erneuten Import werden bereits importierte Pokémon wiedererkannt und aktualisiert (WP, Level, Attacken, Entwicklung …). Was du selbst einträgst – Shiny, Spezialattacke, Kostüm, Hintergrund, Größenklasse, Vivillon-Muster, Spitzname, Tags, Notizen – bleibt erhalten, denn das exportiert Poke Genie nicht. Eine Form, die du selbst geändert hast, wird nicht überschrieben.</p>
    <p class="note">Tipp: Vorher unter „Daten“ eine Sicherung exportieren.</p>`, '',
    async fd => {
      const f = fd.get('file'); if (!f || !f.size) return;
      try{
        const res = importPokeGenie(await f.text(), !!fd.get('rm'));
        const ok = await save();
        render();
        if (!ok) return alert('Import eingelesen, aber Speichern fehlgeschlagen – siehe roter Hinweis oben.');
        alert(`${res.total} Pokémon gelesen:\n• ${res.added} neu\n• ${res.updated} aktualisiert${res.removed ? `\n• ${res.removed} entfernt` : ''}${res.marked ? `\n• ${res.marked} als „Nicht mehr im Export“ markiert (mit eigenen Angaben – Filter „Nicht mehr im Export“)` : ''}`);
      }catch(err){ alert('Import fehlgeschlagen: ' + err.message); }
    });
}

/* ===================== Freunde-Import (Notion) ===================== */
// Akzeptiert die vorbereitete JSON-Datei (type "go-organizer-friends") oder einen CSV-Export der Notion-Datenbank.
// Verändert ausschließlich S.friends – Pokémon, Postkarten usw. bleiben unangetastet.
const MONTHS = { jan: 1, januar: 1, january: 1, feb: 2, februar: 2, february: 2, mär: 3, mar: 3, märz: 3, march: 3, apr: 4, april: 4, mai: 5, may: 5, jun: 6, juni: 6, june: 6, jul: 7, juli: 7, july: 7, aug: 8, august: 8, sep: 9, sept: 9, september: 9, okt: 10, oct: 10, oktober: 10, october: 10, nov: 11, november: 11, dez: 12, dec: 12, dezember: 12, december: 12 };
function anyDate(v){
  v = String(v || '').trim(); if (!v) return '';
  let m = v.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[0];
  m = v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  m = v.match(/^(\d{1,2})\.?\s+([A-Za-zÄÖÜäöü]+)\.?\s+(\d{4})/); if (m && MONTHS[m[2].toLowerCase()]) return `${m[3]}-${String(MONTHS[m[2].toLowerCase()]).padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  m = v.match(/^([A-Za-zÄÖÜäöü]+)\.?\s+(\d{1,2}),?\s+(\d{4})/); if (m && MONTHS[m[1].toLowerCase()]) return `${m[3]}-${String(MONTHS[m[1].toLowerCase()]).padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  return '';
}
const levelFromLabel = v => {
  const s = String(v ?? '').trim(); if (s === '') return null;
  const m = s.match(/^\(?(\d)\)?/); if (m) return Math.min(MAXLVL, +m[1]);
  const i = FL.findIndex(l => l.toLowerCase() === s.toLowerCase()); return i < 0 ? null : i;
};
const yes = v => /^(yes|ja|true|1|__yes__|✓|x)$/i.test(String(v ?? '').trim());
const numOrNull = v => { const s = String(v ?? '').replace(/[.\s]/g, '').replace(',', '.'); return s === '' || isNaN(+s) ? null : +s; };
function notionCsvToFriends(text){
  const rows = parseCSVText(text);
  if (!rows.length || !('Name' in rows[0]) || !('Freundeslevel' in rows[0])) throw new Error('Unbekanntes Format – erwartet wird der CSV-Export der Notion-Datenbank „Pokémon GO-Freunde“.');
  return rows.map(r => ({
    name: r['Name'], level: levelFromLabel(r['Freundeslevel']), trainerLvl: numOrNull(r['Lvl']),
    xp: numOrNull(r['XP zuletzt gesehen']), xpPrev: numOrNull(r['XP vorher']),
    left: numOrNull(r['Fortschritt zuletzt gesehen']), leftPrev: numOrNull(r['Fortschritt vorher']),
    lastCheck: anyDate(r['L. Prüf.']), xpChanged: anyDate(r['L. XP-Änd.']), friendChanged: anyDate(r['L. F-änd.']),
    region: r['Region'] || '', lucky: yes(r['Glücksfreund'])
  }));
}
function importFriends(list){
  const byName = new Map(S.friends.map(f => [f.name.trim().toLowerCase(), f]));
  let added = 0, updated = 0, skipped = 0;
  for (const r of list){
    const name = String(r.name || '').trim(); if (!name){ skipped++; continue; }
    let f = byName.get(name.toLowerCase());
    const isNew = !f;
    if (isNew){ f = { id: uid(), name, snaps: [] }; }
    const lvl = r.level ?? f.level ?? 0;
    Object.assign(f, {
      level: lvl, left: r.left ?? spanOf(lvl), leftDate: r.lastCheck || today(),
      trainerLvl: r.trainerLvl ?? f.trainerLvl ?? null, xp: r.xp ?? f.xp ?? null,
      lastCheck: r.lastCheck || f.lastCheck || '', xpChanged: r.xpChanged || f.xpChanged || '', friendChanged: r.friendChanged || f.friendChanged || '',
      lucky: !!r.lucky
    });
    if (r.region) f.region = r.region;
    if (r.xpPrev != null || r.leftPrev != null) f.importPrev = { xp: r.xpPrev, left: r.leftPrev };
    // EP werden über die letzten 4 Ziffern verglichen – ältere volle Werte bleiben zur Info erhalten
    f.chk = { date: f.lastCheck, lvl: f.trainerLvl, xp: f.xp, level: f.level, left: r.left ?? null };
    if (f.lastCheck){
      f.snaps = (f.snaps || []).filter(s => s.date !== f.lastCheck);
      f.snaps.push({ date: f.lastCheck, lvl: f.trainerLvl, xp: f.xp, level: f.level, left: r.left ?? null });
    }
    if (isNew){ S.friends.push(f); byName.set(name.toLowerCase(), f); added++; } else updated++;
  }
  return { added, updated, skipped };
}
function openFriendImport(){
  openDlg('Freunde importieren', `
    <p style="margin-top:0">Wähle die vorbereitete Datei <b>go-organizer-freunde.json</b> oder einen CSV-Export der Notion-Datenbank (Notion: „…“ → Exportieren → Markdown &amp; CSV).</p>
    <label class="fl">Datei<input type="file" name="file" accept=".json,.csv,application/json,text/csv" required></label>
    <p class="note">Übernommen werden Name, Freundeslevel, Resttage, Trainerlevel, EP, Region, Glücksfreund und die Daten der letzten Prüfung und Änderungen. Vorhandene Freunde mit gleichem Namen werden aktualisiert; Freundescode, Notizen und Postkarten bleiben erhalten. <b>Pokémon werden nicht verändert.</b></p>
    <p class="note">Tipp: Vorher unter „Daten“ eine Sicherung exportieren.</p>`, '',
    async fd => {
      const file = fd.get('file'); if (!file || !file.size) return;
      try{
        const text = await file.text();
        let list;
        if (/^\s*[\[{]/.test(text)){
          const d = JSON.parse(text);
          list = Array.isArray(d) ? d : d.friends;
          if (!Array.isArray(list) || (d.type && d.type !== 'go-organizer-friends')) throw new Error('Unbekanntes JSON-Format. Für eine komplette Sicherung bitte „Daten → Importieren“ verwenden.');
        } else list = notionCsvToFriends(text);
        const res = importFriends(list);
        const ok = await save(); render();
        alert(ok ? `${list.length} Freunde gelesen:\n• ${res.added} neu\n• ${res.updated} aktualisiert${res.skipped ? `\n• ${res.skipped} ohne Namen übersprungen` : ''}` : 'Import eingelesen, aber Speichern fehlgeschlagen – siehe roter Hinweis oben.');
      }catch(err){ alert('Import fehlgeschlagen: ' + err.message); }
    });
}

/* ===================== Dialog-Helfer ===================== */
let dlgCb = null;
function openDlg(title, body, extraBtns, cb){
  dlgT.innerHTML = title; dlgB.innerHTML = body;
  dlgF.innerHTML = `${extraBtns}<button class="b" value="cancel" formnovalidate>Abbrechen</button><button class="b p" value="ok">Speichern</button>`;
  dlgCb = cb; dlg.showModal();
  const first = dlgB.querySelector('input:not([type=checkbox]),select'); if (first) first.focus();
}
dlgForm.addEventListener('submit', e => {
  const act = e.submitter?.value;
  if (act === 'cancel') return;
  if (dlgCb) dlgCb(new FormData(dlgForm), act);
});

/* ===================== Theme & Start ===================== */
const TH = 'go-organizer-theme';
function applyTheme(t){ if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
try{ applyTheme(localStorage.getItem(TH)); }catch(e){}
themeBtn.onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const t = dark ? 'light' : 'dark'; applyTheme(t); try{ localStorage.setItem(TH, t); }catch(e){}
};
document.getElementById('main').innerHTML = '<div class="empty">Lade Daten…</div>';
/* GitHub-Sync: gleicht mit dem Ordner tool-daten/pokemon-go/ ab, sobald auf der Startseite eingerichtet */
function initSync(){
  if (!window.ToolSync || STORE_MODE !== 'idb') return;
  SYNC = ToolSync.create({
    tool: 'pokemon-go',
    collections: { pokemon: 'array', friends: 'array', postcards: 'array', regionHints: 'map' },
    shards: 16,   // Ordner pokemon-go/ (main.json + s00–s15.json); nur geänderte Teile werden hochgeladen. Zahl NIE ändern.
    fields: ['xpDigits'],
    get: () => S,
    apply: async d => { S = Object.assign(blank(), S, d); const ok = await save(); render(); return ok; }
  });
  SYNC.start();
}
initStore().then(() => { render(); loadDex(); initSync(); });
